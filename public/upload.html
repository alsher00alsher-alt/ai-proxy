<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🎥 رفع الفيديوهات</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#0f0;font-family:'Courier New',monospace;min-height:100vh;padding:20px;display:flex;align-items:center;justify-content:center}
.box{max-width:450px;width:100%;background:rgba(0,20,0,.8);border:2px solid #0f0;border-radius:20px;padding:30px;text-align:center}
h1{color:#f00;font-size:24px;margin-bottom:10px}
.sub{color:#0f0;font-size:12px;margin-bottom:20px}
input,textarea{width:100%;padding:14px;background:#000;border:1px solid #0f0;border-radius:10px;color:#0f0;font-size:14px;margin:8px 0;outline:none;font-family:monospace}
input:focus,textarea:focus{border-color:#f00}
.btn{width:100%;padding:16px;background:rgba(255,0,0,.1);border:2px solid #f00;border-radius:10px;color:#f00;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn:hover{background:#f00;color:#000}
.result{margin-top:15px;padding:15px;border-radius:10px;display:none}
.success{background:rgba(0,255,0,.1);color:#0f0;border:1px solid #0f0}
.error{background:rgba(255,0,0,.1);color:#f00;border:1px solid #f00}
.progress{width:100%;height:10px;background:#000;border-radius:5px;overflow:hidden;margin-top:10px;display:none}
.progress-fill{height:100%;background:linear-gradient(90deg,#0f0,#f00);border-radius:5px;width:0%;transition:width .3s}
</style>
</head>
<body>
<div class="box">
    <h1>🎥 رفع فيديو</h1>
    <p class="sub">Firebase Storage</p>
    
    <input type="file" id="videoFile" accept="video/*" style="color:#fff">
    <input type="text" id="videoTitle" placeholder="📝 عنوان الفيديو">
    <input type="text" id="videoDesc" placeholder="📋 الوصف (اختياري)">
    
    <button class="btn" onclick="uploadVideo()">⬆️ رفع الفيديو</button>
    
    <div class="progress" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="result" id="result"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
    apiKey: "AIzaSyAP5y7HnwhtDluewNkj_HhXXo_n6YTX1CE",
    authDomain: "mohamed-hosny-870e8.firebaseapp.com",
    projectId: "mohamed-hosny-870e8",
    storageBucket: "mohamed-hosny-870e8.firebasestorage.app",
    messagingSenderId: "920541729402",
    appId: "1:920541729402:web:5befbb421bd774723ae1c3"
});

const storage = firebase.storage();
const db = firebase.firestore();

async function uploadVideo() {
    const file = document.getElementById('videoFile').files[0];
    const title = document.getElementById('videoTitle').value.trim();
    const desc = document.getElementById('videoDesc').value.trim();
    const result = document.getElementById('result');
    
    if (!file) { showResult('❌ اختار فيديو', 'error'); return; }
    if (!title) { showResult('❌ اكتب عنوان', 'error'); return; }
    
    document.getElementById('progressBar').style.display = 'block';
    result.style.display = 'none';
    
    try {
        const storageRef = storage.ref('videos/' + Date.now() + '_' + file.name);
        const uploadTask = storageRef.put(file);
        
        uploadTask.on('state_changed',
            (snapshot) => {
                const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                document.getElementById('progressFill').style.width = progress + '%';
            },
            (error) => {
                showResult('❌ ' + error.message, 'error');
                document.getElementById('progressBar').style.display = 'none';
            },
            async () => {
                const downloadURL = await uploadTask.snapshot.ref.getDownloadURL();
                
                // حفظ في Firestore
                await db.collection('videos').add({
                    title: title,
                    desc: desc,
                    url: downloadURL,
                    createdAt: new Date().toISOString()
                });
                
                document.getElementById('progressBar').style.display = 'none';
                showResult('✅ تم الرفع!', 'success');
                document.getElementById('videoFile').value = '';
                document.getElementById('videoTitle').value = '';
                document.getElementById('videoDesc').value = '';
            }
        );
    } catch(e) {
        showResult('❌ ' + e.message, 'error');
    }
}

function showResult(msg, type) {
    const result = document.getElementById('result');
    result.textContent = msg;
    result.className = 'result ' + type;
    result.style.display = 'block';
}
</script>
</body>
</html>
