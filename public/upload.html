<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Center - Server Storage</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #00ff00;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .header {
            background: #111;
            border: 2px solid #00ff00;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 { color: #00ff00; font-size: 18px; }
        .header .info { color: #888; font-size: 10px; margin-top: 5px; }
        .box {
            background: #111;
            border: 1px solid #00ff00;
            padding: 20px;
            margin: 15px 0;
            border-radius: 5px;
        }
        .box h3 { color: #ffff00; margin-bottom: 15px; font-size: 13px; }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            background: #000;
            border: 1px dashed #00ff00;
            color: #00ff00;
            margin: 10px 0;
        }
        .btn {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #00ff00;
            background: #000;
            color: #00ff00;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
        }
        .btn:hover { background: #00ff00; color: #000; }
        .btn-danger { border-color: #ff0000; color: #ff0000; }
        .btn-danger:hover { background: #ff0000; color: #000; }
        .status {
            text-align: center;
            padding: 10px;
            margin: 10px 0;
            font-size: 11px;
            display: none;
            border-radius: 3px;
        }
        .success { background: rgba(0,255,0,0.1); color: #00ff00; border: 1px solid #00ff00; }
        .error { background: rgba(255,0,0,0.1); color: #ff0000; border: 1px solid #ff0000; }
        .file-list { margin-top: 15px; }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border: 1px solid #333;
            margin: 5px 0;
            font-size: 10px;
            border-radius: 3px;
            background: rgba(0,255,0,0.02);
        }
        .file-item:hover { border-color: #00ff00; }
        .file-item .name { flex: 1; word-break: break-all; }
        .file-item .size { color: #888; margin: 0 10px; }
        .file-item button {
            background: none;
            border: 1px solid #ff0000;
            color: #ff0000;
            cursor: pointer;
            padding: 5px 10px;
            font-size: 10px;
            font-family: 'Courier New', monospace;
        }
        .file-item button:hover { background: #ff0000; color: #000; }
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        .spinner {
            border: 2px solid #000;
            border-top: 2px solid #00ff00;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 0.8s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .stats {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        .stat {
            flex: 1;
            text-align: center;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 3px;
            font-size: 10px;
        }
        .stat .num { color: #ffff00; font-size: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📤 UPLOAD CENTER</h1>
            <div class="info">Server Storage | Vercel Blob</div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="num" id="photoCount">0</div>
                <div>📸 Photos</div>
            </div>
            <div class="stat">
                <div class="num" id="videoCount">0</div>
                <div>🎬 Videos</div>
            </div>
        </div>
        
        <div class="box">
            <h3>📸 Upload Photos</h3>
            <input type="file" id="photoInput" accept="image/*" multiple capture="environment">
            <button class="btn" onclick="uploadFiles('photos')">[ UPLOAD TO SERVER ]</button>
            <div class="status" id="photoStatus"></div>
        </div>
        
        <div class="box">
            <h3>🎬 Upload Videos</h3>
            <input type="file" id="videoInput" accept="video/*" multiple capture="environment">
            <button class="btn" onclick="uploadFiles('videos')">[ UPLOAD TO SERVER ]</button>
            <div class="status" id="videoStatus"></div>
        </div>
        
        <div class="box">
            <h3>📁 Files on Server</h3>
            <div class="file-list" id="fileList">
                <div class="loading" id="fileLoading">
                    <div class="spinner"></div>
                </div>
            </div>
            <button class="btn btn-danger" onclick="clearServer()">[ DELETE ALL ]</button>
            <div class="status" id="deleteStatus"></div>
        </div>
    </div>

    <script>
        const API = '/api/upload_file';

        async function uploadFiles(type) {
            const input = document.getElementById(type === 'photos' ? 'photoInput' : 'videoInput');
            const status = document.getElementById(type === 'photos' ? 'photoStatus' : 'videoStatus');
            const files = input.files;
            
            if (!files.length) {
                showStatus(status, '[!] Select files first!', 'error');
                return;
            }
            
            showStatus(status, `[↑] Uploading ${files.length} files...`, 'success');
            let uploaded = 0;
            
            for (const file of files) {
                const reader = new FileReader();
                
                await new Promise((resolve) => {
                    reader.onload = async function(e) {
                        try {
                            const res = await fetch(API, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    name: file.name,
                                    data: e.target.result,
                                    type: type
                                })
                            });
                            
                            const data = await res.json();
                            if (data.success) {
                                uploaded++;
                                showStatus(status, `[↑] ${uploaded}/${files.length} uploaded`, 'success');
                            }
                        } catch(err) {
                            showStatus(status, `[!] Error: ${file.name}`, 'error');
                        }
                        resolve();
                    };
                    reader.readAsDataURL(file);
                });
            }
            
            showStatus(status, `[✓] ${uploaded} files uploaded!`, 'success');
            input.value = '';
            setTimeout(() => status.style.display = 'none', 3000);
            loadFileList();
        }
        
        async function loadFileList() {
            const list = document.getElementById('fileList');
            const loading = document.getElementById('fileLoading');
            loading.style.display = 'block';
            
            try {
                const res = await fetch(API);
                const data = await res.json();
                
                let photos = 0, videos = 0;
                
                if (data.files && data.files.length > 0) {
                    list.innerHTML = data.files.map((f, i) => {
                        const isVideo = f.pathname.includes('/videos/');
                        if (isVideo) videos++; else photos++;
                        const name = f.pathname.split('/').pop().replace(/^\d+_/, '');
                        const size = (f.size / 1024).toFixed(1) + ' KB';
                        
                        return `
                            <div class="file-item">
                                <span>${isVideo ? '🎬' : '📸'}</span>
                                <span class="name">${name}</span>
                                <span class="size">${size}</span>
                                <button onclick="deleteFile('${f.url}')">DEL</button>
                            </div>
                        `;
                    }).join('');
                } else {
                    list.innerHTML = '<div style="text-align:center;color:#555;padding:20px;">No files on server</div>';
                }
                
                document.getElementById('photoCount').textContent = photos;
                document.getElementById('videoCount').textContent = videos;
            } catch(e) {
                list.innerHTML = '<div style="color:#ff0000;">Failed to load</div>';
            }
            
            loading.style.display = 'none';
        }
        
        async function deleteFile(url) {
            await fetch(API, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })
            });
            loadFileList();
        }
        
        async function clearServer() {
            if (!confirm('Delete ALL files from server?')) return;
            
            const status = document.getElementById('deleteStatus');
            showStatus(status, '[↑] Deleting...', 'success');
            
            try {
                const res = await fetch(API);
                const data = await res.json();
                
                if (data.files) {
                    for (const file of data.files) {
                        await fetch(API, {
                            method: 'DELETE',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ url: file.url })
                        });
                    }
                }
                
                showStatus(status, '[✓] All files deleted!', 'success');
            } catch(e) {
                showStatus(status, '[!] Error', 'error');
            }
            
            setTimeout(() => status.style.display = 'none', 2000);
            loadFileList();
        }
        
        function showStatus(el, msg, cls) {
            el.textContent = msg;
            el.className = 'status ' + cls;
            el.style.display = 'block';
        }
        
        loadFileList();
    </script>
</body>
</html>
