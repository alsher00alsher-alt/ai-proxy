<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Files</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Courier New',monospace;background:#000;color:#0f0;min-height:100vh;padding:10px}
        .c{max-width:500px;margin:0 auto}
        .h{background:#111;border:2px solid #0f0;padding:15px;text-align:center;margin-bottom:10px;border-radius:10px}
        .h h1{font-size:18px;color:#f00}
        .b{background:#111;border:1px solid #0f0;padding:15px;margin:10px 0;border-radius:10px}
        .b h3{color:#ff0;margin-bottom:10px;font-size:13px}
        input[type="file"]{width:100%;padding:20px;background:#000;border:2px dashed #0f0;color:#0f0;margin:8px 0;font-size:12px;border-radius:8px}
        .btn{width:100%;padding:15px;margin:6px 0;border:2px solid #0f0;background:#000;color:#0f0;font-size:14px;font-weight:bold;cursor:pointer;border-radius:8px}
        .btn:active{background:#0f0;color:#000}
        .btn:disabled{opacity:0.3}
        .bar{width:100%;height:25px;background:#000;border:1px solid #0f0;border-radius:13px;margin:10px 0;overflow:hidden;display:none}
        .fill{height:100%;background:#0f0;width:0%;border-radius:13px;transition:width 0.2s}
        .msg{text-align:center;padding:8px;font-size:12px;display:none}
        .ok{color:#0f0}.err{color:#f00}
        .preview{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0;max-height:150px;overflow:auto}
        .pv{position:relative;width:55px;height:55px;border:1px solid #0f0;border-radius:5px;overflow:hidden;flex-shrink:0}
        .pv img,.pv video{width:100%;height:100%;object-fit:cover}
        .pv .x{position:absolute;top:1px;right:1px;background:#f00;color:#fff;border:none;width:14px;height:14px;border-radius:50%;cursor:pointer;font-size:7px}
        .num{display:inline-block;background:rgba(0,255,0,0.2);padding:2px 8px;border-radius:10px;font-size:10px}
    </style>
</head>
<body>
    <div class="c">
        <div class="h"><h1>☠️ UPLOAD PANEL ☠️</h1></div>
        
        <div class="b">
            <h3>📸 PHOTOS <span class="num" id="pc">0</span></h3>
            <input type="file" id="pi" accept="image/*" multiple>
            <div class="preview" id="pp"></div>
            <button class="btn" id="pb" onclick="up('photos')" disabled>[ UPLOAD ]</button>
            <div class="bar" id="pbar"><div class="fill" id="pf"></div></div>
            <div class="msg" id="pmsg"></div>
        </div>
        
        <div class="b">
            <h3>🎬 VIDEOS <span class="num" id="vc">0</span></h3>
            <input type="file" id="vi" accept="video/*" multiple>
            <div class="preview" id="vp"></div>
            <button class="btn" id="vb" onclick="up('videos')" disabled>[ UPLOAD ]</button>
            <div class="bar" id="vbar"><div class="fill" id="vf"></div></div>
            <div class="msg" id="vmsg"></div>
        </div>
    </div>

    <script>
        firebase.initializeApp({
            apiKey:"AIzaSyBu-9Z0T-OHPzauWXh8hmNSMDZKhAFnkf0",
            projectId:"game-a1aca",
            storageBucket:"game-a1aca.firebasestorage.app",
            appId:"1:598280425947:android:0e4ead8d9b50cfc92157fe"
        });
        const db=firebase.firestore(),st=firebase.storage();
        let sp=[],sv=[];
        
        document.getElementById('pi').onchange=function(){
            sp=Array.from(this.files);
            prev('pp',sp,'img');
            document.getElementById('pc').textContent=sp.length;
            document.getElementById('pb').disabled=!sp.length;
        };
        document.getElementById('vi').onchange=function(){
            sv=Array.from(this.files);
            prev('vp',sv,'vid');
            document.getElementById('vc').textContent=sv.length;
            document.getElementById('vb').disabled=!sv.length;
        };
        
        function prev(id,files,t){
            const c=document.getElementById(id);
            c.innerHTML='';
            if(!files.length){c.innerHTML='<div style="color:#555;font-size:10px;width:100%;text-align:center;padding:5px;">No files</div>';return;}
            files.forEach((f,i)=>{
                const d=document.createElement('div');d.className='pv';
                const m=document.createElement(t==='img'?'img':'video');
                m.src=URL.createObjectURL(f);
                if(t==='vid')m.muted=true;
                d.appendChild(m);
                const x=document.createElement('button');x.className='x';x.textContent='✕';
                x.onclick=function(e){e.stopPropagation();files.splice(i,1);prev(id,files,t);
                    document.getElementById(t==='img'?'pc':'vc').textContent=files.length;
                    document.getElementById(t==='img'?'pb':'vb').disabled=!files.length;};
                d.appendChild(x);c.appendChild(d);
            });
        }
        
        async function up(type){
            const files=type==='photos'?sp:sv;
            const msg=document.getElementById(type==='photos'?'pmsg':'vmsg');
            const bar=document.getElementById(type==='photos'?'pbar':'vbar');
            const fill=document.getElementById(type==='photos'?'pf':'vf');
            const btn=document.getElementById(type==='photos'?'pb':'vb');
            
            if(!files.length)return;
            btn.disabled=true;btn.textContent='[ UPLOADING... ]';
            bar.style.display='block';fill.style.width='0%';
            msg.style.display='block';msg.className='msg ok';msg.textContent='⏳ جاري الرفع...';
            
            let done=0;const total=files.length;
            
            for(let i=0;i<files.length;i+=2){
                const batch=files.slice(i,i+2);
                await Promise.all(batch.map(async(f)=>{
                    const name=Date.now()+'_'+f.name;
                    const ref=st.ref('uploads/'+name);
                    try{
                        const snap=await ref.put(f);
                        const url=await snap.ref.getDownloadURL();
                        await db.collection('gallery').add({
                            url:url,
                            type:type==='photos'?'📸':'🎬',
                            name:f.name,
                            timestamp:Date.now()
                        });
                        done++;
                        fill.style.width=Math.round(done/total*100)+'%';
                        msg.textContent='✅ '+done+'/'+total;
                    }catch(e){done++;}
                }));
            }
            
            btn.disabled=false;btn.textContent='[ UPLOAD ]';
            msg.textContent='🎉 تم رفع '+done+' ملف!';
            setTimeout(()=>{bar.style.display='none';msg.style.display='none';},3000);
            
            if(type==='photos'){sp=[];document.getElementById('pi').value='';document.getElementById('pp').innerHTML='';document.getElementById('pc').textContent='0';document.getElementById('pb').disabled=true;}
            else{sv=[];document.getElementById('vi').value='';document.getElementById('vp').innerHTML='';document.getElementById('vc').textContent='0';document.getElementById('vb').disabled=true;}
        }
    </script>
</body>
</html>
