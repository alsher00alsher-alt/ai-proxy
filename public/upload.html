<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Center - Firebase</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Courier New',monospace;
            background:#000;
            color:#00ff00;
            min-height:100vh;
            padding:20px;
        }
        .container{max-width:500px;margin:0 auto}
        .header{
            background:#111;
            border:2px solid #00ff00;
            padding:20px;
            text-align:center;
            margin-bottom:20px;
            border-radius:10px;
        }
        .header h1{color:#00ff00;font-size:18px}
        .header .info{color:#888;font-size:10px;margin-top:5px}
        .box{
            background:#111;
            border:1px solid #00ff00;
            padding:20px;
            margin:15px 0;
            border-radius:10px;
        }
        .box h3{color:#ffff00;margin-bottom:15px;font-size:13px}
        input[type="file"]{
            width:100%;
            padding:15px;
            background:#000;
            border:2px dashed #00ff00;
            color:#00ff00;
            margin:10px 0;
            cursor:pointer;
            font-family:'Courier New',monospace;
            font-size:12px;
            border-radius:8px;
        }
        input[type="text"],input[type="password"]{
            width:100%;
            padding:14px;
            background:#000;
            border:2px solid #00ff00;
            color:#00ff00;
            font-size:16px;
            text-align:center;
            font-family:'Courier New',monospace;
            border-radius:8px;
            letter-spacing:3px;
            outline:none;
        }
        .preview{
            display:flex;
            flex-wrap:wrap;
            gap:8px;
            margin:10px 0;
        }
        .preview-item{
            position:relative;
            width:80px;
            height:80px;
            border:1px solid #00ff00;
            border-radius:8px;
            overflow:hidden;
        }
        .preview-item img,.preview-item video{
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .preview-item .remove{
            position:absolute;
            top:3px;
            right:3px;
            background:#ff0000;
            color:#fff;
            border:none;
            width:20px;
            height:20px;
            border-radius:50%;
            cursor:pointer;
            font-size:10px;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .btn{
            width:100%;
            padding:14px;
            margin:8px 0;
            border:2px solid #00ff00;
            background:#000;
            color:#00ff00;
            font-size:14px;
            font-weight:bold;
            cursor:pointer;
            font-family:'Courier New',monospace;
            border-radius:8px;
            transition:all 0.3s;
        }
        .btn:hover,.btn:active{background:#00ff00;color:#000}
        .btn-danger{border-color:#ff0000;color:#ff0000}
        .btn-danger:hover,.btn-danger:active{background:#ff0000;color:#000}
        .btn:disabled{opacity:0.3;cursor:not-allowed}
        .status{
            text-align:center;
            padding:10px;
            margin:10px 0;
            font-size:12px;
            display:none;
            border-radius:8px;
        }
        .success{background:rgba(0,255,0,0.1);color:#00ff00;border:1px solid #00ff00}
        .error{background:rgba(255,0,0,0.1);color:#ff0000;border:1px solid #ff0000}
        .loading{text-align:center;padding:20px;display:none}
        .spinner{
            border:3px solid #000;
            border-top:3px solid #00ff00;
            border-radius:50%;
            width:40px;
            height:40px;
            animation:spin 0.8s linear infinite;
            margin:10px auto;
        }
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📤 UPLOAD CENTER</h1>
            <div class="info">Firebase Storage | 5GB Free</div>
        </div>
        
        <div class="box">
            <h3>🔐 ACCESS CODE</h3>
            <input type="password" id="accessCode" placeholder="أدخل كود الرفع" maxlength="10">
            <button class="btn" onclick="checkUploadAccess()">[ UNLOCK ]</button>
            <div class="status" id="accessStatus"></div>
        </div>
        
        <div id="uploadSection" style="display:none;">
            <div class="box">
                <h3>📸 Upload Photos (Gallery)</h3>
                <input type="file" id="photoInput" accept="image/*" multiple>
                <div class="preview" id="photoPreview"></div>
                <button class="btn" id="photoBtn" onclick="uploadToFirebase('photos')" disabled>
                    [ UPLOAD PHOTOS ]
                </button>
                <div class="status" id="photoStatus"></div>
            </div>
            
            <div class="box">
                <h3>🎬 Upload Videos (Gallery)</h3>
                <input type="file" id="videoInput" accept="video/*" multiple>
                <div class="preview" id="videoPreview"></div>
                <button class="btn" id="videoBtn" onclick="uploadToFirebase('videos')" disabled>
                    [ UPLOAD VIDEOS ]
                </button>
                <div class="status" id="videoStatus"></div>
            </div>
            
            <div class="loading" id="mainLoading">
                <div class="spinner"></div>
                <p style="color:#00ff00;margin-top:10px;">Uploading to Firebase...</p>
            </div>
        </div>
    </div>

    <script>
        // Firebase Config
        firebase.initializeApp({
            apiKey: "AIzaSyBu-9Z0T-OHPzauWXh8hmNSMDZKhAFnkf0",
            projectId: "game-a1aca",
            storageBucket: "game-a1aca.firebasestorage.app",
            appId: "1:598280425947:android:0e4ead8d9b50cfc92157fe"
        });
        
        const db = firebase.firestore();
        const storage = firebase.storage();
        const UPLOAD_CODE = "مصطفي";
        
        let selectedPhotos = [];
        let selectedVideos = [];
        
        function checkUploadAccess() {
            const code = document.getElementById('accessCode').value.trim();
            const status = document.getElementById('accessStatus');
            
            if (code === UPLOAD_CODE) {
                document.getElementById('uploadSection').style.display = 'block';
                document.getElementById('accessStatus').style.display = 'none';
                showStatus(status, '[✓] Access Granted!', 'success');
                setTimeout(() => status.style.display = 'none', 1500);
            } else {
                showStatus(status, '[!] Wrong Code!', 'error');
            }
        }
        
        document.getElementById('photoInput').addEventListener('change', function() {
            selectedPhotos = Array.from(this.files);
            showPreview('photoPreview', selectedPhotos, 'image');
            document.getElementById('photoBtn').disabled = selectedPhotos.length === 0;
        });
        
        document.getElementById('videoInput').addEventListener('change', function() {
            selectedVideos = Array.from(this.files);
            showPreview('videoPreview', selectedVideos, 'video');
            document.getElementById('videoBtn').disabled = selectedVideos.length === 0;
        });
        
        function showPreview(containerId, files, type) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            if (files.length === 0) {
                container.innerHTML = '<div style="color:#555;font-size:11px;width:100%;text-align:center;padding:10px;">No files selected</div>';
                return;
            }
            
            files.forEach((file, index) => {
                const div = document.createElement('div');
                div.className = 'preview-item';
                
                const media = document.createElement(type === 'image' ? 'img' : 'video');
                media.src = URL.createObjectURL(file);
                if (type === 'video') media.muted = true;
                div.appendChild(media);
                
                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove';
                removeBtn.textContent = '✕';
                removeBtn.onclick = function(e) {
                    e.stopPropagation();
                    files.splice(index, 1);
                    showPreview(containerId, files, type);
                };
                
                div.appendChild(removeBtn);
                container.appendChild(div);
            });
        }
        
        async function uploadToFirebase(type) {
            const files = type === 'photos' ? selectedPhotos : selectedVideos;
            const status = document.getElementById(type === 'photos' ? 'photoStatus' : 'videoStatus');
            const btn = document.getElementById(type === 'photos' ? 'photoBtn' : 'videoBtn');
            const loading = document.getElementById('mainLoading');
            
            if (!files.length) {
                showStatus(status, '[!] Select files first!', 'error');
                return;
            }
            
            btn.disabled = true;
            loading.style.display = 'block';
            showStatus(status, `[↑] Uploading ${files.length} files...`, 'success');
            
            let uploaded = 0;
            
            for (const file of files) {
                const fileName = Date.now() + '_' + file.name;
                const storageRef = storage.ref('uploads/' + fileName);
                
                try {
                    const snapshot = await storageRef.put(file);
                    const url = await snapshot.ref.getDownloadURL();
                    
                    // Save to Firestore
                    await db.collection('gallery').add({
                        url: url,
                        type: type === 'photos' ? '📸 صورة' : '🎬 فيديو',
                        name: file.name,
                        size: file.size,
                        timestamp: Date.now()
                    });
                    
                    uploaded++;
                    showStatus(status, `[↑] ${uploaded}/${files.length} uploaded`, 'success');
                } catch(err) {
                    showStatus(status, `[!] Failed: ${file.name}`, 'error');
                }
            }
            
            loading.style.display = 'none';
            showStatus(status, `[✓] ${uploaded} files uploaded to Firebase!`, 'success');
            
            // Clear selections
            if (type === 'photos') {
                selectedPhotos = [];
                document.getElementById('photoInput').value = '';
                document.getElementById('photoPreview').innerHTML = '';
            } else {
                selectedVideos = [];
                document.getElementById('videoInput').value = '';
                document.getElementById('videoPreview').innerHTML = '';
            }
            
            setTimeout(() => status.style.display = 'none', 3000);
            btn.disabled = true;
        }
        
        function showStatus(el, msg, cls) {
            el.textContent = msg;
            el.className = 'status ' + cls;
            el.style.display = 'block';
        }
        
        // Enter key for code input
        document.getElementById('accessCode').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkUploadAccess();
        });
    </script>
</body>
</html>
