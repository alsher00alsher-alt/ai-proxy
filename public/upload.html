<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Links</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:monospace;background:#000;color:#0f0;padding:10px}
        .c{max-width:500px;margin:0 auto}
        .h{background:#111;border:2px solid #f00;padding:15px;text-align:center;margin-bottom:10px;border-radius:10px}
        .h h1{font-size:16px;color:#f00}
        .box{background:#111;border:1px solid #0f0;padding:15px;margin:10px 0;border-radius:10px}
        .box h3{color:#ff0;margin-bottom:8px;font-size:13px}
        textarea{width:100%;height:100px;background:#000;border:1px solid #0f0;color:#0f0;padding:10px;font-size:10px;border-radius:8px;font-family:monospace;resize:vertical}
        .btn{width:100%;padding:14px;margin:5px 0;border:2px solid #0f0;background:#000;color:#0f0;font-size:13px;font-weight:bold;cursor:pointer;border-radius:8px}
        .btn:active{background:#0f0;color:#000}
        .btn-red{border-color:#f00;color:#f00}
        .btn-red:active{background:#f00;color:#000}
        .msg{text-align:center;padding:10px;font-size:11px;display:none;border-radius:6px;margin:5px 0}
        .ok{background:rgba(0,255,0,0.1);border:1px solid #0f0;color:#0f0}
        .err{background:rgba(255,0,0,0.1);border:1px solid #f00;color:#f00}
        .hint{color:#888;font-size:9px;text-align:center;margin:5px 0}
        .count{color:#ff0;font-size:10px;text-align:center}
    </style>
</head>
<body>
    <div class="c">
        <div class="h"><h1>☠️ UPLOAD LINKS ☠️</h1></div>
        
        <div class="box">
            <h3>📸 PHOTOS LINKS</h3>
            <div class="hint">رابط واحد في كل سطر</div>
            <textarea id="photosInput" placeholder="https://i.ibb.co/xxxx/photo1.jpg
https://i.ibb.co/xxxx/photo2.jpg
https://download.mediafire.com/xxxx/photo3.jpg"></textarea>
            <button class="btn" onclick="saveLinks('photos')">[ SAVE PHOTOS ]</button>
            <div class="msg" id="photoMsg"></div>
            <div class="count" id="photoCount"></div>
        </div>
        
        <div class="box">
            <h3>🎬 VIDEOS LINKS</h3>
            <div class="hint">رابط واحد في كل سطر</div>
            <textarea id="videosInput" placeholder="https://download.mediafire.com/xxxx/video1.mp4
https://www.youtube.com/embed/xxxx"></textarea>
            <button class="btn" onclick="saveLinks('videos')">[ SAVE VIDEOS ]</button>
            <div class="msg" id="videoMsg"></div>
            <div class="count" id="videoCount"></div>
        </div>
        
        <button class="btn btn-red" onclick="clearAll()">[ DELETE ALL ]</button>
        <div class="msg" id="deleteMsg"></div>
    </div>

    <script>
        firebase.initializeApp({
            apiKey:"AIzaSyBu-9Z0T-OHPzauWXh8hmNSMDZKhAFnkf0",
            projectId:"game-a1aca",
            storageBucket:"game-a1aca.firebasestorage.app",
            appId:"1:598280425947:android:0e4ead8d9b50cfc92157fe"
        });
        const db=firebase.firestore();
        
        loadCounts();
        
        async function saveLinks(type){
            const input=document.getElementById(type==='photos'?'photosInput':'videosInput');
            const msg=document.getElementById(type==='photos'?'photoMsg':'videoMsg');
            const links=input.value.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
            
            if(!links.length){
                showMsg(msg,'[!] حط روابط الأول!','err');
                return;
            }
            
            showMsg(msg,'⏳ جاري الحفظ...','ok');
            
            try{
                for(const link of links){
                    await db.collection('gallery').add({
                        url:link,
                        type:type==='photos'?'📸 صورة':'🎬 فيديو',
                        name:link.split('/').pop().substring(0,30),
                        timestamp:Date.now()
                    });
                }
                showMsg(msg,'✅ تم حفظ '+links.length+' رابط!','ok');
                input.value='';
                loadCounts();
            }catch(e){
                showMsg(msg,'[!] خطأ: '+e.message,'err');
            }
        }
        
        async function clearAll(){
            if(!confirm('مسح كل الروابط؟'))return;
            const msg=document.getElementById('deleteMsg');
            showMsg(msg,'⏳ جاري المسح...','ok');
            try{
                const snap=await db.collection('gallery').get();
                const batch=db.batch();
                snap.forEach(doc=>batch.delete(doc.ref));
                await batch.commit();
                showMsg(msg,'✅ تم مسح الكل!','ok');
                loadCounts();
            }catch(e){
                showMsg(msg,'[!] خطأ','err');
            }
        }
        
        async function loadCounts(){
            const snap=await db.collection('gallery').get();
            let p=0,v=0;
            snap.forEach(d=>{
                const t=d.data().type||'';
                t.includes('🎬')?v++:p++;
            });
            document.getElementById('photoCount').textContent='📸 '+p+' photos saved';
            document.getElementById('videoCount').textContent='🎬 '+v+' videos saved';
        }
        
        function showMsg(el,text,cls){
            el.textContent=text;el.className='msg '+cls;el.style.display='block';
            setTimeout(()=>el.style.display='none',3000);
        }
    </script>
</body>
</html>
