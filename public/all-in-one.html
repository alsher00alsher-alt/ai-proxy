<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Chat + Sites</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#050508;--surface:#0d0d14;--primary:#8b5cf6;--danger:#ef4444;--text:#f1f5f9;--muted:#94a3b8;--border:#1e2040}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
        
        .normal-mode{display:flex;flex-direction:column;height:100vh}
        .header{background:var(--surface);padding:12px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
        .header .logo{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#ec4899);display:flex;align-items:center;justify-content:center;font-size:22px}
        .header .info{flex:1}.header h1{font-size:16px;font-weight:800}.header p{font-size:10px;color:var(--muted)}
        
        .chat-box{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;max-width:700px;margin:0 auto;width:100%}
        .msg{display:flex;gap:10px;max-width:85%}.msg.user{align-self:flex-end;flex-direction:row-reverse}.msg.bot{align-self:flex-start}
        .msg-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
        .msg.bot .msg-avatar{background:linear-gradient(135deg,var(--primary),#ec4899)}.msg.user .msg-avatar{background:var(--surface);border:1px solid var(--border)}
        .msg-bubble{padding:12px 16px;border-radius:14px;font-size:13px;line-height:1.6}.msg.bot .msg-bubble{background:var(--surface);border:1px solid var(--border)}.msg.user .msg-bubble{background:var(--primary);color:#fff}
        
        .input-bar{background:var(--surface);padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:10px;max-width:700px;margin:0 auto;width:100%}
        .input-bar input{flex:1;padding:14px 20px;background:var(--bg);border:2px solid var(--border);border-radius:25px;color:var(--text);outline:none;font-size:14px;font-family:'Cairo',sans-serif}
        .input-bar input:focus{border-color:var(--primary)}
        .send-btn{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#ec4899);border:none;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0}
        
        .typing{display:flex;gap:3px;padding:5px 0}.typing span{width:5px;height:5px;background:var(--muted);border-radius:50%;animation:bounce 1.4s infinite}
        .typing span:nth-child(1){animation-delay:0s}.typing span:nth-child(2){animation-delay:0.2s}.typing span:nth-child(3){animation-delay:0.4s}
        @keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
        
        .bottom-bar{background:var(--surface);padding:8px 12px;border-top:1px solid var(--border);display:flex;gap:6px}
        .bottom-bar button{flex:1;padding:14px;border:none;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;font-family:'Cairo',sans-serif;color:#fff}
        .btn-site1{background:linear-gradient(135deg,var(--primary),#ec4899)}.btn-site2{background:linear-gradient(135deg,var(--secondary),#10b981)}.btn-swap{background:#f59e0b;flex:0.5}
        .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:999;background:var(--surface);border:1px solid var(--primary);color:var(--primary);padding:10px 24px;border-radius:25px;font-size:13px}
    </style>
</head>
<body>

<div class="normal-mode" id="normalMode">
    <div class="header">
        <div class="logo">🤖</div>
        <div class="info"><h1>AI Chat</h1><p>Agnes AI + WebView</p></div>
    </div>
    
    <div class="chat-box" id="chatBox">
        <div class="msg bot"><div class="msg-avatar">🤖</div><div class="msg-bubble">👋 أهلاً! أنا Agnes AI<br><br>🔽 <b>اضغط الأزرار تحت</b> لفتح المواقع في المتصفح</div></div>
    </div>
    
    <div class="input-bar">
        <input type="text" id="prompt" placeholder="✍️ اكتب سؤالك..." onkeydown="if(event.key==='Enter')send()">
        <button class="send-btn" onclick="send()">➤</button>
    </div>
    
    <div class="bottom-bar">
        <button class="btn-site1" onclick="openSite('https://ai-undress.ai/ar')">🔝 الموقع</button>
        <button class="btn-swap" onclick="swapSites()">🔃</button>
        <button class="btn-site2" onclick="openSite('https://moakt.com/ar/inbox')">🔽 بريد</button>
    </div>
</div>

<script>
const API='/api/agnes';
let site1='https://ai-undress.ai/ar',site2='https://moakt.com/ar/inbox';

function toast(m){let t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2000);}

function openSite(url){
    toast('✅ جاري الفتح...');
    setTimeout(()=>{window.open(url,'_blank');},300);
}

function swapSites(){
    [site1,site2]=[site2,site1];
    document.querySelector('.btn-site1').textContent='🔝 الموقع';
    document.querySelector('.btn-site2').textContent='🔽 بريد';
    // تحديث الروابط
    document.querySelector('.btn-site1').onclick=()=>openSite(site1);
    document.querySelector('.btn-site2').onclick=()=>openSite(site2);
    toast('🔃 تم تبديل المواقع');
}

function addMsg(role,html){
    let d=document.createElement('div');d.className='msg '+role;
    d.innerHTML=`<div class="msg-avatar">${role==='user'?'👤':'🤖'}</div><div class="msg-bubble">${html}</div>`;
    document.getElementById('chatBox').appendChild(d);d.scrollIntoView({behavior:'smooth'});
}
function loader(){
    let d=document.createElement('div');d.className='msg bot';
    d.innerHTML='<div class="msg-avatar">🤖</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    document.getElementById('chatBox').appendChild(d);d.scrollIntoView({behavior:'smooth'});return d;
}
async function send(){
    let t=document.getElementById('prompt').value.trim();if(!t)return;
    document.getElementById('prompt').value='';addMsg('user',t);
    let l=loader();
    try{
        let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'chat',message:t})});
        let d=await r.json();l.remove();
        addMsg('bot',d.success?d.message:'❌ حدث خطأ');
    }catch(e){l.remove();addMsg('bot','❌ خطأ في الاتصال');}
}
</script>
</body>
</html>
