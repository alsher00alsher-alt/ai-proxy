<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Chat + WebView</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#050508;--surface:#0d0d14;--primary:#8b5cf6;--danger:#ef4444;--text:#f1f5f9;--muted:#94a3b8;--border:#1e2040;--secondary:#06b6d4}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
        
        .container{display:flex;flex-direction:column;height:100vh}
        
        .top-bar{background:var(--surface);padding:8px 10px;display:flex;gap:6px;border-bottom:1px solid var(--border);flex-wrap:wrap;flex-shrink:0}
        .top-bar button{padding:10px 14px;border:none;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;color:#fff;flex:1;min-width:60px;white-space:nowrap}
        .btn-chat{background:var(--primary)}.btn-site1{background:linear-gradient(135deg,var(--primary),#ec4899)}.btn-site2{background:linear-gradient(135deg,var(--secondary),#10b981)}.btn-split{background:#f59e0b}.btn-close{background:var(--danger)}
        
        .main-content{flex:1;overflow:hidden;position:relative}
        
        .panel{position:absolute;inset:0;display:none;overflow:hidden}
        .panel.active{display:flex;flex-direction:column}
        .panel iframe{width:100%;height:100%;border:none;flex:1}
        
        .chat-panel{background:var(--bg)}
        .chat-panel .chat-box{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px}
        .chat-panel .input-bar{display:flex;gap:8px;padding:10px;background:var(--surface);border-top:1px solid var(--border)}
        .chat-panel .input-bar input{flex:1;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:20px;color:var(--text);outline:none;font-size:13px;font-family:'Cairo',sans-serif}
        .chat-panel .input-bar button{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#ec4899);border:none;color:#fff;font-size:16px;cursor:pointer}
        
        .msg{display:flex;gap:8px;max-width:85%}.msg.user{align-self:flex-end;flex-direction:row-reverse}.msg.bot{align-self:flex-start}
        .msg-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
        .msg.bot .msg-avatar{background:linear-gradient(135deg,var(--primary),#ec4899)}.msg.user .msg-avatar{background:var(--surface);border:1px solid var(--border)}
        .msg-bubble{padding:10px 14px;border-radius:12px;font-size:12px;line-height:1.5}.msg.bot .msg-bubble{background:var(--surface);border:1px solid var(--border)}.msg.user .msg-bubble{background:var(--primary);color:#fff}
        
        .typing{display:flex;gap:3px;padding:3px 0}.typing span{width:4px;height:4px;background:var(--muted);border-radius:50%;animation:bounce 1.4s infinite}
        .typing span:nth-child(1){animation-delay:0s}.typing span:nth-child(2){animation-delay:0.2s}.typing span:nth-child(3){animation-delay:0.4s}
        @keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
        
        .split-view{flex-direction:row!important}
        .split-view .split-left,.split-view .split-right{flex:1;overflow:hidden;position:relative}
        .split-view .split-divider{width:3px;background:var(--primary);cursor:col-resize;flex-shrink:0}
        .split-view iframe{width:100%;height:100%;border:none}
    </style>
</head>
<body>

<div class="container">
    <!-- شريط الأزرار -->
    <div class="top-bar">
        <button class="btn-chat" onclick="showPanel('chat')">💬 شات</button>
        <button class="btn-site1" onclick="showPanel('site1')">🔝 الموقع</button>
        <button class="btn-site2" onclick="showPanel('site2')">🔽 بريد</button>
        <button class="btn-split" onclick="showSplit()">📱 تقسيم</button>
    </div>
    
    <!-- المحتوى الرئيسي -->
    <div class="main-content" id="mainContent">
        <!-- الشات -->
        <div class="panel chat-panel active" id="chatPanel">
            <div class="chat-box" id="chatBox">
                <div class="msg bot"><div class="msg-avatar">🤖</div><div class="msg-bubble">👋 أهلاً! أنا Agnes AI<br>🔝 <b>اضغط "الموقع" فوق</b> لفتح الموقع<br>📱 <b>اضغط "تقسيم"</b> لعرض الاتنين</div></div>
            </div>
            <div class="input-bar">
                <input type="text" id="prompt" placeholder="✍️ اكتب..." onkeydown="if(event.key==='Enter')send()">
                <button onclick="send()">➤</button>
            </div>
        </div>
        
        <!-- الموقع 1 -->
        <div class="panel" id="site1Panel">
            <iframe id="site1Frame" src="https://ai-undress.ai/ar"></iframe>
        </div>
        
        <!-- الموقع 2 -->
        <div class="panel" id="site2Panel">
            <iframe id="site2Frame" src="https://moakt.com/ar/inbox"></iframe>
        </div>
        
        <!-- تقسيم الشاشة -->
        <div class="panel" id="splitPanel"></div>
    </div>
</div>

<script>
const API='/api/agnes';
let currentPanel='chat';
let savedSite1='https://ai-undress.ai/ar',savedSite2='https://moakt.com/ar/inbox';

// حفظ حالة المواقع
document.getElementById('site1Frame').addEventListener('load',function(){
    try{this.contentWindow.sessionStorage;}catch(e){}
});
document.getElementById('site2Frame').addEventListener('load',function(){
    try{this.contentWindow.sessionStorage;}catch(e){}
});

function showPanel(panel){
    currentPanel=panel;
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active','split-view'));
    
    if(panel==='chat'){
        document.getElementById('chatPanel').classList.add('active');
    }else if(panel==='site1'){
        document.getElementById('site1Panel').classList.add('active');
    }else if(panel==='site2'){
        document.getElementById('site2Panel').classList.add('active');
    }
}

function showSplit(){
    currentPanel='split';
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active','split-view'));
    
    let split=document.getElementById('splitPanel');
    split.classList.add('active','split-view');
    split.innerHTML=`
        <div class="split-left" id="splitLeft">
            <iframe src="${savedSite1}" style="width:100%;height:100%;border:none"></iframe>
        </div>
        <div class="split-divider" id="splitDivider"></div>
        <div class="split-right" id="splitRight">
            <iframe src="${savedSite2}" style="width:100%;height:100%;border:none"></iframe>
        </div>
    `;
    
    // سحب الفاصل
    let isDragging=false;
    document.getElementById('splitDivider').addEventListener('mousedown',()=>isDragging=true);
    document.getElementById('splitDivider').addEventListener('touchstart',()=>isDragging=true);
    document.addEventListener('mousemove',e=>{
        if(!isDragging)return;
        let l=document.getElementById('splitLeft'),r=document.getElementById('splitRight');
        l.style.flex='none';l.style.width=Math.max(100,e.clientX)+'px';r.style.flex='1';
    });
    document.addEventListener('touchmove',e=>{
        if(!isDragging)return;
        let l=document.getElementById('splitLeft'),r=document.getElementById('splitRight');
        l.style.flex='none';l.style.width=Math.max(100,e.touches[0].clientX)+'px';r.style.flex='1';
    });
    document.addEventListener('mouseup',()=>isDragging=false);
    document.addEventListener('touchend',()=>isDragging=false);
}

// شات
function addMsg(role,html){
    let d=document.createElement('div');d.className='msg '+role;
    d.innerHTML=`<div class="msg-avatar">${role==='user'?'👤':'🤖'}</div><div class="msg-bubble">${html}</div>`;
    document.getElementById('chatBox').appendChild(d);d.scrollIntoView({behavior:'smooth'});
}
function loader(){
    let d=document.createElement('div');d.className='msg bot';
    d.innerHTML='<div class="msg-avatar">🤖</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    document.getElementById('chatBox').appendChild(d);d.scrollIntoView({behavior:'smooth'});return d;
}
async function send(){
    let t=document.getElementById('prompt').value.trim();if(!t)return;
    document.getElementById('prompt').value='';addMsg('user',t);
    let l=loader();
    try{
        let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'chat',message:t})});
        let d=await r.json();l.remove();
        addMsg('bot',d.success?d.message:'❌ حدث خطأ');
    }catch(e){l.remove();addMsg('bot','❌ خطأ في الاتصال');}
}
</script>
</body>
</html>
