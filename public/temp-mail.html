<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بريد مؤقت</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Cairo',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;padding:15px}
        .container{max-width:500px;margin:0 auto}
        .header{background:#111;border:2px solid#0f0;padding:20px;text-align:center;margin-bottom:15px;border-radius:10px}
        .header h1{color:#0f0;font-size:20px}
        .email-box{background:#000;border:1px solid#0f0;padding:12px;border-radius:8px;text-align:center;margin:10px 0}
        .email-box .label{color:#888;font-size:10px}
        .email-box .email{color:#ff0;font-size:15px;font-weight:700;word-break:break-all;cursor:pointer}
        .btn{width:100%;padding:14px;margin:6px 0;border:2px solid#0f0;background:#000;color:#0f0;font-size:14px;font-weight:700;cursor:pointer;border-radius:8px;font-family:'Cairo',sans-serif}
        .btn:active{background:#0f0;color:#000}
        .btn-yellow{border-color:#ff0;color:#ff0}.btn-yellow:active{background:#ff0;color:#000}
        .msg-card{background:#111;border:1px solid#333;padding:10px;margin:8px 0;border-radius:8px;cursor:pointer}
        .msg-card .from{color:#ff0;font-size:13px;font-weight:600}
        .msg-card .subject{color:#0f0;font-size:12px;margin:3px 0}
        .msg-card .body{display:none;padding:10px;margin-top:8px;background:#000;border-radius:5px;font-size:12px;line-height:1.8;color:#ccc;white-space:pre-wrap;word-break:break-all}
        .msg-card .body.show{display:block}
        .otp-code{color:#ff0;font-size:32px;text-align:center;letter-spacing:10px;font-weight:900;padding:10px;direction:ltr}
        .status{text-align:center;color:#888;font-size:12px;margin:8px 0;min-height:20px}
        .toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:999;background:#000;border:1px solid#0f0;color:#0f0;padding:10px 20px;border-radius:25px;font-size:13px}
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>📧 بريد مؤقت</h1></div>
        
        <div class="email-box">
            <div class="label">بريدك الحالي</div>
            <div class="email" id="emailDisplay" onclick="copyEmail()">---</div>
            <div style="color:#888;font-size:9px;margin-top:3px;">اضغط للنسخ</div>
        </div>
        
        <button class="btn" id="btnNew" onclick="newEmail()">🔄 إنشاء بريد جديد</button>
        <button class="btn btn-yellow" id="btnCheck" onclick="checkMessages()">📡 فحص الرسائل</button>
        
        <div class="status" id="status"></div>
        <div id="messages"></div>
    </div>

    <script>
        let email='',token='',seen={};

        function toast(m){
            let t=document.createElement('div');t.className='toast';t.textContent=m;
            document.body.appendChild(t);setTimeout(()=>t.remove(),2000);
        }
        
        function setStatus(m){document.getElementById('status').textContent=m;}
        
        function copyEmail(){
            if(!email)return;
            navigator.clipboard.writeText(email).then(()=>toast('✅ تم نسخ البريد'));
        }

        async function newEmail(){
            let btn=document.getElementById('btnNew');
            btn.disabled=true;btn.textContent='⏳ جاري الإنشاء...';
            setStatus('جاري إنشاء بريد جديد...');
            
            try{
                // جلب الدومين
                let r=await fetch('https://api.mail.tm/domains');
                let d=await r.json();
                let domains=d['hydra:member']||[];
                if(!domains.length){setStatus('❌ فشل');return;}
                
                let domain=domains[0].domain;
                let user=Math.random().toString(36).substring(2,12);
                email=user+'@'+domain;
                let pass=Math.random().toString(36).substring(2,16);
                
                // إنشاء حساب
                await fetch('https://api.mail.tm/accounts',{
                    method:'POST',headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({address:email,password:pass})
                });
                
                // جلب token
                let r3=await fetch('https://api.mail.tm/token',{
                    method:'POST',headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({address:email,password:pass})
                });
                let t=await r3.json();
                token=t.token||'';
                
                document.getElementById('emailDisplay').textContent=email;
                seen={};
                setStatus('✅ تم إنشاء البريد');
                toast('✅ بريد جديد جاهز');
                checkMessages();
            }catch(e){
                setStatus('❌ خطأ: '+e.message);
            }
            btn.disabled=false;btn.textContent='🔄 إنشاء بريد جديد';
        }

        async function checkMessages(){
            if(!email){await newEmail();return;}
            
            let btn=document.getElementById('btnCheck');
            btn.disabled=true;btn.textContent='⏳ جاري الفحص...';
            setStatus('جاري فحص الرسائل...');
            
            try{
                let headers={'Accept':'application/json'};
                if(token)headers['Authorization']='Bearer '+token;
                
                let r=await fetch('https://api.mail.tm/messages',{headers});
                let d=await r.json();
                let msgs=d['hydra:member']||[];
                
                let html='';
                
                if(!msgs.length){
                    html='<div style="text-align:center;color:#888;padding:30px;">📭 لا توجد رسائل</div>';
                }else{
                    html=`<div style="text-align:center;color:#888;margin:10px 0;">📩 ${msgs.length} رسائل</div>`;
                    
                    for(let m of msgs){
                        let h2={'Accept':'application/json'};
                        if(token)h2['Authorization']='Bearer '+token;
                        let r2=await fetch('https://api.mail.tm/messages/'+m.id,{headers:h2});
                        let detail=await r2.json();
                        
                        let from=detail.from?.address||'غير معروف';
                        let subject=detail.subject||'بدون موضوع';
                        let text=(detail.text||detail.html||'').replace(/<[^>]+>/g,'').trim();
                        let otp='';
                        let otpMatch=text.match(/\b(\d{4,8})\b/);
                        if(otpMatch)otp=otpMatch[1];
                        
                        let msgId='msg_'+m.id;
                        html+=`
                            <div class="msg-card">
                                <div onclick="document.getElementById('${msgId}').classList.toggle('show')">
                                    <div class="from">📧 ${from}</div>
                                    <div class="subject">${subject}</div>
                                </div>
                                <div class="body" id="${msgId}">
                                    ${otp?`<div class="otp-code">${otp}</div>`:''}
                                    ${text||'لا يوجد محتوى'}
                                </div>
                            </div>`;
                        
                        if(!seen[m.id]){
                            seen[m.id]=true;
                            if(otp)toast('🔑 كود: '+otp);
                        }
                    }
                }
                
                document.getElementById('messages').innerHTML=html;
                setStatus(msgs.length?'✅ تم التحديث':'📭 لا توجد رسائل');
            }catch(e){
                setStatus('❌ خطأ في الاتصال');
            }
            btn.disabled=false;btn.textContent='📡 فحص الرسائل';
        }

        // بداية
        newEmail();
        
        // تحديث تلقائي
        setInterval(checkMessages,15000);
    </script>
</body>
</html>
