<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ahmed App Builder</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#fff;font-family:system-ui,Arial}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer}
.top{background:#0e1628;border-bottom:1px solid #263653;padding:14px}
.head{max-width:1100px;margin:auto;text-align:center;font-size:21px;font-weight:900}
.head span{color:#7180ff}
.nav{max-width:1100px;margin:12px auto 0;display:flex;gap:8px}
.nav button{flex:1;padding:12px;border-radius:12px;background:#18243b;color:#b9c5dc;font-weight:800}
.nav button.active{background:#6675ff;color:white}
main{max-width:1100px;margin:auto;padding:18px}
.page{display:none}.page.active{display:block}
.card{background:#0f182b;border:1px solid #243451;border-radius:18px;padding:17px;margin-bottom:15px}
h2{margin:0 0 15px;font-size:19px}
label{display:block;color:#aebbd3;font-size:13px;margin:11px 0 6px}
input,textarea,select{width:100%;background:#091120;color:#fff;border:1px solid #2c3c5c;border-radius:11px;padding:12px;outline:0}
input:focus,textarea:focus,select:focus{border-color:#7180ff}
textarea{min-height:300px;direction:ltr;text-align:left;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:11px 15px;border-radius:11px;font-weight:800}
.primary{background:#6675ff;color:#fff}
.secondary{background:#1b2943;color:#fff}
.danger{background:#522333;color:#ffdfe6}
.full{width:100%}
.iconbox{display:flex;align-items:center;gap:12px}
.icon{width:65px;height:65px;border-radius:15px;object-fit:cover;background:#1b2943;border:1px solid #405170}
.project{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#091120;border:1px solid #22314c;border-radius:14px;padding:11px;margin:8px 0}
.projectInfo{display:flex;align-items:center;gap:10px;min-width:0}
.projectInfo img{width:48px;height:48px;border-radius:12px;object-fit:cover;background:#18243b}
.small{font-size:12px;color:#93a1bc}
.status{margin-top:12px;background:#091120;border-radius:11px;padding:12px;white-space:pre-wrap}
.phoneArea{display:flex;justify-content:center;align-items:center;min-height:700px;background:radial-gradient(circle,#202d52,#080d18);border-radius:15px;padding:20px}
.phone{width:min(390px,92vw);height:670px;background:white;border:8px solid #202637;border-radius:38px;overflow:hidden;position:relative;box-shadow:0 25px 60px #0008}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:110px;height:24px;background:#202637;border-radius:0 0 15px 15px;z-index:3}
iframe{width:100%;height:100%;border:0;background:#fff}
.empty{text-align:center;color:#8795b0;padding:30px}
.loading{text-align:center;padding:20px;color:#9eacd0}
@media(max-width:650px){.grid{grid-template-columns:1fr}.project{align-items:flex-start;flex-direction:column}.project .row{width:100%}.project .btn{flex:1}}
</style>
</head>

<body>

<header class="top">
<div class="head">📱 <span>Ahmed</span> App Builder</div>
<div class="nav">
<button class="active" data-page="create">➕ إنشاء</button>
<button data-page="apps">📱 تطبيقاتي</button>
<button data-page="previewPage">👁️ معاينة</button>
</div>
</header>

<main>

<section id="create" class="page active">

<div class="card">
<h2>➕ إنشاء تطبيق جديد</h2>

<label>اسم التطبيق</label>
<input id="name" value="تطبيقي الجديد" maxlength="60">

<div class="grid">
<div>
<label>Package Name</label>
<input id="pkg" value="com.ahmed.myapp" dir="ltr">
</div>

<div>
<label>نوع التطبيق</label>
<select id="type">
<option value="HTML">HTML</option>
<option value="WebView">WebView</option>
</select>
</div>
</div>

<div id="urlBox" style="display:none">
<label>رابط الموقع</label>
<input id="url" placeholder="https://example.com" dir="ltr">
</div>

<label>أيقونة التطبيق</label>
<div class="iconbox">
<img id="iconPreview" class="icon">
<input id="iconFile" type="file" accept="image/png,image/jpeg,image/webp">
</div>

<label>كود HTML</label>
<textarea id="html"></textarea>

<div class="row" style="margin-top:12px">
<button class="btn primary" id="save">💾 حفظ التطبيق</button>
<button class="btn secondary" id="preview">👁️ معاينة</button>
</div>

<div id="saveStatus" class="status">جاهز.</div>
</div>

</section>

<section id="apps" class="page">

<div class="card">
<h2>📱 تطبيقاتي</h2>
<div id="appsList"><div class="loading">جاري تحميل التطبيقات...</div></div>
</div>

</section>

<section id="previewPage" class="page">

<div class="card">
<h2>👁️ معاينة التطبيق</h2>
<div id="previewName" class="small" style="margin-bottom:12px">لم يتم اختيار تطبيق</div>

<div class="phoneArea">
<div class="phone">
<div class="notch"></div>
<iframe id="frame"></iframe>
</div>
</div>
</div>

</section>

</main>

<script>
const API='https://unique-courtesy-production.up.railway.app';

const $=x=>document.getElementById(x);

let apps=[];
let currentApp=null;
let iconData='';

const defaultHTML=`<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:system-ui;
background:#fff;
color:#111827;
text-align:center;
padding:20px
}
.box{max-width:330px}
button{
border:0;
border-radius:12px;
padding:13px 22px;
background:#6675ff;
color:white;
font-weight:800
}
</style>
</head>
<body>
<div class="box">
<h1>مرحباً بك 👋</h1>
<p>هذا التطبيق تم إنشاؤه باستخدام Ahmed App Builder.</p>
<button onclick="alert('أهلاً بك ❤️')">اضغط هنا</button>
</div>
</body>
</html>`;

$('html').value=defaultHTML;

document.querySelectorAll('.nav button').forEach(btn=>{
btn.onclick=()=>{
document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
btn.classList.add('active');
$(btn.dataset.page).classList.add('active');
if(btn.dataset.page==='apps')loadApps();
};
});

$('type').onchange=()=>{
$('urlBox').style.display=$('type').value==='WebView'?'block':'none';
};

$('iconFile').onchange=e=>{
const f=e.target.files[0];
if(!f)return;
const reader=new FileReader();
reader.onload=()=>{
iconData=reader.result;
$('iconPreview').src=iconData;
};
reader.readAsDataURL(f);
};

$('preview').onclick=()=>{
showPreview({
name:$('name').value,
type:$('type').value,
html:$('html').value,
url:$('url').value
});
};

function showPreview(app){
currentApp=app;
$('previewName').textContent='📱 '+(app.name||'التطبيق');

document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));

document.querySelector('[data-page="previewPage"]').classList.add('active');
$('previewPage').classList.add('active');

if(app.type==='WebView' && app.url){
$('frame').src=app.url;
$('frame').removeAttribute('srcdoc');
}else{
$('frame').srcdoc=app.html||defaultHTML;
$('frame').removeAttribute('src');
}
}

async function saveApp(){

const name=$('name').value.trim();
const packageName=$('pkg').value.trim();
const type=$('type').value;
const url=$('url').value.trim();
const html=$('html').value;

if(!name)return alert('اكتب اسم التطبيق');

$('save').disabled=true;
$('saveStatus').textContent='⏳ جاري حفظ التطبيق...';

try{

const response=await fetch(API+'/apps',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
name:name,
packageName:packageName,
type:type,
html:html,
url:url,
icon:iconData
})
});

const data=await response.json();

if(!response.ok){
throw new Error(data.message||data.error||'فشل حفظ التطبيق');
}

currentApp=data;

$('saveStatus').textContent='✅ تم حفظ التطبيق بنجاح';

await loadApps();

setTimeout(()=>{
document.querySelector('[data-page="apps"]').click();
},500);

}catch(e){

$('saveStatus').textContent='❌ '+e.message;

}finally{
$('save').disabled=false;
}
}

$('save').onclick=saveApp;

async function loadApps(){

$('appsList').innerHTML='<div class="loading">⏳ جاري تحميل التطبيقات...</div>';

try{

const response=await fetch(API+'/apps');
const data=await response.json();

apps=Array.isArray(data)?data:(data.apps||[]);

renderApps();

}catch(e){

$('appsList').innerHTML=
'<div class="empty">❌ تعذر الاتصال بالسيرفر<br>'+e.message+'</div>';

}
}

function renderApps(){
  const box=$('appsList');
  box.innerHTML='';

  if(!apps.length){
    box.innerHTML='<div class="empty">📱 لا توجد تطبيقات محفوظة حتى الآن.</div>';
    return;
  }

  apps.forEach((app,i)=>{
    const card=document.createElement('div');
    card.className='project';

    const info=document.createElement('div');
    info.className='projectInfo';

    if(app.icon){
      const img=document.createElement('img');
      img.src=app.icon;
      info.appendChild(img);
    }else{
      const emoji=document.createElement('div');
      emoji.style.fontSize='35px';
      emoji.textContent='📱';
      info.appendChild(emoji);
    }

    const text=document.createElement('div');

    const title=document.createElement('b');
    title.textContent=app.name||'بدون اسم';

    const sub=document.createElement('div');
    sub.className='small';
    sub.textContent=(app.packageName||'')+' · '+(app.type||'HTML');

    text.append(title,sub);
    info.appendChild(text);

    const buttons=document.createElement('div');
    buttons.className='row';

    const view=document.createElement('button');
    view.className='btn secondary';
    view.type='button';
    view.textContent='👁️';
    view.onclick=()=>showPreview(app);

    const build=document.createElement('button');
    build.className='btn primary';
    build.type='button';
    build.textContent='🚀 APK';

    const status=document.createElement('div');
    status.className='status';
    status.style.display='none';

    build.onclick=async()=>{
      build.disabled=true;
      status.style.display='block';
      status.textContent='⏳ جاري بدء إنشاء APK...';

      try{
        const r=await fetch(API+'/build/'+encodeURIComponent(app.id),{
          method:'POST',
          headers:{'Content-Type':'application/json'}
        });

        const j=await r.json();

        if(!r.ok || !j.jobId){
          throw new Error(j.message||j.error||'السيرفر لم يبدأ البناء');
        }

        status.textContent='⏳ جاري بناء APK...';

        const check=async()=>{
          try{
            const rr=await fetch(API+'/build-status/'+encodeURIComponent(j.jobId));
            const x=await rr.json();

            if(x.downloadUrl||x.download||x.status==='done'||x.status==='success'){
              const link=x.downloadUrl||x.download;
              if(link){
                const url=link.startsWith('http')?link:API+link;
                status.innerHTML='';
                const ok=document.createElement('a');
                ok.href=url;
                ok.target='_blank';
                ok.className='btn primary';
                ok.style.textDecoration='none';
                ok.textContent='⬇️ تحميل APK';
                status.appendChild(ok);
              }else{
                status.textContent='✅ تم إنشاء APK';
              }
              build.disabled=false;
              return;
            }

            if(x.status==='failed'||x.status==='error'){
              status.textContent='❌ فشل البناء: '+(x.message||x.error||'خطأ غير معروف');
              build.disabled=false;
              return;
            }

            setTimeout(check,2500);

          }catch(e){
            status.textContent='⏳ جاري إعادة المحاولة...';
            setTimeout(check,3000);
          }
        };

        check();

      }catch(e){
        status.textContent='❌ '+e.message;
        build.disabled=false;
      }
    };

    buttons.append(view,build);
    card.append(info,buttons);
    box.append(card,status);
  });
}

function escapeHtml(s){
return String(s??'').replace(/[&<>"']/g,m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m]));
}

function escapeAttr(s){
return String(s??'').replace(/"/g,'&quot;');
}

async function buildApp(i){

const app=apps[i];

if(!app)return;

document.querySelector('[data-page="apps"]').click();

const statusId='buildStatus'+i;

let box=document.getElementById(statusId);

if(!box){

const cards=document.querySelectorAll('.project');
const card=cards[i];

box=document.createElement('div');
box.id=statusId;
box.className='status';
box.textContent='⏳ جاري بدء البناء...';

card.after(box);
}

try{

const response=await fetch(API+'/build/'+app.id,{
method:'POST',
headers:{'Content-Type':'application/json'}
});

const job=await response.json();

if(!response.ok){
throw new Error(job.message||job.error||'تعذر بدء البناء');
}

if(!job.jobId){
throw new Error('لم يتم استلام Job ID من السيرفر');
}

box.textContent='⏳ جاري بناء APK...';

pollBuild(job.jobId,box);

}catch(e){

box.textContent='❌ '+e.message;

}
}

async function pollBuild(jobId,box){

try{

const response=await fetch(API+'/build-status/'+jobId);
const data=await response.json();

const status=String(data.status||'').toLowerCase();

if(status==='building'||status==='pending'||status==='queued'){

box.textContent='⏳ البناء شغال... انتظر قليلًا';
setTimeout(()=>pollBuild(jobId,box),2500);
return;

}

if(status==='success'||status==='done'||data.downloadUrl){

const link=data.downloadUrl||data.download||'';

if(!link){
box.textContent='✅ تم البناء، لكن رابط التحميل غير موجود.';
return;
}

const finalUrl=link.startsWith('http')?link:API+link;

box.innerHTML=
'✅ تم إنشاء APK بنجاح!<br><br>'+
'<a class="btn primary" style="display:inline-block;text-decoration:none" target="_blank" href="'+escapeAttr(finalUrl)+'">⬇️ تحميل APK</a>';

return;

}

if(status==='failed'||status==='error'){

box.textContent='❌ فشل البناء:\n'+
(data.message||data.error||data.logs||'خطأ غير معروف');

return;
}

box.textContent='ℹ️ حالة البناء: '+(data.status||'غير معروفة');
setTimeout(()=>pollBuild(jobId,box),3000);

}catch(e){

box.textContent='⚠️ جاري إعادة المحاولة...';
setTimeout(()=>pollBuild(jobId,box),4000);

}
}

async function testServer(){

try{

const r=await fetch(API+'/');

if(r.ok){
console.log('🟢 Railway server online');
}else{
console.log('🔴 Railway server error');
}

}catch(e){
console.log('🔴 Server unavailable');
}

}

testServer();
loadApps();
</script>

</body>
</html>
