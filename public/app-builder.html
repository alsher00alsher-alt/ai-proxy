<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ahmed App Builder</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070b12;color:#fff;font-family:Arial,sans-serif}
header{padding:18px;text-align:center;background:#0d1420;border-bottom:1px solid #202b3a}
header h1{margin:0;color:#00e5ff;font-size:23px}
header p{margin:7px 0 0;color:#91a0b5;font-size:13px}
nav{display:flex;gap:8px;padding:10px;background:#0d1420;position:sticky;top:0;z-index:5}
nav button{flex:1;border:0;border-radius:12px;padding:13px 5px;background:#172131;color:#fff;font-weight:bold}
nav button.active{background:#00a9c7}
.page{display:none;padding:15px;max-width:800px;margin:auto}
.page.active{display:block}
.card{background:#101824;border:1px solid #202d3d;border-radius:16px;padding:16px;margin-bottom:13px}
h2{margin-top:0;color:#00e5ff}
label{display:block;margin:12px 0 6px;color:#b9c5d5}
input,textarea,select{width:100%;padding:13px;border:1px solid #29384b;border-radius:11px;background:#080e17;color:#fff;outline:none}
textarea{min-height:220px;resize:vertical;font-family:monospace;direction:ltr;text-align:left}
button.primary{width:100%;border:0;border-radius:12px;padding:14px;background:#00b8d9;color:#001018;font-weight:bold;margin-top:13px}
button.danger{background:#c62828;color:#fff}
button.secondary{background:#1b293b;color:#fff}
.apps{display:grid;gap:12px}
.app{background:#101824;border:1px solid #26364a;border-radius:15px;padding:14px}
.app-top{display:flex;align-items:center;gap:12px}
.icon{width:55px;height:55px;border-radius:14px;object-fit:cover;background:#172333}
.app-name{font-weight:bold;font-size:17px}
.pkg{font-size:11px;color:#8290a4;margin-top:4px;direction:ltr;text-align:right}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
.actions button{border:0;border-radius:9px;padding:10px;background:#1b293b;color:#fff;font-weight:bold}
.status{text-align:center;margin-top:12px;color:#ffd54f;white-space:pre-wrap}
.download{display:block;text-align:center;background:#16a05d;color:#fff;text-decoration:none;padding:13px;border-radius:11px;margin-top:10px;font-weight:bold}
.empty{text-align:center;color:#77869a;padding:30px}
.phone-wrap{display:flex;justify-content:center}
.phone{width:min(390px,100%);height:690px;border:9px solid #202733;border-radius:35px;overflow:hidden;background:#fff;box-shadow:0 0 35px #000}
.phone iframe{width:100%;height:100%;border:0;background:#fff}
.preview-head{display:flex;gap:8px;margin-bottom:12px}
.preview-head button{flex:1;border:0;border-radius:10px;padding:11px;background:#182638;color:#fff}
.file{margin-top:8px;color:#8fa0b5;font-size:12px}
</style>
</head>
<body>

<header>
<h1>📱 Ahmed App Builder</h1>
<p>أنشئ تطبيقك واحفظه وابنِ APK حقيقي</p>
</header>

<nav>
<button id="nav-create" class="active" onclick="showPage('create')">➕ إنشاء</button>
<button id="nav-apps" onclick="showPage('apps')">📱 تطبيقاتي</button>
<button id="nav-preview" onclick="showPage('preview')">👁️ معاينة</button>
</nav>

<section id="create" class="page active">
<div class="card">
<h2>➕ إنشاء تطبيق</h2>

<label>اسم التطبيق</label>
<input id="name" placeholder="مثال: Ahmed AI">

<label>Package Name</label>
<input id="packageName" placeholder="com.ahmed.myapp">

<label>أيقونة التطبيق</label>
<input id="icon" type="file" accept="image/*">
<div id="iconStatus" class="file"></div>

<label>نوع التطبيق</label>
<select id="type" onchange="changeType()">
<option value="HTML">HTML</option>
<option value="WEBVIEW">WEB VIEW</option>
</select>

<div id="htmlBox">
<label>كود HTML</label>
<textarea id="html" placeholder="ضع كود HTML هنا..."></textarea>
</div>

<div id="urlBox" style="display:none">
<label>رابط الموقع</label>
<input id="url" type="url" placeholder="https://example.com" dir="ltr">
</div>

<button class="primary" onclick="saveApp()">💾 حفظ التطبيق</button>
<div id="saveStatus" class="status"></div>
</div>
</section>

<section id="apps" class="page">
<div class="card">
<h2>📱 تطبيقاتي</h2>
<button class="primary secondary" onclick="loadApps()">🔄 تحديث</button>
</div>
<div id="appsList" class="apps"></div>
</section>

<section id="preview" class="page">
<div class="card">
<h2>👁️ معاينة التطبيقات</h2>
<div id="previewList" class="apps"></div>
</div>

<div id="phoneBox" style="display:none">
<div class="preview-head">
<button onclick="closePreview()">⬅️ رجوع</button>
<button onclick="reloadPreview()">🔄 تحديث</button>
</div>
<div class="phone-wrap">
<div class="phone">
<iframe id="previewFrame"></iframe>
</div>
</div>
</div>
</section>

<script>
const API="https://unique-courtesy-production.up.railway.app";
let editingId=null;
let selectedIcon="";

function showPage(page){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById(page).classList.add("active");
document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
document.getElementById("nav-"+page).classList.add("active");

if(page==="apps") loadApps();
if(page==="preview") loadPreviewApps();
}

function changeType(){
const t=document.getElementById("type").value;
document.getElementById("htmlBox").style.display=t==="HTML"?"block":"none";
document.getElementById("urlBox").style.display=t==="WEBVIEW"?"block":"none";
}

document.getElementById("icon").addEventListener("change",function(){
const file=this.files[0];
if(!file)return;
const reader=new FileReader();
reader.onload=()=>{selectedIcon=reader.result;document.getElementById("iconStatus").textContent="✅ تم اختيار الأيقونة"};
reader.readAsDataURL(file);
});

async function saveApp(){
const status=document.getElementById("saveStatus");
status.textContent="⏳ جاري الحفظ...";

const data={
name:document.getElementById("name").value.trim(),
packageName:document.getElementById("packageName").value.trim(),
icon:selectedIcon,
type:document.getElementById("type").value,
html:document.getElementById("html").value,
url:document.getElementById("url").value.trim()
};

if(!data.name){
status.textContent="❌ اكتب اسم التطبيق";
return;
}

if(data.type==="HTML"&&!data.html){
status.textContent="❌ اكتب كود HTML";
return;
}

if(data.type==="WEBVIEW"&&!data.url){
status.textContent="❌ اكتب رابط الموقع";
return;
}

try{
const endpoint=editingId?`${API}/apps/${editingId}`:`${API}/apps`;
const method=editingId?"PUT":"POST";

const res=await fetch(endpoint,{
method,
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

const result=await res.json();

if(!res.ok)throw new Error(result.error||"فشل الحفظ");

status.textContent="✅ تم حفظ التطبيق بنجاح";
editingId=null;
setTimeout(()=>{
clearForm();
showPage("apps");
},700);

}catch(e){
status.textContent="❌ "+e.message;
}
}

function clearForm(){
editingId=null;
document.getElementById("name").value="";
document.getElementById("packageName").value="";
document.getElementById("html").value="";
document.getElementById("url").value="";
document.getElementById("icon").value="";
document.getElementById("iconStatus").textContent="";
selectedIcon="";
document.getElementById("type").value="HTML";
changeType();
}

async function loadApps(){
const box=document.getElementById("appsList");
box.innerHTML='<div class="empty">⏳ جاري تحميل التطبيقات...</div>';

try{
const res=await fetch(API+"/apps");
const apps=await res.json();

if(!Array.isArray(apps)||apps.length===0){
box.innerHTML='<div class="empty">📭 لا توجد تطبيقات محفوظة</div>';
return;
}

box.innerHTML=apps.map(app=>`
<div class="app">
<div class="app-top">
<img class="icon" src="${app.icon||'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2255%22 height=%2255%22><rect width=%22100%%22 height=%22100%%22 fill=%22%23172333%22/></svg>'}">
<div>
<div class="app-name">${esc(app.name||"بدون اسم")}</div>
<div class="pkg">${esc(app.packageName||"")}</div>
</div>
</div>
<div class="actions">
<button onclick="buildApp('${app.id}')">🚀 بناء APK</button>
<button onclick="editApp('${app.id}')">✏️ تعديل</button>
<button onclick="openPreview('${app.id}')">👁️ معاينة</button>
<button class="danger" onclick="deleteApp('${app.id}')">🗑️ حذف</button>
</div>
<div id="build-${app.id}" class="status"></div>
</div>
`).join("");

}catch(e){
box.innerHTML='<div class="empty">❌ تعذر الاتصال بالسيرفر</div>';
}
}

async function buildApp(id){
const status=document.getElementById("build-"+id);
status.textContent="⏳ تم إرسال البناء للسيرفر... تقدر تقفل الصفحة";

try{
const res=await fetch(`${API}/build/${id}`,{method:"POST"});
const job=await res.json();

if(!res.ok)throw new Error(job.error||"فشل إرسال البناء");

if(!job.jobId)throw new Error("السيرفر لم يرجع رقم عملية البناء");

status.textContent="🔨 البناء يعمل على السيرفر...";

let tries=0;

const timer=setInterval(async()=>{
tries++;

try{
const r=await fetch(`${API}/build-status/${job.jobId}`);
const j=await r.json();

if(j.status==="done"){
clearInterval(timer);

let url=j.downloadUrl||"";
if(url&&!url.startsWith("http"))url=API+url;

status.innerHTML=`✅ تم بناء APK بنجاح
<a class="download" href="${url}" target="_blank">⬇️ تحميل APK</a>`;
}

if(j.status==="failed"){
clearInterval(timer);
status.textContent="❌ فشل البناء:\n"+(j.error||"خطأ غير معروف");
}

if(tries>360){
clearInterval(timer);
status.textContent="⏳ البناء ما زال يعمل على السيرفر. افتح تطبيقاتي لاحقًا.";
}

}catch(e){}
},3000);

}catch(e){
status.textContent="❌ "+e.message;
}
}
async function editApp(id){
try{
const res=await fetch(`${API}/apps/${id}`);
const app=await res.json();

editingId=id;
document.getElementById("name").value=app.name||"";
document.getElementById("packageName").value=app.packageName||"";
document.getElementById("type").value=app.type||"HTML";
document.getElementById("html").value=app.html||"";
document.getElementById("url").value=app.url||"";
selectedIcon=app.icon||"";
document.getElementById("iconStatus").textContent=selectedIcon?"✅ الأيقونة الحالية محفوظة":"";
changeType();
showPage("create");
}catch(e){alert("❌ تعذر تحميل التطبيق");}
}

async function deleteApp(id){
if(!confirm("هل تريد حذف التطبيق؟"))return;
try{
const res=await fetch(`${API}/apps/${id}`,{method:"DELETE"});
if(!res.ok)throw new Error();
loadApps();
}catch(e){alert("❌ فشل الحذف");}
}

async function loadPreviewApps(){
const box=document.getElementById("previewList");
box.innerHTML='<div class="empty">⏳ جاري التحميل...</div>';

try{
const res=await fetch(API+"/apps");
const apps=await res.json();

if(!apps.length){
box.innerHTML='<div class="empty">📭 لا توجد تطبيقات محفوظة</div>';
return;
}

box.innerHTML=apps.map(app=>`
<div class="app" onclick="openPreview('${app.id}')" style="cursor:pointer">
<div class="app-top">
<img class="icon" src="${app.icon||''}">
<div>
<div class="app-name">${esc(app.name||"بدون اسم")}</div>
<div class="pkg">${esc(app.type||"HTML")}</div>
</div>
</div>
</div>
`).join("");
}catch(e){
box.innerHTML='<div class="empty">❌ تعذر الاتصال بالسيرفر</div>';
}
}

async function openPreview(id){
try{
const res=await fetch(`${API}/apps/${id}`);
const app=await res.json();
const frame=document.getElementById("previewFrame");

document.getElementById("previewList").parentElement.style.display="none";
document.getElementById("phoneBox").style.display="block";

if((app.type||"HTML")==="WEBVIEW"){
frame.removeAttribute("srcdoc");
frame.src=app.url||"about:blank";
}else{
frame.src="about:blank";
frame.srcdoc=app.html||"<h2>لا يوجد HTML</h2>";
}
}catch(e){
alert("❌ تعذر فتح المعاينة");
}
}

function closePreview(){
document.getElementById("phoneBox").style.display="none";
document.getElementById("previewList").parentElement.style.display="block";
document.getElementById("previewFrame").src="about:blank";
}

function reloadPreview(){
const f=document.getElementById("previewFrame");
try{f.contentWindow.location.reload()}catch(e){f.src=f.src}
}

function esc(v){
return String(v??"").replace(/[&<>"']/g,m=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[m]));
}

loadApps();
</script>
</body>
</html>
