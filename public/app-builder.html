<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHMED APP BUILDER</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background: #f0f2f5; color: #333; direction: rtl; }
        
        .top-bar {
            background: #1a1a2e;
            color: #fff;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #667eea;
        }
        .top-bar h1 { font-size: 20px; }
        .top-bar .badge {
            background: #667eea;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
        }
        
        .main-container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 20px;
        }
        
        .apps-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .apps-header h2 { font-size: 18px; color: #1a1a2e; }
        .create-btn {
            background: #667eea;
            color: #fff;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .create-btn:hover { background: #5568d3; transform: translateY(-2px); }
        
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .app-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid #e0e0e0;
        }
        .app-card:hover {
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transform: translateY(-5px);
        }
        .app-card img {
            width: 70px;
            height: 70px;
            border-radius: 15px;
            margin-bottom: 10px;
            object-fit: cover;
        }
        .app-card h3 { font-size: 14px; margin-bottom: 5px; }
        .app-card p { font-size: 11px; color: #888; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #fff;
            border-radius: 15px;
            padding: 25px;
            width: 90%;
            max-width: 500px;
        }
        .modal-content h2 {
            margin-bottom: 20px;
            color: #1a1a2e;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
        }
        .form-group textarea { height: 100px; font-family: monospace; }
        .btn-row { display: flex; gap: 10px; }
        .btn-primary {
            flex: 1;
            background: #667eea;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-secondary {
            flex: 1;
            background: #ddd;
            color: #333;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .dashboard {
            display: none;
            background: #fff;
            border-radius: 12px;
            padding: 20px;
        }
        .dashboard.active { display: block; }
        .dash-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .dash-header img {
            width: 60px;
            height: 60px;
            border-radius: 12px;
        }
        .dash-menu {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .dash-menu button {
            padding: 10px 20px;
            border: 1px solid #ddd;
            background: #f8f9fa;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .dash-menu button:hover, .dash-menu button.active {
            background: #667eea;
            color: #fff;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>📱 AHMED APP BUILDER</h1>
        <span class="badge">الإصدار الاحترافي</span>
    </div>
    
    <div class="main-container">
        <div class="apps-header">
            <h2>📱 تطبيقاتي</h2>
            <button class="create-btn" onclick="openCreateModal()">➕ إنشاء تطبيق جديد</button>
        </div>
        
        <div class="apps-grid" id="appsGrid">
            <p style="text-align:center;width:100%;color:#888;">لا توجد تطبيقات بعد</p>
        </div>
    </div>
    
    <!-- Modal إنشاء تطبيق -->
    <div class="modal" id="createModal">
        <div class="modal-content">
            <h2>➕ إنشاء تطبيق جديد</h2>
            <div class="form-group">
                <label>📛 اسم التطبيق:</label>
                <input type="text" id="appName" placeholder="مثال: تطبيقي">
            </div>
            <div class="form-group">
                <label>📦 Package Name:</label>
                <input type="text" id="packageName" placeholder="com.example.app">
            </div>
            <div class="form-group">
                <label>🖼️ أيقونة التطبيق:</label>
                <input type="file" id="appIcon" accept="image/*">
            </div>
            <div class="btn-row">
                <button class="btn-primary" onclick="createApp()">✅ إنشاء</button>
                <button class="btn-secondary" onclick="closeCreateModal()">إلغاء</button>
            </div>
        </div>
    </div>
    
    <!-- لوحة تحكم التطبيق -->
    <div class="dashboard" id="dashboard">
        <div class="dash-header">
            <img id="dashIcon" src="" alt="">
            <div>
                <h2 id="dashName"></h2>
                <p id="dashPackage" style="font-size:11px;color:#888;"></p>
            </div>
            <button class="btn-secondary" onclick="closeDashboard()" style="width:auto;padding:8px 20px;">↩️ رجوع</button>
        </div>
        
        <div class="dash-menu">
            <button class="active" onclick="showSection('html')">💻 HTML</button>
            <button onclick="showSection('chat')">💬 شات</button>
            <button onclick="showSection('clock')">🕐 ساعة</button>
            <button onclick="showSection('calendar')">📅 تقويم</button>
            <button onclick="showSection('webview')">🌐 WebView</button>
            <button onclick="showSection('notify')">🔔 إشعارات</button>
            <button onclick="buildAPK()" style="background:#27ae60;color:#fff;border:none;">🚀 بناء APK</button>
        </div>
        
        <div id="sectionContent">
            <div class="form-group">
                <label>كود HTML:</label>
                <textarea id="htmlCode" style="height:200px;"></textarea>
            </div>
            <button class="btn-primary" onclick="saveHTML()">💾 حفظ</button>
        </div>
        
        <div id="buildStatus" style="margin-top:15px;text-align:center;font-weight:bold;"></div>
    </div>
    
    <script>
        firebase.initializeApp({
            apiKey: "AIzaSyBu-9Z0T-OHPzauWXh8hmNSMDZKhAFnkf0",
            projectId: "game-a1aca",
            storageBucket: "game-a1aca.firebasestorage.app",
            appId: "1:598280425947:android:0e4ead8d9b50cfc92157fe"
        });
        const db = firebase.firestore();
        
        let currentAppId = null;
        
        async function loadApps() {
            const grid = document.getElementById('appsGrid');
            grid.innerHTML = '<p style="text-align:center;width:100%;color:#888;">⏳ تحميل...</p>';
            
            const snapshot = await db.collection('app_builder').get();
            const apps = [];
            snapshot.forEach(doc => apps.push({ id: doc.id, ...doc.data() }));
            
            if (apps.length === 0) {
                grid.innerHTML = '<p style="text-align:center;width:100%;color:#888;">لا توجد تطبيقات بعد</p>';
                return;
            }
            
            grid.innerHTML = '';
            apps.forEach(app => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.onclick = () => openDashboard(app);
                card.innerHTML = `
                    <img src="${app.icon || 'https://via.placeholder.com/70'}" alt="${app.name}">
                    <h3>${app.name}</h3>
                    <p>${app.packageName}</p>
                `;
                grid.appendChild(card);
            });
        }
        
        function openCreateModal() {
            document.getElementById('createModal').classList.add('active');
        }
        
        function closeCreateModal() {
            document.getElementById('createModal').classList.remove('active');
        }
        
        async function createApp() {
            const name = document.getElementById('appName').value;
            const packageName = document.getElementById('packageName').value;
            const iconFile = document.getElementById('appIcon').files[0];
            
            if (!name || !packageName) {
                alert('اكتب اسم التطبيق و Package Name');
                return;
            }
            
            let icon = '';
            if (iconFile) {
                icon = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.readAsDataURL(iconFile);
                });
            }
            
            await db.collection('app_builder').add({
                name,
                packageName,
                icon,
                html: '<h1>مرحباً</h1>',
                created: new Date().toISOString()
            });
            
            closeCreateModal();
            loadApps();
        }
        
        function openDashboard(app) {
            currentAppId = app.id;
            document.getElementById('dashboard').classList.add('active');
            document.getElementById('dashName').textContent = app.name;
            document.getElementById('dashPackage').textContent = app.packageName;
            document.getElementById('dashIcon').src = app.icon || 'https://via.placeholder.com/60';
            document.getElementById('htmlCode').value = app.html || '';
            document.querySelector('.apps-grid').style.display = 'none';
            document.querySelector('.apps-header').style.display = 'none';
        }
        
        function closeDashboard() {
            document.getElementById('dashboard').classList.remove('active');
            document.querySelector('.apps-grid').style.display = 'grid';
            document.querySelector('.apps-header').style.display = 'flex';
        }
        
        function showSection(section) {
            const content = document.getElementById('sectionContent');
            
            if (section === 'html') {
                content.innerHTML = `
                    <div class="form-group">
                        <label>كود HTML:</label>
                        <textarea id="htmlCode" style="height:200px;">${document.getElementById('htmlCode').value}</textarea>
                    </div>
                    <button class="btn-primary" onclick="saveHTML()">💾 حفظ</button>
                `;
            } else if (section === 'chat') {
                content.innerHTML = `<p>💬 قسم الشات - جاهز للتفعيل</p>`;
            } else if (section === 'clock') {
                content.innerHTML = `<p>🕐 قسم الساعة - جاهز للتفعيل</p>`;
            } else if (section === 'calendar') {
                content.innerHTML = `<p>📅 قسم التقويم - جاهز للتفعيل</p>`;
            } else if (section === 'webview') {
                content.innerHTML = `<p>🌐 قسم WebView - جاهز للتفعيل</p>`;
            } else if (section === 'notify') {
                content.innerHTML = `
                    <div class="form-group">
                        <label>عنوان الإشعار:</label>
                        <input type="text" id="notifyTitle">
                    </div>
                    <div class="form-group">
                        <label>نص الإشعار:</label>
                        <input type="text" id="notifyBody">
                    </div>
                    <button class="btn-primary" onclick="sendNotification()">📨 إرسال</button>
                `;
            }
        }
        
        async function saveHTML() {
            const html = document.getElementById('htmlCode').value;
            await db.collection('app_builder').doc(currentAppId).update({ html });
            alert('✅ تم الحفظ');
        }
        
        function sendNotification() {
            alert('📨 سيتم الإرسال للمستخدمين');
        }
        
        async function buildAPK() {
            const status = document.getElementById('buildStatus');
            status.innerHTML = '⏳ جاري البناء...';
            
            const doc = await db.collection('app_builder').doc(currentAppId).get();
            const app = doc.data();
            
            const response = await fetch('https://unique-courtesy-production.up.railway.app/build', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    app_name: app.name,
                    package_name: app.packageName,
                    html_content: app.html
                })
            });
            
            const data = await response.json();
            if (data.status === 'success') {
                status.innerHTML = `<a href="https://unique-courtesy-production.up.railway.app${data.download}" download>✅ اضغط للتحميل</a>`;
            } else {
                status.innerHTML = `❌ ${data.message}`;
            }
        }
        
        loadApps();
    </script>
</body>
</html>
