<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صانع التطبيقات</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .header {
            text-align: center;
            padding: 30px;
            background: rgba(255,255,255,0.1);
            border-radius: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
        }
        .header h1 {
            font-size: 30px;
            background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p { color: #ccc; margin-top: 10px; }
        .input-group { margin-bottom: 18px; }
        .input-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffd93d;
            font-size: 14px;
        }
        .input-group input, .input-group textarea {
            width: 100%;
            padding: 14px;
            font-family: 'Cairo', sans-serif;
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .input-group input:focus, .input-group textarea:focus {
            border-color: #ff6b6b;
            box-shadow: 0 0 20px rgba(255,107,107,0.3);
            outline: none;
        }
        .input-group textarea { min-height: 180px; font-family: monospace; }
        .btn {
            width: 100%;
            padding: 16px;
            font-family: 'Cairo', sans-serif;
            font-weight: 900;
            font-size: 18px;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d);
            color: #000;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255,107,107,0.4);
        }
        .btn:active { transform: translateY(0); }
        .result {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            display: none;
            text-align: center;
        }
        .result a {
            display: inline-block;
            padding: 12px 25px;
            background: #6bcb77;
            color: #000;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 900;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 صانع التطبيقات</h1>
            <p>ابني تطبيقك واحصل على APK</p>
        </div>
        
        <div class="input-group">
            <label>📛 اسم التطبيق:</label>
            <input type="text" id="appName" placeholder="مثال: تطبيقي">
        </div>
        
        <div class="input-group">
            <label>📦 Package Name:</label>
            <input type="text" id="packageName" placeholder="com.example.app">
        </div>
        
        <div class="input-group">
            <label>💻 كود HTML:</label>
            <textarea id="htmlCode" placeholder="الصق كود HTML هنا..."></textarea>
        </div>
        
        <button class="btn" onclick="buildApp()">🚀 بناء APK</button>
        
        <div class="result" id="result"></div>
    </div>
    
    <script>
        async function buildApp() {
            const name = document.getElementById('appName').value;
            const packageName = document.getElementById('packageName').value;
            const html = document.getElementById('htmlCode').value;
            
            if (!name || !packageName || !html) {
                alert('اكتب كل البيانات');
                return;
            }
            
            const result = document.getElementById('result');
            result.style.display = 'block';
            result.innerHTML = '<p style="color:#ffd93d;">⏳ جاري البناء...</p>';
            
            try {
                const response = await fetch('https://unique-courtesy-production.up.railway.app/build', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ app_name: name, package_name: packageName, html_content: html })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    result.innerHTML = `<p style="color:#6bcb77;">✅ تم البناء!</p><a href="https://unique-courtesy-production.up.railway.app${data.download}" download>⬇️ تحميل APK</a>`;
                } else {
                    result.innerHTML = `<p style="color:#ff6b6b;">❌ ${data.message}</p>`;
                }
            } catch(e) {
                result.innerHTML = `<p style="color:#ff6b6b;">❌ خطأ: ${e.message}</p>`;
            }
        }
    </script>
</body>
</html>
