<!DOCTYPE html>
<html lang="en">
<head>
<title>Ahmed Creator | Create your real android app</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
body { margin:0; font-family:'Roboto',Arial; background:#fff; }
.top-bar { background:#333; height:10px; }
.header { padding:15px; border-bottom:1px solid #ccc; text-align:center; }
.logo { font-size:30px; font-weight:bold; color:#023C44; }
.stats { font-size:13px; color:#333; }
.hero { background:rgba(4,131,151,0.9); padding:30px; color:#fff; text-align:center; }
.hero h1 { font-size:30px; margin:0 0 10px; }
.hero p { font-size:20px; margin:0 0 15px; }
.btn {
    background:#023C44; color:#fff; border:0; border-radius:4px;
    padding:12px 30px; font-size:16px; cursor:pointer; font-weight:bold;
}
.categories { padding:30px; text-align:center; }
.cat-item { display:inline-block; margin:0 30px; text-align:center; }
.cat-item i { font-size:40px; color:#048397; }
.cat-item p { font-size:13px; margin-top:5px; }
.my-apps { padding:25px; text-align:center; }
.my-apps h2 { font-size:22px; }
.apps-grid {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:12px; max-width:800px; margin:15px auto;
}
.app-card {
    background:#fff; border:1px solid #ddd; border-radius:6px;
    padding:12px; cursor:pointer; transition:0.3s;
}
.app-card:hover { box-shadow:0 3px 12px rgba(0,0,0,0.15); transform:translateY(-3px); }
.app-card img { width:45px; height:45px; border-radius:8px; margin-bottom:6px; }
.app-card h3 { font-size:12px; margin:0; }
.signup { background:#eee; padding:30px; }
.signup h2 { text-align:center; font-size:22px; }
.form-table { margin:0 auto; }
.form-table td { padding:4px; }
.form-table input {
    padding:8px; border:1px solid #ccc; border-radius:4px; width:200px; font-size:13px;
}
.status { text-align:center; font-weight:bold; margin-top:10px; }
footer { background:#212121; color:#999; padding:15px; text-align:center; font-size:12px; }
</style>
</head>
<body>
<div class="top-bar"></div>
<div class="header">
    <span class="logo">Ahmed<span style="color:#048397;">Creator</span></span>
    <br><span class="stats">4.168.483 apps created</span>
</div>

<div class="hero">
    <h1>Make your app for Android phones and tablets</h1>
    <p>It's free & Earn money showing ads!</p>
    <button class="btn" onclick="scrollToSignup()">Sign up</button>
</div>

<div class="categories">
    <div class="cat-item"><i class="fa fa-play"></i><p>Videos, Music, Radio</p></div>
    <div class="cat-item"><i class="fa fa-comments"></i><p>Chat, Forums</p></div>
    <div class="cat-item"><i class="fa fa-gamepad"></i><p>Games, Quizzes</p></div>
    <div class="cat-item"><i class="fa fa-plus"></i><p>And much more</p></div>
</div>

<div class="my-apps" id="myApps">
    <h2>My Apps</h2>
    <div class="apps-grid" id="appsGrid">
        <p style="color:#888;">Loading...</p>
    </div>
    <button class="btn" onclick="scrollToSignup()">+ Create New App</button>
</div>

<div class="signup" id="signup">
    <h2>Create New App</h2>
    <table class="form-table">
    <tr><td>App Name:*</td><td><input type="text" id="appName"></td></tr>
    <tr><td>Package:*</td><td><input type="text" id="packageName" placeholder="com.example.app"></td></tr>
    <tr><td>Icon:</td><td><input type="file" id="appIcon" accept="image/*"></td></tr>
    <tr><td colspan="2" style="text-align:center;padding-top:12px;"><button class="btn" onclick="createApp()">Create App</button></td></tr>
    </table>
    <div class="status" id="status"></div>
</div>

<footer>2026 AhmedCreator | <a href="#" style="color:#999;">Terms</a> | <a href="#" style="color:#999;">About</a></footer>

<script>
firebase.initializeApp({
    apiKey: "AIzaSyBu-9Z0T-OHPzauWXh8hmNSMDZKhAFnkf0",
    projectId: "game-a1aca",
    storageBucket: "game-a1aca.firebasestorage.app",
    appId: "1:598280425947:android:0e4ead8d9b50cfc92157fe"
});
const db = firebase.firestore();

function scrollToSignup() {
    document.getElementById('signup').scrollIntoView({behavior:'smooth'});
}

async function loadApps() {
    const grid = document.getElementById('appsGrid');
    const snapshot = await db.collection('app_builder').get();
    const apps = [];
    snapshot.forEach(doc => apps.push({id:doc.id,...doc.data()}));
    
    if (apps.length === 0) {
        grid.innerHTML = '<p style="color:#888;">No apps yet</p>';
        return;
    }
    grid.innerHTML = '';
    apps.forEach(app => {
        const card = document.createElement('div');
        card.className = 'app-card';
        card.onclick = () => buildApp(app);
        card.innerHTML = `<img src="${app.icon||'https://via.placeholder.com/45'}" alt=""><h3>${app.name}</h3>`;
        grid.appendChild(card);
    });
}

async function createApp() {
    const name = document.getElementById('appName').value;
    const packageName = document.getElementById('packageName').value;
    const iconFile = document.getElementById('appIcon').files[0];
    const status = document.getElementById('status');
    
    if (!name || !packageName) {
        status.innerHTML = '❌ Fill all fields';
        status.style.color = '#dc2626';
        return;
    }
    
    status.innerHTML = '⏳ Creating...';
    status.style.color = '#d97706';
    
    let icon = '';
    if (iconFile) {
        icon = await new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.readAsDataURL(iconFile);
        });
    }
    
    await db.collection('app_builder').add({
        name, packageName, icon,
        html: '<h1>Welcome to ' + name + '</h1>',
        created: new Date().toISOString()
    });
    
    status.innerHTML = '✅ Created!';
    status.style.color = '#27ae60';
    loadApps();
}

async function buildApp(app) {
    const status = document.getElementById('status');
    status.innerHTML = '⏳ Building APK...';
    status.style.color = '#d97706';
    
    const response = await fetch('https://unique-courtesy-production.up.railway.app/build', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
            app_name: app.name,
            package_name: app.packageName,
            html_content: app.html
        })
    });
    
    const data = await response.json();
    if (data.status === 'success') {
        status.innerHTML = `<a href="https://unique-courtesy-production.up.railway.app${data.download}" download style="color:#27ae60;">✅ Download APK</a>`;
    } else {
        status.innerHTML = '❌ ' + data.message;
        status.style.color = '#dc2626';
    }
}

loadApps();
</script>
</body>
</html>
