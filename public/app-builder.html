<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHMED APP - صانع التطبيقات الاحترافي</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 650px; margin: 0 auto; }
        .header {
            text-align: center;
            padding: 30px;
            background: rgba(255,255,255,0.07);
            border-radius: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
        }
        .header h1 {
            font-size: 32px;
            background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p { color: #ccc; margin-top: 8px; font-size: 14px; }
        .card {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .card h3 { color: #ffd93d; margin-bottom: 15px; font-size: 16px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }
        .input-group { margin-bottom: 15px; }
        .input-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 6px;
            color: #00ffcc;
            font-size: 13px;
        }
        .input-group input, .input-group textarea {
            width: 100%;
            padding: 12px;
            font-family: 'Cairo', sans-serif;
            background: rgba(0,0,0,0.3);
            color: #fff;
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .input-group input:focus, .input-group textarea:focus {
            border-color: #ff6b6b;
            box-shadow: 0 0 15px rgba(255,107,107,0.3);
            outline: none;
        }
        .input-group textarea { min-height: 140px; font-family: monospace; }
        .services-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        .service-badge {
            background: rgba(255,255,255,0.08);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            font-size: 13px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn {
            width: 100%;
            padding: 16px;
            font-family: 'Cairo', sans-serif;
            font-weight: 900;
            font-size: 18px;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d);
            color: #000;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
            margin-top: 10px;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255,107,107,0.4);
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255,255,255,0.08);
            border-radius: 15px;
            display: none;
            text-align: center;
        }
        .result a {
            display: inline-block;
            padding: 12px 25px;
            background: #6bcb77;
            color: #000;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 900;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 AHMED APP</h1>
            <p>منصة تطوير وصناعة تطبيقات الأندرويد الاحترافية</p>
        </div>
        
        <div class="card">
            <h3>⚙️ الإعدادات الأساسية</h3>
            <div class="input-group">
                <label>📛 اسم التطبيق:</label>
                <input type="text" id="appName" value="AHMED APP">
            </div>
            <div class="input-group">
                <label>📦 Package Name:</label>
                <input type="text" id="packageName" value="com.ahmed.app">
            </div>
            <div class="input-group">
                <label>🖼️ رابط أيقونة التطبيق (اختياري):</label>
                <input type="text" id="appIcon" placeholder="https://example.com/icon.png">
            </div>
        </div>

        <div class="card">
            <h3>💻 محتوى الصفحة (HTML / WebView)</h3>
            <div class="input-group">
                <textarea id="htmlCode"><h1 style="text-align:center; color:#ff6b6b;">مرحباً بك في AHMED APP</h1><p style="text-align:center; color:#fff;">التطبيق يعمل بكفاءة عالية!</p></textarea>
            </div>
        </div>

        <div class="card">
            <h3>🧩 خدمات وأقسام المنصة المتاحة</h3>
            <div class="services-grid">
                <div class="service-badge">🌐 صفحة ويب (Web)</div>
                <div class="service-badge">💬 دردشة فورية (Chat)</div>
                <div class="service-badge">🔔 الإشعارات (Push)</div>
                <div class="service-badge">🛒 متجر ومنتجات</div>
                <div class="service-badge">📻 مشغل صوتيات</div>
                <div class="service-badge">🎬 فيديوهات</div>
            </div>
        </div>
        
        <button class="btn" onclick="buildApp()">🚀 بناء APK والتحديث</button>
        
        <div class="result" id="result"></div>
    </div>
    
    <script>
        async function buildApp() {
            const name = document.getElementById('appName').value;
            const packageName = document.getElementById('packageName').value;
            const html = document.getElementById('htmlCode').value;
            const icon = document.getElementById('appIcon').value;
            
            if (!name || !packageName || !html) {
                alert('الرجاء إدخال كافة البيانات الأساسية');
                return;
            }
            
            const result = document.getElementById('result');
            result.style.display = 'block';
            result.innerHTML = '<p style="color:#ffd93d;">⏳ جاري بناء وتجهيز تطبيق AHMED APP...</p>';
            
            try {
                const response = await fetch('https://unique-courtesy-production.up.railway.app/build', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ app_name: name, package_name: packageName, html_content: html, app_icon: icon })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    result.innerHTML = `<p style="color:#6bcb77;">✅ تم بناء التطبيق بنجاح!</p><a href="https://unique-courtesy-production.up.railway.app${data.download}" download>⬇️ تحميل APK الآن</a>`;
                } else {
                    result.innerHTML = `<p style="color:#ff6b6b;">❌ ${data.message}</p>`;
                }
            } catch(e) {
                result.innerHTML = `<p style="color:#ff6b6b;">❌ خطأ في الاتصال: ${e.message}</p>`;
            }
        }
    </script>
</body>
</html>
