<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<title>AHMED APP - المنصة الاحترافية</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Cairo&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', Arial, sans-serif; }
body { background: #0b0b16; color: #fff; padding-bottom: 50px; }

.top-bar { background: #15152b; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a4e; }
.logo-title { font-size: 16px; font-weight: bold; color: #00ffcc; }

.tabs-container { display: flex; background: #15152b; border-bottom: 1px solid #2a2a4e; }
.tab-btn { flex: 1; padding: 15px; text-align: center; background: none; border: none; color: #a5a5c7; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.3s; }
.tab-btn.active { color: #00ffcc; border-bottom: 3px solid #00ffcc; background: #1a1a38; }

.content-section { padding: 20px; display: none; max-width: 600px; margin: 0 auto; }
.content-section.active { display: block; }

.card-box { background: #15152b; border: 1px solid #2a2a4e; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
.form-group { margin-bottom: 15px; }
label { display: block; margin-bottom: 8px; color: #c5c5d9; font-size: 14px; font-weight: bold; }
input[type="text"], select, textarea { width: 100%; padding: 12px; background: #0b0b16; border: 1px solid #2a2a4e; color: #fff; border-radius: 8px; font-size: 14px; }
textarea { height: 180px; font-family: monospace; resize: vertical; }

.btn-main { width: 100%; padding: 14px; background: #00ffcc; border: none; color: #0b0b16; font-weight: bold; font-size: 16px; border-radius: 8px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
.btn-main:hover { background: #00cc99; }
.btn-notify { background: #ff3366; color: #fff; margin-top: 10px; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

.apps-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
.app-card { background: #15152b; border: 1px solid #2a2a4e; border-radius: 12px; padding: 15px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.3s; }
.app-card:hover { border-color: #00ffcc; }
.app-card img { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; }
.app-card h3 { font-size: 16px; color: #fff; margin-bottom: 4px; }
.app-card p { font-size: 12px; color: #8888a5; }

#appDashboard { display: none; }
.dash-header { display: flex; align-items: center; gap: 15px; background: #15152b; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #2a2a4e; }
.dash-header img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }
.back-btn { background: #333; color: #fff; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; margin-bottom: 15px; font-weight: bold; }
.status-msg { margin-top: 15px; padding: 12px; background: #0b0b16; border-radius: 8px; text-align: center; font-size: 14px; display: none; }
.status-msg a { color: #00ffcc; font-weight: bold; text-decoration: none; word-break: break-all; }
</style>
</head>
<body>

<div class="top-bar">
    <div class="logo-title">AHMED APP - المنصة الاحترافية</div>
    <div>📱</div>
</div>

<div class="tabs-container">
    <button class="tab-btn active" onclick="switchTab('create')">✨ إنشاء تطبيق جديد</button>
    <button class="tab-btn" onclick="switchTab('apps')">📁 تطبيقاتي</button>
</div>

<!-- قسم إنشاء تطبيق جديد -->
<div id="createTab" class="content-section active">
    <div class="card-box">
        <div class="form-group">
            <label>اسم التطبيق:</label>
            <input type="text" id="appName" placeholder="مثال: متجري السري">
        </div>

        <div class="form-group">
            <label>أيقونة التطبيق (صورة مربعة من الهاتف):</label>
            <input type="file" id="appIcon" accept="image/*" style="color:#fff;">
        </div>

        <div class="form-group">
            <label>معرف التطبيق (Package Name):</label>
            <input type="text" id="packageName" value="com.ahmed.app" placeholder="com.ahmed.app">
        </div>

        <div class="form-group">
            <label>قوة الإطارات (Frames / Refresh Rate):</label>
            <select id="fpsRate">
                <option value="max">🚀 أقصى أداء تلقائي (حسب شاشة الهاتف 120Hz/144Hz)</option>
            </select>
        </div>
    </div>

    <div class="card-box">
        <div class="form-group">
            <label>نوع التطبيق:</label>
            <select id="appType" onchange="toggleAppType()">
                <option value="webview">رابط موقع (WebView)</option>
                <option value="html">كود HTML مباشر (تحديث لحظي)</option>
            </select>
        </div>

        <div class="form-group" id="urlGroup">
            <label>رابط الموقع (URL):</label>
            <input type="text" id="appUrl" value="https://google.com" placeholder="https://google.com">
        </div>

        <div class="form-group" id="htmlGroup" style="display:none;">
            <label>كود الـ HTML المباشر:</label>
            <textarea id="htmlContent" placeholder="<h1>أهلاً بك في تطبيقي</h1>"></textarea>
        </div>

        <button class="btn-main" onclick="createNewApp()">🛠️ إنشاء وحفظ التطبيق</button>
    </div>
    
    <div id="createStatus" class="status-msg"></div>
</div>

<!-- قسم تطبيقاتي -->
<div id="appsTab" class="content-section">
    <div id="appsListContainer">
        <div class="apps-grid" id="appsGrid">
            <p style="text-align:center; color:#888;">جاري تحميل تطبيقاتك...</p>
        </div>
    </div>

    <!-- لوحة تحكم التطبيق -->
    <div id="appDashboard">
        <button class="back-btn" onclick="backToList()">⬅ رجوع لقائمة التطبيقات</button>
        <div class="dash-header">
            <img id="dashIcon" src="" alt="">
            <div>
                <h3 id="dashTitle"></h3>
                <p id="dashPkg" style="font-size:12px; color:#888;"></p>
            </div>
        </div>

        <div class="card-box">
            <label>تعديل كود الـ HTML (يتحدث داخل التطبيق فوراً عند الحفظ):</label>
            <textarea id="dashHtmlCode"></textarea>
            <button class="btn-main" onclick="updateAppHtmlOnServer()">💾 حفظ وتحديث الـ HTML على السيرفر</button>
            <button class="btn-main" style="background:#27ae60; color:#fff;" onclick="buildSelectedAppAPK()">📥 بناء وتحميل ملف APK (30 ميجا)</button>
            
            <hr style="border-color:#2a2a4e; margin:20px 0;">
            <label>إرسال إشعار صوتي فوري للتطبيق:</label>
            <input type="text" id="notifyMsgText" value="تنبيه هام من إدارة التطبيق!" style="margin-bottom:10px;">
            <button class="btn-notify" onclick="sendPushNotification()">📢 إرسال صوت واهتزاز الآن</button>
        </div>
        <div id="dashStatus" class="status-msg"></div>
    </div>
</div>

<footer></footer>

<script>
const BACKEND_URL = "https://unique-courtesy-production.up.railway.app";
let currentSelectedApp = null;

function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
    
    if(tabName === 'create') {
        document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
        document.getElementById('createTab').classList.add('active');
    } else {
        document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
        document.getElementById('appsTab').classList.add('active');
        loadMyApps();
    }
}

function toggleAppType() {
    let type = document.getElementById('appType').value;
    if(type === 'html') {
        document.getElementById('urlGroup').style.display = 'none';
        document.getElementById('htmlGroup').style.display = 'block';
    } else {
        document.getElementById('urlGroup').style.display = 'block';
        document.getElementById('htmlGroup').style.display = 'none';
    }
}

let iconBase64 = "";
document.getElementById('appIcon').addEventListener('change', function(e) {
    let file = e.target.files[0];
    if (file) {
        let reader = new FileReader();
        reader.onload = function(event) { iconBase64 = event.target.result; };
        reader.readAsDataURL(file);
    }
});

function createNewApp() {
    let name = document.getElementById('appName').value.trim();
    let packageName = document.getElementById('packageName').value.trim();
    let type = document.getElementById('appType').value;
    let url = document.getElementById('appUrl').value.trim();
    let html = document.getElementById('htmlContent').value;
    let statusDiv = document.getElementById('createStatus');

    if(!name) {
        alert('الرجاء إدخال اسم التطبيق!');
        return;
    }

    let apps = JSON.parse(localStorage.getItem('my_custom_apps') || '[]');
    let newApp = {
        id: 'app_' + Date.now(),
        name: name,
        packageName: packageName || ('com.ahmed.' + Date.now()),
        type: type,
        url: url,
        html: html || '<h1>' + name + '</h1>',
        icon: iconBase64 || 'https://via.placeholder.com/60'
    };

    apps.push(newApp);
    localStorage.setItem('my_custom_apps', JSON.stringify(apps));

    // إرسال التطبيق أول مرة للبناء والسيرفر
    fetch(`${BACKEND_URL}/build`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            app_name: newApp.name,
            package_name: newApp.packageName,
            app_type: newApp.type,
            app_url: newApp.url,
            html_content: newApp.html,
            app_icon: newApp.icon
        })
    }).catch(e => {});

    statusDiv.style.display = 'block';
    statusDiv.innerHTML = '✅ تم إنشاء التطبيق وحفظه بنجاح!';
    setTimeout(() => { switchTab('apps'); }, 1000);
}

function loadMyApps() {
    let grid = document.getElementById('appsGrid');
    let apps = JSON.parse(localStorage.getItem('my_custom_apps') || '[]');
    
    document.getElementById('appDashboard').style.display = 'none';
    document.getElementById('appsListContainer').style.display = 'block';

    if(apps.length === 0) {
        grid.innerHTML = '<p style="text-align:center; color:#888; padding:30px;">لا توجد تطبيقات مسجلة حالياً.</p>';
        return;
    }

    grid.innerHTML = '';
    apps.forEach(app => {
        let card = document.createElement('div');
        card.className = 'app-card';
        card.onclick = () => openAppDashboard(app);
        card.innerHTML = `
            <img src="${app.icon}" alt="">
            <div>
                <h3>${app.name}</h3>
                <p>${app.packageName}</p>
            </div>
        `;
        grid.appendChild(card);
    });
}

function openAppDashboard(app) {
    currentSelectedApp = app;
    document.getElementById('appsListContainer').style.display = 'none';
    document.getElementById('appDashboard').style.display = 'block';

    document.getElementById('dashIcon').src = app.icon;
    document.getElementById('dashTitle').textContent = app.name;
    document.getElementById('dashPkg').textContent = app.packageName;
    document.getElementById('dashHtmlCode').value = app.html;
}

function backToList() {
    loadMyApps();
}

// حفظ وتحديث الـ HTML على السيرفر مباشرة ليعمل التحديث اللحظي
async function updateAppHtmlOnServer() {
    if(!currentSelectedApp) return;
    let newHtml = document.getElementById('dashHtmlCode').value;
    currentSelectedApp.html = newHtml;

    // تحديث محلي
    let apps = JSON.parse(localStorage.getItem('my_custom_apps') || '[]');
    apps = apps.map(a => a.id === currentSelectedApp.id ? currentSelectedApp : a);
    localStorage.setItem('my_custom_apps', JSON.stringify(apps));

    let statusDiv = document.getElementById('dashStatus');
    statusDiv.style.display = 'block';
    statusDiv.innerHTML = '⏳ جاري تحديث الـ HTML على السيرفر...';

    try {
        let res = await fetch(`${BACKEND_URL}/update-html`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                package_name: currentSelectedApp.packageName,
                html_content: newHtml
            })
        });
        let data = await res.json();
        statusDiv.innerHTML = data.message;
    } catch(err) {
        statusDiv.innerHTML = `❌ خطأ في الاتصال: ${err.message}`;
    }
}

async function buildSelectedAppAPK() {
    if(!currentSelectedApp) return;
    let statusDiv = document.getElementById('dashStatus');
    statusDiv.style.display = 'block';
    statusDiv.innerHTML = '⏳ جاري بناء ملف APK (30 ميجا)...';

    try {
        let res = await fetch(`${BACKEND_URL}/build`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                app_name: currentSelectedApp.name,
                package_name: currentSelectedApp.packageName,
                app_type: currentSelectedApp.type,
                app_url: currentSelectedApp.url,
                html_content: currentSelectedApp.html,
                app_icon: currentSelectedApp.icon
            })
        });
        let data = await res.json();
        if(data.status === 'success') {
            statusDiv.innerHTML = `✅ تم بناء التطبيق بنجاح!<br><br><a href="${BACKEND_URL}${data.download}" target="_blank">📥 اضغط هنا لتحميل ملف APK</a>`;
        } else {
            statusDiv.innerHTML = `❌ خطأ في البناء: ${data.message}`;
        }
    } catch(err) {
        statusDiv.innerHTML = `❌ خطأ: ${err.message}`;
    }
}

async function sendPushNotification() {
    let msg = document.getElementById('notifyMsgText').value;
    let statusDiv = document.getElementById('dashStatus');
    statusDiv.style.display = 'block';
    statusDiv.innerHTML = '⏳ جاري إرسال الإشعار...';

    try {
        let res = await fetch(`${BACKEND_URL}/api/notify`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg })
        });
        let data = await res.json();
        statusDiv.innerHTML = `✅ ${data.message}`;
    } catch(err) {
        statusDiv.innerHTML = `❌ خطأ: ${err.message}`;
    }
}
</script>
</body>
</html>
