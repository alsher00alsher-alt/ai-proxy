<!doctype html>
<html lang="en">
<head>
<title>Android Creator | Create your real android app | AHMED APP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style>
body { margin:0px; font-family:'Roboto',Arial; background-color:#EEEEEE; color:#212121; direction:ltr; }
header { background-color: #333333; color: #fff; padding: 15px; }
.top-banner { background-color: rgba(4,131,151,0.9); padding: 30px; color: #fff; text-align: center; }
.panel-box { background: #FFFFFF; border: 1px solid #CCCCCC; border-radius: 4px; padding: 20px; max-width: 700px; margin: 20px auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
.panel-title { font-size: 18px; font-weight: bold; background-color: #023C44; color: #fff; padding: 10px; border-radius: 4px; margin-bottom: 15px; text-align: center; }
label { display: block; font-weight: bold; margin-top: 10px; font-size: 14px; }
input[type="text"], textarea, select { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
textarea { height: 150px; font-family: monospace; }
.btn-main { background-color:#023C44; color:#FAFAFA; border:0; border-radius:4px; padding:12px 30px; font-size:16px; cursor:pointer; width:100%; margin-top:15px; font-weight: bold; }
.btn-main:hover { background-color: #046370; }
#status { text-align: center; margin-top: 15px; font-weight: bold; font-size: 15px; }
.grid-sections { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; text-align: center; }
.sec-item { background: #f9f9f9; border: 1px solid #ddd; padding: 10px; border-radius: 4px; font-size: 13px; }
</style>
</head>
<body>

<header>
    <table style="width:100%;">
        <tr>
            <td><span style="font-size:22px; font-weight:bold; color:#00ffcc;">AHMED APP Creator</span></td>
            <td align="right"><span style="color:#aaa;">AppCreator24 Clone</span></td>
        </tr>
    </table>
</header>

<div class="top-banner">
    <span style="font-weight:bold; font-size:xx-large;">Make your app for Android phones and tablets</span><br>
    <span style="font-size:large;">Create custom APK with frames up to 185!</span>
</div>

<div class="panel-box">
    <div class="panel-title">App Name and Icon</div>
    
    <label>App name:</label>
    <input type="text" id="appName" value="AHMED APP">
    
    <label>Package Name:</label>
    <input type="text" id="packageName" value="com.ahmed.app">

    <label>Frames (Up to 185):</label>
    <select id="maxFrames">
        <option value="60">60 Frames</option>
        <option value="120">120 Frames</option>
        <option value="185" selected>185 Frames (Max Performance)</option>
    </select>
    
    <label>App Icon (Select image from phone):</label>
    <input type="file" id="iconFile" accept="image/*" style="margin-top:5px;">
</div>

<div class="panel-box">
    <div class="panel-title">HTML Content / WebView</div>
    <label>Source HTML code:</label>
    <textarea id="htmlContent">&lt;h1 style="text-align:center; color:#023C44;"&gt;Welcome to AHMED APP&lt;/h1&gt;&lt;p style="text-align:center;"&gt;Your app is running smoothly!&lt;/p&gt;</textarea>
</div>

<div class="panel-box">
    <div class="panel-title">Available Sections & Services</div>
    <div class="grid-sections">
        <div class="sec-item"><i class="fa fa-globe"></i> Web</div>
        <div class="sec-item"><i class="fa fa-comments"></i> Chat</div>
        <div class="sec-item"><i class="fa fa-gamepad"></i> Games</div>
        <div class="sec-item"><i class="fa fa-play"></i> Videos</div>
        <div class="sec-item"><i class="fa fa-shopping-cart"></i> Products</div>
        <div class="sec-item"><i class="fa fa-bell"></i> Push</div>
    </div>
    
    <button class="btn-main" onclick="buildApp()">Save and Build APK 🚀</button>
    <div id="status"></div>
</div>

<script>
    async function buildApp() {
        const name = document.getElementById('appName').value;
        const packageName = document.getElementById('packageName').value;
        const html = document.getElementById('htmlContent').value;
        const iconInput = document.getElementById('iconFile');
        const status = document.getElementById('status');
        
        if(!name || !html) {
            alert('Please enter App Name and HTML content');
            return;
        }

        status.innerHTML = "⏳ Processing and building APK (Frames optimized)...";
        status.style.color = "#d97706";

        if(iconInput.files && iconInput.files[0]) {
            const reader = new FileReader();
            reader.readAsDataURL(iconInput.files[0]);
            reader.onload = function() {
                sendToServer(name, packageName, html, reader.result);
            }
        } else {
            sendToServer(name, packageName, html, "");
        }
    }

    async function sendToServer(name, packageName, html, icon) {
        const status = document.getElementById('status');
        try {
            const response = await fetch('https://unique-courtesy-production.up.railway.app/build', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ app_name: name, package_name: packageName, html_content: html, app_icon: icon })
            });
            
            const data = await response.json();
            if(data.status === 'success') {
                status.innerHTML = `✅ Build successful! <br><a href="https://unique-courtesy-production.up.railway.app${data.download}" style="color:#023C44; text-decoration:underline;" download>📥 Click here to download your APK</a>`;
            } else {
                status.innerHTML = `❌ Error: ${data.message}`;
                status.style.color = "red";
            }
        } catch(e) {
            status.innerHTML = `❌ Connection Error: ${e.message}`;
            status.style.color = "red";
        }
    }
</script>

</body>
</html>
