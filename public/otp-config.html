<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚙️ إعدادات OTP Bot</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#050510;--surface:#0a0a1a;--gold:#d4af37;--green:#2ed573;--text:#fff;--muted:#aaa;--border:#1a1a2e}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .card{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:30px;max-width:450px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,0.5)}
        h1{color:var(--gold);font-size:24px;margin-bottom:5px}
        p{color:var(--muted);font-size:13px;margin-bottom:20px}
        .input-group{margin-bottom:15px;text-align:right}
        .input-group label{color:var(--muted);font-size:12px;display:block;margin-bottom:5px;font-weight:600}
        .input-group input{width:100%;padding:12px;background:var(--bg);border:2px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;font-family:'Cairo',sans-serif;text-align:left;direction:ltr}
        .input-group input:focus{border-color:var(--gold)}
        .btn{width:100%;padding:14px;border-radius:10px;border:none;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px;font-family:'Cairo',sans-serif}
        .btn-gold{background:var(--gold);color:#000}
        .btn-green{background:var(--green);color:#000}
        .btn-red{background:#ff4757;color:#fff}
        .btn:active{transform:scale(0.95)}
        .status{background:rgba(46,213,115,0.1);border:1px solid var(--green);border-radius:8px;padding:10px;margin-top:15px;display:none;color:var(--green);font-size:13px}
        .status.error{background:rgba(255,71,87,0.1);border-color:#ff4757;color:#ff4757}
        .info-box{background:rgba(30,144,255,0.1);border:1px solid #1e90ff;border-radius:8px;padding:10px;margin-top:15px;font-size:12px;color:#1e90ff}
    </style>
</head>
<body>
<div class="card">
    <h1>⚙️ إعدادات OTP Bot</h1>
    <p>حط توكن البوت والـ Chat ID</p>

    <div class="input-group">
        <label>🤖 BOT TOKEN</label>
        <input type="text" id="bot-token" placeholder="123456:ABC-DEF" value="8437915697:AAGePdMDoI8h-jX_WTPOdNM42_LABwjRBUo">
    </div>

    <div class="input-group">
        <label>🆔 CHAT ID</label>
        <input type="text" id="chat-id" placeholder="7276604783" value="7276604783">
    </div>

    <div class="input-group">
        <label>🔗 API URL (مصدر الأرقام)</label>
        <input type="text" id="api-url" placeholder="https://numberpanel.tech/api/otp?count=200" value="https://numberpanel.tech/api/otp?count=200">
    </div>

    <button class="btn btn-gold" onclick="saveConfig()">💾 حفظ الإعدادات</button>
    <button class="btn btn-green" onclick="testBot()" style="margin-top:8px;">🧪 اختبار الاتصال</button>

    <div class="status" id="status"></div>

    <div class="info-box">
        💡 بعد الحفظ، افتح الرابط ده كل دقيقة عشان يجيب OTPs:<br>
        <b style="color:#fff;font-size:11px;">https://ai-proxy-eosin.vercel.app/api/otp</b>
    </div>
</div>

<script>
function saveConfig(){
    var token=document.getElementById('bot-token').value.trim();
    var chat=document.getElementById('chat-id').value.trim();
    var api=document.getElementById('api-url').value.trim();
    
    if(!token||!chat||!api){
        showStatus('❌ املأ جميع الحقول','error');
        return;
    }
    
    localStorage.setItem('otp_token',token);
    localStorage.setItem('otp_chat',chat);
    localStorage.setItem('otp_api',api);
    
    showStatus('✅ تم حفظ الإعدادات بنجاح!','success');
}

function testBot(){
    var token=document.getElementById('bot-token').value.trim();
    var chat=document.getElementById('chat-id').value.trim();
    
    if(!token||!chat){
        showStatus('❌ اكتب التوكن والـ Chat ID','error');
        return;
    }
    
    fetch(`https://api.telegram.org/bot${token}/sendMessage`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
            chat_id:chat,
            text:'✅ تم الاتصال بنجاح!\n\n🤖 OTP Bot جاهز للعمل'
        })
    })
    .then(function(r){return r.json();})
    .then(function(d){
        if(d.ok){
            showStatus('✅ تم الإرسال! شوف تيليجرام','success');
        }else{
            showStatus('❌ فشل: '+d.description,'error');
        }
    })
    .catch(function(){
        showStatus('❌ فشل الاتصال','error');
    });
}

function showStatus(msg,type){
    var s=document.getElementById('status');
    s.textContent=msg;
    s.className='status '+(type||'success');
    s.style.display='block';
    setTimeout(function(){s.style.display='none';},4000);
}

// تحميل الإعدادات المحفوظة
var savedToken=localStorage.getItem('otp_token');
var savedChat=localStorage.getItem('otp_chat');
var savedApi=localStorage.getItem('otp_api');
if(savedToken)document.getElementById('bot-token').value=savedToken;
if(savedChat)document.getElementById('chat-id').value=savedChat;
if(savedApi)document.getElementById('api-url').value=savedApi;
</script>
</body>
</html>
