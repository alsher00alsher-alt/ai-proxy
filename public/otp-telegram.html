<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>OTP Live</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg: #0e1621;
            --surface: #17212b;
            --surface2: #1e293b;
            --border: #334155;
            --blue: #2563eb;
            --blue-hover: #1d4ed8;
            --green: #059669;
            --green-hover: #047857;
            --gold: #f59e0b;
            --text: #f8fafc;
            --text2: #94a3b8;
            --red: #f87171;
            --sky: #60a5fa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg); color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        .app { 
            width: 100%; max-width: 500px; height: 100vh; background: var(--surface);
            display: flex; flex-direction: column; overflow: hidden; position: relative;
        }
        
        /* شاشة المحادثات */
        .screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .screen.hidden { display: none !important; }
        
        .topbar { 
            padding: 12px 15px; background: var(--surface2); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 10px; min-height: 55px;
        }
        .topbar .back { color: #2aabee; font-size: 22px; cursor: pointer; padding: 5px; display: none; }
        .topbar .avatar { 
            width: 40px; height: 40px; border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #fff; flex-shrink: 0;
        }
        .topbar .title { font-weight: 600; font-size: 16px; flex: 1; }
        .topbar .subtitle { font-size: 12px; color: var(--text2); }
        
        .main-list { flex: 1; overflow-y: auto; }
        .chat-row { 
            display: flex; align-items: center; padding: 12px 15px; gap: 12px; 
            cursor: pointer; border-bottom: 1px solid var(--surface2); transition: 0.2s;
        }
        .chat-row:hover { background: var(--surface2); }
        .chat-row .avatar { 
            width: 55px; height: 55px; border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: #fff; flex-shrink: 0;
        }
        .chat-row .info { flex: 1; min-width: 0; }
        .chat-row .name { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
        .chat-row .preview { font-size: 14px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* شاشة الشات */
        .chat-content { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 10px; font-size: 15px; line-height: 1.5; word-break: break-word; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .msg-bot { align-self: flex-start; background: var(--surface2); border: 1px solid var(--border); }
        .msg-user { align-self: flex-end; background: var(--blue); }
        .msg-otp { align-self: flex-start; background: var(--surface2); border: 1px solid var(--gold); }
        .msg .time { font-size: 11px; color: var(--text2); margin-top: 4px; text-align: left; }
        .msg .otp-label { color: var(--gold); font-size: 11px; font-weight: 600; margin-bottom: 4px; }
        .msg .code { background: var(--gold); color: #000; padding: 2px 8px; border-radius: 4px; font-weight: bold; display: inline-block; margin: 4px 0; font-size: 16px; }
        .msg .num { color: var(--sky); font-weight: bold; font-size: 18px; }
        .msg .svc { color: var(--red); font-weight: bold; }
        
        /* منطقة الأزرار الثابتة */
        .btn-area { 
            padding: 10px 15px; background: var(--surface2); border-top: 1px solid var(--border);
            display: flex; flex-wrap: wrap; gap: 8px; min-height: 55px; align-items: center;
            position: sticky; bottom: 0;
        }
        .btn-area button { 
            background: var(--blue); color: #fff; border: none; padding: 10px 16px; 
            border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 500; transition: 0.2s;
            white-space: nowrap;
        }
        .btn-area button:hover { background: var(--blue-hover); }
        .btn-area button.green { background: var(--green); }
        .btn-area button.green:hover { background: var(--green-hover); }
        .btn-area button.gold { background: var(--gold); color: #000; }
        .btn-area button.gold:hover { opacity: 0.9; }
        
        .input-row { 
            padding: 10px 15px; background: var(--surface2); border-top: 1px solid var(--border);
            display: flex; gap: 8px;
        }
        .input-row input { 
            flex: 1; background: var(--bg); border: 1px solid var(--border); 
            padding: 10px 15px; border-radius: 20px; color: #fff; font-size: 15px; outline: none;
        }
        .input-row button { 
            background: var(--blue); color: #fff; border: none; padding: 10px 20px; 
            border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 14px;
        }
        ::-webkit-scrollbar { width: 3px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    </style>
</head>
<body>
    <div class="app" id="app">
        <!-- الرئيسية -->
        <div id="mainScreen" class="screen">
            <div class="topbar"><div class="title">✈️ OTP Live</div></div>
            <div class="main-list">
                <div class="chat-row" onclick="openChat('bot')">
                    <div class="avatar" style="background:var(--blue);">🤖</div>
                    <div class="info"><div class="name">🤖 NUMBER BOT</div><div class="preview" id="botPreview">بوت الأرقام والخدمات</div></div>
                </div>
                <div class="chat-row" onclick="openChat('group')">
                    <div class="avatar" style="background:#e17076;">👥</div>
                    <div class="info"><div class="name">👥 OTP GROUP</div><div class="preview" id="groupPreview">Live OTP Messages</div></div>
                </div>
            </div>
        </div>

        <!-- شاشة الشات -->
        <div id="chatScreen" class="screen hidden">
            <div class="topbar">
                <div class="back" id="backBtn" onclick="goBack()">←</div>
                <div class="avatar" id="topAvatar" style="background:var(--blue);">🤖</div>
                <div><div class="title" id="topName">🤖 NUMBER BOT</div><div class="subtitle" id="topStatus">online</div></div>
            </div>
            <div class="chat-content" id="messages"></div>
            <div class="btn-area" id="btnArea"></div>
            <div class="input-row hidden" id="inputRow">
                <input type="text" id="msgInput" placeholder="رسالة..." onkeypress="if(event.key==='Enter')sendMsg()">
                <button onclick="sendMsg()">📤</button>
            </div>
        </div>
    </div>

    <audio id="sndSend" src="https://www.soundjay.com/buttons/sounds/button-09.mp3" preload="auto"></audio>
    <audio id="sndRecv" src="https://www.soundjay.com/buttons/sounds/button-07.mp3" preload="auto"></audio>

    <script>
        firebase.initializeApp({apiKey:"AIzaSyA5LuJwdTckc6V2zClBeRiozM_tdMx5fAQ",projectId:"otp-5acda",databaseURL:"https://otp-5acda-default-rtdb.firebaseio.com"});
        const db=firebase.database();
        const PROXY='/api/panel';
        
        // حفظ الحالة
        let state=JSON.parse(localStorage.getItem('otp_tele_state')||'{}');
        let cur=state.cur||'bot',cSvc=state.cSvc||'',cCty=state.cCty||'',curNum=state.curNum||'';
        let known=new Set(),otpTimer=null,msgs=[];
        
        function save(){localStorage.setItem('otp_tele_state',JSON.stringify({cur,cSvc,cCty,curNum,msgs}));}
        
        function api(p){return fetch(PROXY+p).then(r=>r.json());}
        
        function openChat(t){
            cur=t;save();
            document.getElementById('mainScreen').classList.add('hidden');
            document.getElementById('chatScreen').classList.remove('hidden');
            document.getElementById('messages').innerHTML='';
            document.getElementById('btnArea').innerHTML='';
            document.getElementById('inputRow').classList.add('hidden');
            if(otpTimer){clearInterval(otpTimer);otpTimer=null;}
            
            if(t==='bot'){
                document.getElementById('topAvatar').style.background='var(--blue)';
                document.getElementById('topAvatar').textContent='🤖';
                document.getElementById('topName').textContent='🤖 NUMBER BOT';
                document.getElementById('topStatus').textContent='online';
                document.getElementById('backBtn').style.display='block';
                document.getElementById('inputRow').classList.add('hidden');
                
                if(curNum){
                    addMsg('bot',`📱 <b>الرقم المحفوظ:</b> <span class="num">${curNum}</span>`);
                    document.getElementById('btnArea').innerHTML=`
                        <button class="green" onclick="copyNum('${curNum}')">📋 نسخ</button>
                        <button onclick="getNumber('${cCty}','')">🔄 تغيير</button>
                        <button onclick="loadServices()">🌍 دولة جديدة</button>
                        <button class="gold" onclick="checkCode('${curNum}')">📩 كود</button>
                    `;
                }else{
                    showStart();
                }
            }else{
                document.getElementById('topAvatar').style.background='#e17076';
                document.getElementById('topAvatar').textContent='👥';
                document.getElementById('topName').textContent='👥 OTP GROUP';
                document.getElementById('topStatus').textContent='live';
                document.getElementById('backBtn').style.display='block';
                document.getElementById('inputRow').classList.add('hidden');
                document.getElementById('btnArea').innerHTML='';
                db.ref('messages').off();
                db.ref('messages').limitToLast(50).on('child_added',s=>{if(cur==='group')showOTP(s.val())});
                otpTimer=setInterval(fetchOTP,3000);
                fetchOTP();
            }
        }
        
        function goBack(){
            document.getElementById('chatScreen').classList.add('hidden');
            document.getElementById('mainScreen').classList.remove('hidden');
            if(otpTimer){clearInterval(otpTimer);otpTimer=null;}
            document.getElementById('botPreview').textContent=curNum?`الرقم: ${curNum}`:'بوت الأرقام';
            save();
        }
        
        function addMsg(type,text){
            const ms=document.getElementById('messages');
            const cls=type==='bot'?'msg-bot':(type==='user'?'msg-user':'msg-otp');
            const t=new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
            ms.innerHTML+=`<div class="msg ${cls}">${text}<div class="time">${t}</div></div>`;
            ms.scrollTop=ms.scrollHeight;
            msgs.push({type,text,time:t});save();
        }
        
        function showOTP(m){
            if(m.type==='otp'){
                addMsg('otp',`<div class="otp-label">📩 Live OTP</div><span class="svc">${m.service||''}</span><br><span class="num">${m.number||''}</span><br><span class="code">${m.code||''}</span>`);
                document.getElementById('sndRecv').play().catch(()=>{});
            }
        }
        
        async function fetchOTP(){
            try{
                const d=await api('/api/otp?count=10');
                if(Array.isArray(d))d.forEach(i=>{
                    const k=`${i[1]}-${i[2]}`;
                    if(!known.has(k)){known.add(k);
                        db.ref('messages').push({type:'otp',service:i[0],number:i[1],code:i[2].match(/\d{4,8}/)?.[0]||i[2],text:i[2].slice(0,100),time:new Date().toLocaleTimeString('ar-EG'),sender:'OTP'});
                    }
                });
            }catch(e){}
        }
        
        function showStart(){
            addMsg('bot','👋 أهلًا بك في NUMBER BOT!<br><br>أنا بوت الأرقام الافتراضية.');
            document.getElementById('btnArea').innerHTML='<button onclick="loadServices()">▶️ START</button>';
        }
        
        async function loadServices(){
            addMsg('bot','⏳ جاري تحميل الخدمات...');
            document.getElementById('btnArea').innerHTML='';
            try{
                const d=await api('/api/services');
                if(d.success){
                    addMsg('bot','📋 <b>اختر الخدمة:</b>');
                    let btns='';
                    d.services.slice(0,8).forEach(s=>{btns+=`<button onclick="loadCountries('${s.key}','${s.name}')">${s.name} (${s.count})</button>`;});
                    document.getElementById('btnArea').innerHTML=btns;
                }
            }catch(e){addMsg('bot','❌ خطأ');}
        }
        
        async function loadCountries(key,name){
            cSvc=key;save();addMsg('user',`📱 ${name}`);addMsg('bot','⏳ جاري تحميل الدول...');document.getElementById('btnArea').innerHTML='';
            try{
                const d=await api(`/api/countries?service=${key}`);
                if(d.success){
                    addMsg('bot',`🌍 <b>دول ${name}:</b>`);
                    let btns='';
                    d.countries.slice(0,10).forEach(c=>{btns+=`<button onclick="getNumber('${c.name}','${c.flag}')">${c.flag} ${c.name} (${c.count})</button>`;});
                    document.getElementById('btnArea').innerHTML=btns;
                }
            }catch(e){addMsg('bot','❌ خطأ');}
        }
        
        async function getNumber(country,flag){
            cCty=country;save();addMsg('user',`🌍 ${flag} ${country}`);addMsg('bot','⏳ جاري جلب رقم...');document.getElementById('btnArea').innerHTML='';
            try{
                const d=await api('/api/otp?count=20');
                if(Array.isArray(d)){
                    const flt=d.filter(i=>i[0].toLowerCase().includes(cSvc.toLowerCase()));
                    if(flt.length>0){
                        curNum=flt[0][1];save();
                        addMsg('bot',`📱 <b>الرقم:</b> <span class="num">${curNum}</span><br>📌 ${flag} ${country}<br>🔹 ${flt[0][0]}`);
                        document.getElementById('btnArea').innerHTML=`
                            <button class="green" onclick="copyNum('${curNum}')">📋 نسخ الرقم</button>
                            <button onclick="getNumber('${country}','${flag}')">🔄 تغيير الرقم</button>
                            <button onclick="loadServices()">🌍 تغيير الدولة</button>
                            <button class="gold" onclick="checkCode('${curNum}')">📩 جلب الكود</button>
                        `;
                    }else{addMsg('bot','❌ لا توجد أرقام');document.getElementById('btnArea').innerHTML='<button onclick="loadServices()">🔙 رجوع</button>';}
                }
            }catch(e){addMsg('bot','❌ خطأ');}
        }
        
        function copyNum(num){
            navigator.clipboard.writeText(num);
            addMsg('bot','✅ تم نسخ الرقم! 📋');
            document.getElementById('sndSend').play().catch(()=>{});
        }
        
        async function checkCode(num){
            addMsg('bot','⏳ جاري البحث عن الكود...');
            document.getElementById('sndSend').play().catch(()=>{});
            try{
                const d=await api('/api/otp?count=30');
                if(Array.isArray(d)){
                    const f=d.find(i=>i[1]===num);
                    if(f){const cd=f[2].match(/\d{4,8}/)?.[0]||f[2];addMsg('bot',`✅ <b>تم!</b><br><br>🔑 <span class="code">${cd}</span><br>📱 ${num}<br>📋 ${f[0]}`);}
                    else{addMsg('bot','⏳ لم يصل بعد، جرب تاني');}
                }
            }catch(e){addMsg('bot','❌ خطأ');}
        }
        
        function sendMsg(){
            const inp=document.getElementById('msgInput'),tx=inp.value.trim();if(!tx)return;
            addMsg('user',tx);inp.value='';
            const l=tx.toLowerCase();
            if(l==='start'||l==='ابدأ')loadServices();
        }
        
        // استعادة الحالة
        window.onload=()=>{
            if(state.cur==='group') openChat('group');
            else if(state.cur==='bot'&&state.curNum) openChat('bot');
        };
    </script>
</body>
</html>
