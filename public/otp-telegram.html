<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Live - Telegram</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg: #0e1621; --surface: #17212b; --surface2: #242f3d; --border: #111822;
            --blue: #2b5278; --green: #2e8b57; --gold: #f59e0b; --red: #c75c5c;
            --text: #fff; --text2: #7d8b99; --sky: #64b5f6; --avatar-bg: #2b5278;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app { width: 100%; max-width: 420px; background: var(--surface); height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 15px rgba(0,0,0,0.5); overflow: hidden; position: relative; }
        
        .header { background: var(--surface2); padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); min-height: 55px; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .back-arrow { color: #fff; font-size: 20px; cursor: pointer; display: none; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--avatar-bg); display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; border: 1px solid #4e729a; flex-shrink: 0; overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .title-info h2 { font-size: 15px; color: #fff; }
        .title-info p { font-size: 12px; color: var(--text2); }
        .menu-icon { color: #fff; font-size: 20px; cursor: pointer; }
        
        .screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .screen.hidden { display: none !important; }
        
        .main-list { flex: 1; overflow-y: auto; }
        .chat-row { display: flex; align-items: center; padding: 12px 15px; gap: 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.02); transition: 0.2s; }
        .chat-row:hover { background: rgba(255,255,255,0.02); }
        .chat-row .avatar { width: 50px; height: 50px; font-size: 20px; }
        .chat-row .info { flex: 1; min-width: 0; }
        .chat-row .name { font-size: 14px; font-weight: 500; margin-bottom: 3px; }
        .chat-row .preview { font-size: 13px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-row .time { font-size: 11px; color: var(--text2); }
        
        .tabs-bar { background: var(--surface); padding: 8px 12px; display: flex; gap: 8px; overflow-x: auto; border-bottom: 1px solid var(--border); }
        .tab { background: var(--surface2); color: #899bb0; padding: 6px 12px; border-radius: 16px; font-size: 12px; cursor: pointer; border: none; white-space: nowrap; }
        .tab.active { background: var(--blue); color: #fff; }
        
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; background: var(--bg); }
        
        .msg-block { background: #182533; border-radius: 12px; padding: 10px 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .msg-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .msg-user { color: var(--sky); font-size: 13px; font-weight: 500; }
        .msg-role { color: #4caf50; font-size: 11px; background: rgba(76,175,80,0.1); padding: 2px 6px; border-radius: 4px; }
        .msg-content { font-size: 13px; line-height: 1.6; }
        .msg-content .num { color: #60a5fa; font-weight: bold; }
        .msg-content .code { background: var(--gold); color: #000; padding: 2px 8px; border-radius: 4px; font-weight: bold; display: inline-block; margin: 4px 0; font-size: 14px; }
        .msg-content .svc { color: #f87171; font-weight: bold; }
        .time-tag { font-size: 10px; color: var(--text2); text-align: left; margin-top: 6px; }
        .top-banner { background: #182533; border-radius: 8px; padding: 10px 12px; font-size: 13px; border-left: 3px solid #5288c1; line-height: 1.5; }
        .top-banner a { color: #64b5f6; }
        
        .btn { border: none; border-radius: 6px; padding: 9px; font-size: 12px; font-weight: 500; color: #fff; cursor: pointer; text-align: center; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .btn-blue { background: var(--blue); }
        .btn-green { background: var(--green); }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-red { background: var(--red); }
        .btn-row { display: flex; gap: 8px; }
        .btn-row .btn { flex: 1; }
        .btn-full { width: 100%; flex: none; }
        
        .btn-area { padding: 10px; border-top: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
        .footer-locked { background: var(--surface); padding: 12px; text-align: center; border-top: 1px solid var(--border); color: var(--text2); font-size: 13px; }
        
        .bottom-nav { background: var(--surface); display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid var(--border); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text2); font-size: 11px; cursor: pointer; gap: 4px; background: none; border: none; flex: 1; }
        .nav-item.active { color: #5288c1; }
        .nav-icon { font-size: 20px; }
        
        .settings-section { padding: 15px; }
        .settings-section h3 { margin-bottom: 10px; font-size: 16px; }
        .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
        .settings-row span { font-size: 14px; }
        .settings-row select, .settings-row input { background: var(--surface2); border: 1px solid var(--border); color: #fff; padding: 8px; border-radius: 6px; font-size: 13px; }
        
        .profile-section { padding: 20px; text-align: center; }
        .profile-section .avatar { width: 80px; height: 80px; font-size: 35px; margin: 0 auto 15px; }
        .profile-section h3 { font-size: 18px; margin-bottom: 5px; }
        .profile-section p { color: var(--text2); font-size: 13px; }
        .profile-section input { background: var(--surface2); border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 8px; width: 100%; margin: 10px 0; font-size: 14px; text-align: center; }
        .profile-section .btn { margin-top: 10px; }
        
        ::-webkit-scrollbar { width: 3px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    </style>
</head>
<body>
    <div class="app" id="app"></div>
    <audio id="snd" src="https://www.soundjay.com/buttons/sounds/button-09.mp3" preload="auto"></audio>

    <script>
        firebase.initializeApp({apiKey:"AIzaSyA5LuJwdTckc6V2zClBeRiozM_tdMx5fAQ",projectId:"otp-5acda",databaseURL:"https://otp-5acda-default-rtdb.firebaseio.com"});
        const db=firebase.database();
        const PROXY='/api/panel';
        
        // حفظ كل البيانات
        let S=JSON.parse(localStorage.getItem('otp_full')||'{}');
        let cur=S.cur||'main',cSvc=S.cSvc||'',cCty=S.cCty||'',curNum=S.curNum||'';
        let profile=S.profile||{name:'أنا',phone:'+201500972046',avatar:''};
        let settings=S.settings||{color:'default',lang:'ar'};
        let known=new Set(),otpTimer=null;
        
        function save(){localStorage.setItem('otp_full',JSON.stringify({cur,cSvc,cCty,curNum,profile,settings}));}
        function api(p){return fetch(PROXY+p).then(r=>r.json());}
        function el(id){return document.getElementById(id);}
        
        // ألوان
        const colors={
            default:{bg:'#0e1621',surface:'#17212b',surface2:'#242f3d',blue:'#2b5278'},
            dark:{bg:'#000',surface:'#111',surface2:'#1a1a1a',blue:'#333'},
            green:{bg:'#0a1a0a',surface:'#0f1f0f',surface2:'#1a2a1a',blue:'#1a4a1a'}
        };
        function applyColor(c){
            const cl=colors[c]||colors.default;
            document.documentElement.style.setProperty('--bg',cl.bg);
            document.documentElement.style.setProperty('--surface',cl.surface);
            document.documentElement.style.setProperty('--surface2',cl.surface2);
            document.documentElement.style.setProperty('--blue',cl.blue);
        }
        applyColor(settings.color);
        
        function render(){
            const app=el('app');
            if(cur==='main') app.innerHTML=mainHTML();
            else if(cur==='bot') app.innerHTML=chatHTML('bot');
            else if(cur==='group') app.innerHTML=chatHTML('group');
            else if(cur==='settings') app.innerHTML=settingsHTML();
            else if(cur==='profile') app.innerHTML=profileHTML();
            bindEvents();
        }
        
        function mainHTML(){
            return `
            <div class="screen">
                <div class="header">
                    <div class="header-left"><div class="avatar">✈️</div><div class="title-info"><h2>OTP Live</h2><p>Number Panel</p></div></div>
                    <div class="menu-icon" onclick="openScreen('settings')">⋮</div>
                </div>
                <div class="tabs-bar">
                    <button class="tab active">🔥 OTP LIVE</button>
                    <button class="tab">كل المحادثات <span style="background:#2b5278;color:#fff;padding:1px 6px;border-radius:10px;font-size:10px;">2</span></button>
                </div>
                <div class="main-list">
                    <div class="chat-row" onclick="openChat('bot')">
                        <div class="avatar">🤖</div>
                        <div class="info"><div class="name">🤖 NUMBER BOT</div><div class="preview">${curNum?'الرقم: '+curNum:'بوت الأرقام والخدمات'}</div></div>
                        <div class="time">الآن</div>
                    </div>
                    <div class="chat-row" onclick="openChat('group')">
                        <div class="avatar">👥</div>
                        <div class="info"><div class="name">👥 OTP GROUP</div><div class="preview">Live OTP Messages</div></div>
                        <div class="time">الآن</div>
                    </div>
                </div>
                <div class="bottom-nav">
                    <button class="nav-item active" onclick="openScreen('main')"><span class="nav-icon">💬</span><span>المحادثات</span></button>
                    <button class="nav-item" onclick="openScreen('settings')"><span class="nav-icon">⚙️</span><span>الإعدادات</span></button>
                    <button class="nav-item" onclick="openScreen('profile')"><span class="nav-icon">👤</span><span>الملف</span></button>
                </div>
            </div>`;
        }
        
        function chatHTML(type){
            const isBot=type==='bot';
            return `
            <div class="screen">
                <div class="header">
                    <div class="header-left">
                        <div class="back-arrow" style="display:block" onclick="goBack()">←</div>
                        <div class="avatar">${isBot?'🤖':'👥'}</div>
                        <div class="title-info"><h2>${isBot?'🤖 NUMBER BOT':'👥 OTP GROUP'}</h2><p>${isBot?'online':'live'}</p></div>
                    </div>
                    <div class="menu-icon">⋮</div>
                </div>
                <div class="chat-body" id="messages"></div>
                ${isBot?`<div class="btn-area" id="btnArea"></div>`:`<div class="footer-locked">OTP Live - تحديث مستمر</div>`}
            </div>`;
        }
        
        function settingsHTML(){
            return `
            <div class="screen">
                <div class="header">
                    <div class="header-left">
                        <div class="back-arrow" style="display:block" onclick="goBack()">←</div>
                        <div class="title-info"><h2>⚙️ الإعدادات</h2></div>
                    </div>
                </div>
                <div class="settings-section">
                    <h3>🎨 تغيير اللون</h3>
                    <div class="settings-row"><span>اللون</span><select id="colorSelect" onchange="changeColor(this.value)"><option value="default" ${settings.color==='default'?'selected':''}>افتراضي</option><option value="dark" ${settings.color==='dark'?'selected':''}>داكن</option><option value="green" ${settings.color==='green'?'selected':''}>أخضر</option></select></div>
                    <h3 style="margin-top:20px;">🌐 اللغة</h3>
                    <div class="settings-row"><span>اللغة</span><select id="langSelect" onchange="changeLang(this.value)"><option value="ar" ${settings.lang==='ar'?'selected':''}>العربية</option><option value="en" ${settings.lang==='en'?'selected':''}>English</option></select></div>
                </div>
            </div>`;
        }
        
        function profileHTML(){
            return `
            <div class="screen">
                <div class="header">
                    <div class="header-left">
                        <div class="back-arrow" style="display:block" onclick="goBack()">←</div>
                        <div class="title-info"><h2>👤 الملف الشخصي</h2></div>
                    </div>
                </div>
                <div class="profile-section">
                    <div class="avatar">${profile.avatar||'👤'}</div>
                    <h3>${profile.name}</h3>
                    <p>${profile.phone}</p>
                    <input type="text" id="nameInput" placeholder="الاسم" value="${profile.name}">
                    <input type="text" id="phoneInput" placeholder="رقم الهاتف" value="${profile.phone}">
                    <input type="text" id="avatarInput" placeholder="رابط الصورة (اختياري)" value="${profile.avatar}">
                    <button class="btn btn-blue btn-full" onclick="saveProfile()">💾 حفظ</button>
                </div>
            </div>`;
        }
        
        function bindEvents(){
            if(cur==='bot'){
                const ms=el('messages');
                if(curNum){
                    ms.innerHTML=`<div class="msg-block"><div class="msg-content">📱 <b>الرقم المحفوظ:</b> <span class="num">${curNum}</span></div><div class="time-tag">الآن</div></div>`;
                    el('btnArea').innerHTML=`
                        <div class="btn-row"><button class="btn btn-green" onclick="copyNum('${curNum}')">📋 نسخ</button><button class="btn btn-blue" onclick="loadServices()">🌍 دولة جديدة</button></div>
                        <div class="btn-row"><button class="btn btn-blue" onclick="getNumber('${cCty}','')">🔄 تغيير</button><button class="btn btn-gold" onclick="checkCode('${curNum}')">📩 كود</button></div>`;
                }else{ms.innerHTML='';showStart();}
            }else if(cur==='group'){
                el('messages').innerHTML='<div class="top-banner">📡 <a href="#">numberpanel.tech</a> - Live OTP<div class="time-tag">الآن</div></div>';
                db.ref('messages').off();
                db.ref('messages').limitToLast(50).on('child_added',s=>{if(cur==='group')showOTP(s.val())});
                if(otpTimer)clearInterval(otpTimer);
                otpTimer=setInterval(fetchOTP,3000);
                fetchOTP();
            }
        }
        
        function openScreen(s){
            cur=s;save();if(otpTimer){clearInterval(otpTimer);otpTimer=null;}
            render();
        }
        function openChat(t){cur=t;save();render();}
        function goBack(){cur='main';save();if(otpTimer){clearInterval(otpTimer);otpTimer=null;}render();}
        
        function showOTP(m){
            if(cur!=='group')return;
            const ms=el('messages');
            const t=new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
            ms.innerHTML+=`<div class="msg-block"><div class="msg-header"><span class="msg-user">${m.service||'OTP'}</span></div><div class="msg-content">📱 <span class="num">${m.number||''}</span><br>🔑 <span class="code">${m.code||''}</span></div><div class="time-tag">${t}</div></div>`;
            ms.scrollTop=ms.scrollHeight;
        }
        async function fetchOTP(){
            try{const d=await api('/api/otp?count=10');if(Array.isArray(d))d.forEach(i=>{const k=i[1]+'-'+i[2];if(!known.has(k)){known.add(k);db.ref('messages').push({type:'otp',service:i[0],number:i[1],code:i[2].match(/\d{4,8}/)?.[0]||i[2]});}});}catch(e){}
        }
        function showStart(){el('messages').innerHTML+='<div class="msg-block"><div class="msg-content">👋 أهلًا بك في NUMBER BOT!<br>أنا بوت الأرقام الافتراضية.</div><div class="time-tag">الآن</div></div>';el('btnArea').innerHTML='<button class="btn btn-green btn-full" onclick="loadServices()">▶️ START</button>';}
        async function loadServices(){
            el('messages').innerHTML+='<div class="msg-block"><div class="msg-content">⏳ جاري تحميل الخدمات...</div></div>';
            el('btnArea').innerHTML='';
            try{const d=await api('/api/services');if(d.success){el('messages').innerHTML+='<div class="msg-block"><div class="msg-content">📋 <b>اختر الخدمة:</b></div></div>';let btns='';d.services.slice(0,8).forEach((s,i)=>{if(i%2==0)btns+='<div class="btn-row">';btns+=`<button class="btn btn-blue" onclick="loadCountries('${s.key}','${s.name}')">${s.name} (${s.count})</button>`;if(i%2==1||i==Math.min(d.services.length,8)-1)btns+='</div>';});el('btnArea').innerHTML=btns;el('messages').scrollTop=el('messages').scrollHeight;}}catch(e){}
        }
        async function loadCountries(key,name){
            cSvc=key;save();el('messages').innerHTML+='<div class="msg-block"><div class="msg-content">📱 <b>${name}</b></div></div>';
            el('btnArea').innerHTML='';
            try{const d=await api('/api/countries?service='+key);if(d.success){el('messages').innerHTML+='<div class="msg-block"><div class="msg-content">🌍 <b>دول ${name}:</b></div></div>';let btns='';d.countries.slice(0,10).forEach((c,i)=>{if(i%2==0)btns+='<div class="btn-row">';btns+=`<button class="btn btn-blue" onclick="getNumber('${c.name}','${c.flag}')">${c.flag} ${c.name} (${c.count})</button>`;if(i%2==1||i==Math.min(d.countries.length,10)-1)btns+='</div>';});el('btnArea').innerHTML=btns;el('messages').scrollTop=el('messages').scrollHeight;}}catch(e){}
        }
        async function getNumber(country,flag){
            cCty=country;save();el('messages').innerHTML+='<div class="msg-block"><div class="msg-content">🌍 ${flag} ${country}</div></div>';
            el('btnArea').innerHTML='';
            try{const d=await api('/api/otp?count=20');if(Array.isArray(d)){const flt=d.filter(i=>i[0].toLowerCase().includes(cSvc.toLowerCase()));if(flt.length>0){curNum=flt[0][1];save();el('messages').innerHTML+=`<div class="msg-block"><div class="msg-content">📱 <b>الرقم:</b> <span class="num">${curNum}</span><br>📌 ${flag} ${country}<br>🔹 ${flt[0][0]}</div></div>`;el('btnArea').innerHTML=`<div class="btn-row"><button class="btn btn-green" onclick="copyNum('${curNum}')">📋 نسخ</button><button class="btn btn-blue" onclick="getNumber('${country}','${flag}')">🔄 تغيير</button></div><div class="btn-row"><button class="btn btn-blue" onclick="loadServices()">🌍 دولة</button><button class="btn btn-gold" onclick="checkCode('${curNum}')">📩 كود</button></div>`;}else{el('messages').innerHTML+='<div class="msg-block"><div class="msg-content">❌ لا توجد أرقام</div></div>';el('btnArea').innerHTML='<button class="btn btn-blue btn-full" onclick="loadServices()">🔙 رجوع</button>';}}}catch(e){}
        }
        function copyNum(num){navigator.clipboard.writeText(num);el('messages').innerHTML+='<div class="msg-block"><div class="msg-content">✅ تم نسخ الرقم! 📋</div></div>';el('messages').scrollTop=el('messages').scrollHeight;}
        async function checkCode(num){
            el('messages').innerHTML+='<div class="msg-block"><div class="msg-content">⏳ جاري البحث عن الكود...</div></div>';
            try{const d=await api('/api/otp?count=30');if(Array.isArray(d)){const f=d.find(i=>i[1]===num);if(f){const cd=f[2].match(/\d{4,8}/)?.[0]||f[2];el('messages').innerHTML+=`<div class="msg-block"><div class="msg-content">✅ <b>تم!</b><br>🔑 <span class="code">${cd}</span><br>📱 ${num}<br>📋 ${f[0]}</div></div>`;}else{el('messages').innerHTML+='<div class="msg-block"><div class="msg-content">⏳ لم يصل بعد</div></div>';}el('messages').scrollTop=el('messages').scrollHeight;}}catch(e){}
        }
        function changeColor(v){settings.color=v;save();applyColor(v);}
        function changeLang(v){settings.lang=v;save();}
        function saveProfile(){
            profile.name=el('nameInput').value||'أنا';
            profile.phone=el('phoneInput').value||'+201500972046';
            profile.avatar=el('avatarInput').value||'';
            save();goBack();
        }
        
        window.onload=()=>{
            if(S.cur==='group'||S.cur==='bot'){cur=S.cur;render();}
            else render();
        };
    </script>
</body>
</html>
