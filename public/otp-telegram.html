<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Live - Telegram</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0e1621; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .app { width: 100%; max-width: 450px; height: 100vh; background: #17212b; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        
        /* شاشة الرئيسية */
        .main-screen { flex: 1; display: flex; flex-direction: column; }
        .main-header { padding: 15px; background: #1e293b; border-bottom: 1px solid #0e1621; display: flex; align-items: center; justify-content: space-between; }
        .main-header h1 { color: #fff; font-size: 20px; }
        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item { display: flex; align-items: center; padding: 12px 15px; gap: 12px; cursor: pointer; border-bottom: 1px solid #1e293b; transition: 0.2s; }
        .chat-item:hover { background: #1e293b; }
        .chat-avatar { width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: #fff; flex-shrink: 0; }
        .chat-info { flex: 1; min-width: 0; }
        .chat-name { color: #fff; font-size: 16px; font-weight: 500; margin-bottom: 4px; }
        .chat-preview { color: #8c939d; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* شاشة الشات */
        .chat-screen { flex: 1; display: flex; flex-direction: column; display: none; }
        .chat-screen.active { display: flex; }
        .chat-topbar { padding: 10px 15px; background: #1e293b; border-bottom: 1px solid #0e1621; display: flex; align-items: center; gap: 10px; }
        .back-btn { color: #2aabee; font-size: 22px; cursor: pointer; padding: 5px; }
        .top-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; color: #fff; flex-shrink: 0; }
        .top-name { color: #fff; font-weight: 600; font-size: 16px; flex: 1; }
        .top-status { color: #2aabee; font-size: 12px; }
        .messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 10px; font-size: 15px; line-height: 1.5; word-break: break-word; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .msg-bot { align-self: flex-start; background: #1e293b; color: #fff; border: 1px solid #334155; border-bottom-left-radius: 2px; }
        .msg-user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 2px; }
        .msg-otp { align-self: flex-start; background: #1e293b; color: #fff; border: 1px solid #f59e0b; border-bottom-left-radius: 2px; }
        .msg .time { font-size: 11px; color: #94a3b8; margin-top: 4px; text-align: left; }
        .msg .otp-label { color: #f59e0b; font-size: 11px; font-weight: 600; margin-bottom: 4px; }
        .msg .code { background: #f59e0b; color: #000; padding: 2px 8px; border-radius: 4px; font-weight: bold; display: inline-block; margin: 4px 0; }
        .msg .num { color: #60a5fa; font-weight: bold; }
        .msg .svc { color: #f87171; font-weight: bold; }

        /* أزرار البوت */
        .bot-actions { padding: 10px 15px; background: #1e293b; border-top: 1px solid #0e1621; display: flex; flex-wrap: wrap; gap: 8px; }
        .bot-actions button { background: #2563eb; color: #fff; border: none; padding: 10px 18px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 500; transition: 0.2s; }
        .bot-actions button:hover { background: #1d4ed8; }
        .bot-actions button.copy-btn { background: #059669; }
        .bot-actions button.copy-btn:hover { background: #047857; }

        /* شريط الكتابة */
        .input-bar { padding: 10px 15px; background: #1e293b; border-top: 1px solid #0e1621; display: flex; gap: 10px; }
        .input-bar input { flex: 1; background: #0f172a; border: 1px solid #334155; padding: 10px 15px; border-radius: 20px; color: #fff; font-size: 15px; outline: none; }
        .input-bar button { background: #2563eb; color: #fff; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 14px; }
        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 3px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    </style>
</head>
<body>
    <div class="app">
        <!-- الرئيسية -->
        <div id="mainScreen" class="main-screen">
            <div class="main-header"><h1>✈️ OTP Live</h1></div>
            <div class="chat-list">
                <div class="chat-item" onclick="openChat('bot')">
                    <div class="chat-avatar" style="background:#2563eb;">🤖</div>
                    <div class="chat-info"><div class="chat-name">🤖 NUMBER BOT</div><div class="chat-preview" id="botPreview">بوت الأرقام والخدمات</div></div>
                </div>
                <div class="chat-item" onclick="openChat('group')">
                    <div class="chat-avatar" style="background:#e17076;">👥</div>
                    <div class="chat-info"><div class="chat-name">👥 OTP GROUP</div><div class="chat-preview" id="groupPreview">Live OTP Messages</div></div>
                </div>
            </div>
        </div>

        <!-- شاشة الشات -->
        <div id="chatScreen" class="chat-screen">
            <div class="chat-topbar">
                <div class="back-btn" onclick="goBack()">←</div>
                <div class="top-avatar" id="topAvatar" style="background:#2563eb;">🤖</div>
                <div><div class="top-name" id="topName">🤖 NUMBER BOT</div><div class="top-status" id="topStatus">online</div></div>
            </div>
            <div class="messages" id="messages"></div>
            <div class="bot-actions" id="botActions"></div>
            <div class="input-bar" id="inputBar">
                <input type="text" id="msgInput" placeholder="رسالة..." onkeypress="if(event.key==='Enter')sendMsg()">
                <button onclick="sendMsg()">📤</button>
            </div>
        </div>
    </div>

    <script>
        firebase.initializeApp({apiKey:"AIzaSyA5LuJwdTckc6V2zClBeRiozM_tdMx5fAQ",projectId:"otp-5acda",databaseURL:"https://otp-5acda-default-rtdb.firebaseio.com"});
        const db=firebase.database();
        const PROXY='/api/panel';
        let cur='bot',cSvc='',cCty='',curNum='',known=new Set(),otpTimer=null;

        function api(p){return fetch(PROXY+p).then(r=>r.json());}

        function openChat(t){
            cur=t;
            document.getElementById('mainScreen').style.display='none';
            document.getElementById('chatScreen').classList.add('active');
            document.getElementById('messages').innerHTML='';
            document.getElementById('botActions').innerHTML='';
            if(otpTimer){clearInterval(otpTimer);otpTimer=null;}

            if(t==='bot'){
                document.getElementById('topAvatar').style.background='#2563eb';
                document.getElementById('topAvatar').textContent='🤖';
                document.getElementById('topName').textContent='🤖 NUMBER BOT';
                document.getElementById('topStatus').textContent='online';
                document.getElementById('inputBar').classList.add('hidden');
                document.getElementById('botActions').classList.remove('hidden');
                showStartButton();
            }else{
                document.getElementById('topAvatar').style.background='#e17076';
                document.getElementById('topAvatar').textContent='👥';
                document.getElementById('topName').textContent='👥 OTP GROUP';
                document.getElementById('topStatus').textContent='live';
                document.getElementById('inputBar').classList.add('hidden');
                document.getElementById('botActions').classList.add('hidden');
                db.ref('messages').off();
                db.ref('messages').limitToLast(50).on('child_added',s=>{if(cur==='group')showOTP(s.val())});
                otpTimer=setInterval(fetchOTP,3000);
                fetchOTP();
            }
        }

        function goBack(){
            document.getElementById('chatScreen').classList.remove('active');
            document.getElementById('mainScreen').style.display='flex';
            if(otpTimer){clearInterval(otpTimer);otpTimer=null;}
        }

        function addMsg(type,text){
            const ms=document.getElementById('messages');
            const cls=type==='bot'?'msg-bot':(type==='user'?'msg-user':'msg-otp');
            const t=new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
            ms.innerHTML+=`<div class="msg ${cls}">${text}<div class="time">${t}</div></div>`;
            ms.scrollTop=ms.scrollHeight;
        }

        function showOTP(m){
            if(m.type==='otp'){
                addMsg('otp',`<div class="otp-label">📩 Live OTP</div><span class="svc">${m.service||''}</span><br><span class="num">${m.number||''}</span><br><span class="code">${m.code||''}</span>`);
            }else{
                addMsg(m.sender==='أنا'?'user':'bot',`${m.sender!=='أنا'?`<small style="color:#60a5fa">${m.sender||'مستخدم'}</small><br>`:''}${m.text||''}`);
            }
        }

        async function fetchOTP(){
            try{
                const d=await api('/api/otp?count=10');
                if(Array.isArray(d))d.forEach(i=>{
                    const k=`${i[1]}-${i[2]}`;
                    if(!known.has(k)){known.add(k);
                        db.ref('messages').push({type:'otp',service:i[0],number:i[1],code:i[2].match(/\d{4,8}/)?.[0]||i[2],text:i[2].slice(0,100),time:new Date().toLocaleTimeString('ar-EG'),sender:'OTP'});
                    }
                });
            }catch(e){}
        }

        // === BOT LOGIC ===
        function showStartButton(){
            addMsg('bot','👋 أهلًا بك في NUMBER BOT!<br><br>أنا بوت الأرقام الافتراضية.<br><br>اضغط START للبدء ⬇️');
            document.getElementById('botActions').innerHTML='<button onclick="loadServices()">▶️ START</button>';
        }

        async function loadServices(){
            addMsg('bot','⏳ جاري تحميل الخدمات...');
            document.getElementById('botActions').innerHTML='';
            try{
                const d=await api('/api/services');
                if(d.success){
                    addMsg('bot','📋 <b>اختر الخدمة:</b>');
                    let btns='';
                    d.services.slice(0,8).forEach(s=>{btns+=`<button onclick="loadCountries('${s.key}','${s.name}')">${s.name} (${s.count})</button>`;});
                    document.getElementById('botActions').innerHTML=btns;
                }
            }catch(e){addMsg('bot','❌ خطأ');}
        }

        async function loadCountries(key,name){
            cSvc=key;addMsg('user',`📱 ${name}`);addMsg('bot','⏳ جاري تحميل الدول...');document.getElementById('botActions').innerHTML='';
            try{
                const d=await api(`/api/countries?service=${key}`);
                if(d.success){
                    addMsg('bot',`🌍 <b>دول ${name}:</b>`);
                    let btns='';
                    d.countries.slice(0,10).forEach(c=>{btns+=`<button onclick="getNumber('${c.name}','${c.flag}')">${c.flag} ${c.name} (${c.count})</button>`;});
                    document.getElementById('botActions').innerHTML=btns;
                }
            }catch(e){addMsg('bot','❌ خطأ');}
        }

        async function getNumber(country,flag){
            cCty=country;addMsg('user',`🌍 ${flag} ${country}`);addMsg('bot','⏳ جاري جلب رقم...');document.getElementById('botActions').innerHTML='';
            try{
                const d=await api('/api/otp?count=20');
                if(Array.isArray(d)){
                    const flt=d.filter(i=>i[0].toLowerCase().includes(cSvc.toLowerCase()));
                    if(flt.length>0){
                        curNum=flt[0][1];
                        addMsg('bot',`📱 <b>الرقم:</b> <span class="num" style="font-size:18px;">${curNum}</span><br>📌 ${flag} ${country}<br>🔹 ${flt[0][0]}`);
                        document.getElementById('botActions').innerHTML=`
                            <button class="copy-btn" onclick="copyNum('${curNum}')">📋 نسخ الرقم</button>
                            <button onclick="getNumber('${country}','${flag}')">🔄 تغيير الرقم</button>
                            <button onclick="loadServices()">🌍 تغيير الدولة</button>
                            <button onclick="checkCode('${curNum}')">📩 جلب الكود</button>
                        `;
                    }else{addMsg('bot','❌ لا توجد أرقام');document.getElementById('botActions').innerHTML='<button onclick="loadServices()">🔙 رجوع</button>';}
                }
            }catch(e){addMsg('bot','❌ خطأ');}
        }

        function copyNum(num){
            navigator.clipboard.writeText(num);
            addMsg('bot','✅ تم نسخ الرقم! 📋');
        }

        async function checkCode(num){
            addMsg('bot','⏳ جاري البحث عن الكود...');
            try{
                const d=await api('/api/otp?count=30');
                if(Array.isArray(d)){
                    const f=d.find(i=>i[1]===num);
                    if(f){const cd=f[2].match(/\d{4,8}/)?.[0]||f[2];addMsg('bot',`✅ <b>تم العثور على الكود!</b><br><br>🔑 <span class="code">${cd}</span><br>📱 ${num}<br>📋 ${f[0]}`);}
                    else{addMsg('bot','⏳ لم يصل الكود بعد، جرب تاني');}
                }
            }catch(e){addMsg('bot','❌ خطأ');}
        }

        function sendMsg(){
            const inp=document.getElementById('msgInput'),tx=inp.value.trim();if(!tx)return;
            addMsg('user',tx);inp.value='';
            const l=tx.toLowerCase();
            if(l==='start'||l==='ابدأ')loadServices();
            else if(l==='services'||l==='خدمات')loadServices();
            else if(l==='code'||l==='كود'&&curNum)checkCode(curNum);
        }

        // حفظ آخر رقم
        window.onload=()=>{
            const saved=localStorage.getItem('otp_state');
            if(saved)try{const s=JSON.parse(saved);cSvc=s.cSvc||'';cCty=s.cCty||'';curNum=s.curNum||'';}catch(e){}
        };
        window.onbeforeunload=()=>{localStorage.setItem('otp_state',JSON.stringify({cSvc,cCty,curNum}));};
    </script>
</body>
</html>
