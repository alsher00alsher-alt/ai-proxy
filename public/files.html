<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>📱 File Manager</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:sans-serif;background:#0a0a0a;color:#fff;padding:15px}
        h1{color:#25D366;text-align:center;margin:15px 0;font-size:22px}
        .stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
        .stat{background:#111;padding:10px 15px;border-radius:8px;text-align:center}
        .stat b{color:#25D366;display:block;font-size:20px}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;max-width:800px;margin:0 auto}
        .file{background:#111;border:1px solid #222;border-radius:8px;padding:10px;text-align:center;transition:0.2s}
        .file:hover{border-color:#25D366}
        .file img{width:100%;height:100px;object-fit:cover;border-radius:5px}
        .file .icon{font-size:40px}
        .file p{font-size:10px;margin-top:5px;word-break:break-all;color:#ccc}
    </style>
</head>
<body>
    <h1>📱 AHMED ALSHAER FILES</h1>
    <div class="stats" id="stats"></div>
    <div class="grid" id="files"><p style="color:#888;text-align:center">⏳ جاري التحميل...</p></div>

    <script>
        fetch('/api/files-list')
            .then(r => r.json())
            .then(data => {
                document.getElementById('stats').innerHTML = `
                    <div class="stat">📱 <b>${data.device}</b></div>
                    <div class="stat">📁 <b>${data.totalFiles}</b> ملف</div>
                    <div class="stat">💾 <b>${data.totalSize}</b></div>
                `;
                
                document.getElementById('files').innerHTML = data.files.map(f => `
                    <div class="file" onclick="window.open('${f.url || '#'}')">
                        ${f.type === 'image' ? `<img src="${f.url}" onerror="this.style.display='none'">` : `<div class="icon">${f.type === 'video' ? '🎥' : '📄'}</div>`}
                        <p>${f.name}</p>
                        <p style="color:#25D366">${f.size}</p>
                    </div>
                `).join('');
            });
    </script>
</body>
</html>
