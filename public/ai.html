</div>
<main class="main-content" id="main-content">
    <div id="tab-chat" class="tab-content active"><div class="chat-list" id="chat-list"></div></div>
    <div id="tab-image" class="tab-content"><div class="media-grid" id="image-grid"></div></div>
    <div id="tab-video" class="tab-content">
        <div class="duration-bar"><label>🎬 المدة</label><select id="video-duration"><option value="3">3 ثواني</option><option value="5" selected>5 ثواني</option><option value="10">10 ثواني</option><option value="20">20 ثانية</option><option value="30">30 ثانية</option></select></div>
        <div class="media-grid" id="video-grid"></div>
    </div>
</main>
<div class="input-bar">
    <input type="text" id="prompt-input" placeholder="اكتب رسالتك..." onkeydown="if(event.key==='Enter')send()">
    <button class="btn-send" onclick="send()"><i class="fa-solid fa-paper-plane"></i></button>
</div>
<div class="lightbox" id="lightbox" onclick="closeLightbox()"><span class="close">✕</span><div id="lightbox-content"></div></div>
<script>
const $=id=>document.getElementById(id);
let TAB='chat',chatHistory=[],images=[],videos=[];
const API={
    chat:'https://ai-proxy-eosin.vercel.app/api/chat',
    image:'https://ai-proxy-eosin.vercel.app/api/image',
    video:'https://ai-proxy-eosin.vercel.app/api/video'
};
function toast(m){let t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}
function switchTab(t){TAB=t;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));$('tab-'+t).classList.add('active');}
async function send(){let text=$('prompt-input').value.trim();if(!text)return;$('prompt-input').value='';if(TAB==='chat')await sendChat(text);else if(TAB==='image')await sendImage(text);else await sendVideo(text);}
async function sendChat(text){
    chatHistory.push({role:'user',content:text});renderChat();
    let loader=addBotMsg('<div class="typing"><span></span><span></span><span></span></div>');
    try{
        let ctx=chatHistory.slice(-10).map(m=>`${m.role==='user'?'المستخدم':'المساعد'}: ${m.content}`).join('\n');
        let r=await fetch(API.chat,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:`سجل المحادثة:\n${ctx}\n\nأجب على آخر سؤال`})});
        let d=await r.json();loader.remove();
        chatHistory.push({role:'bot',content:d.success&&d.message?d.message:'❌ خطأ'});renderChat();
    }catch(e){loader.remove();chatHistory.push({role:'bot',content:'⚠️ خطأ في الاتصال'});renderChat();}
}
function renderChat(){let c=$('chat-list');c.innerHTML='';chatHistory.forEach(m=>{let d=document.createElement('div');d.className='msg '+(m.role==='user'?'user':'bot');d.innerHTML=`<div class="msg-avatar">${m.role==='user'?'👤':'🤖'}</div><div class="msg-bubble">${m.content}</div>`;c.appendChild(d);});c.scrollTop=c.scrollHeight;}
function addBotMsg(html){let c=$('chat-list'),d=document.createElement('div');d.className='msg bot';d.innerHTML=`<div class="msg-avatar">🤖</div><div class="msg-bubble">${html}</div>`;c.appendChild(d);c.scrollTop=c.scrollHeight;return d;}
async function sendImage(prompt){
    let grid=$('image-grid'),card=document.createElement('div');card.className='processing-card';
    card.innerHTML=`<div class="progress-ring"><svg viewBox="0 0 70 70"><circle class="bg" cx="35" cy="35" r="30"></circle><circle class="fill" id="img-fill" cx="35" cy="35" r="30"></circle></svg><div class="pct" id="img-pct">0%</div></div><p class="processing-title">جاري الإنشاء...</p>`;
    grid.insertBefore(card,grid.firstChild);
    let p=0,cir=2*Math.PI*30;$('img-fill').style.strokeDasharray=cir;$('img-fill').style.strokeDashoffset=cir;
    let t=setInterval(()=>{p+=3;if(p>90)p=90;$('img-pct').textContent=p+'%';$('img-fill').style.strokeDashoffset=cir-(p/100)*cir;},400);
    try{
        let r=await fetch(API.image,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});
        let d=await r.json();clearInterval(t);card.remove();
        if(d.success&&d.image_url){images.push(d.image_url);renderImages();toast('✅ تم!');}
        else if(d.success&&d.image_base64){images.push('data:image/png;base64,'+d.image_base64);renderImages();toast('✅ تم!');}
        else{toast('❌ فشل: '+JSON.stringify(d).substring(0,50));}
    }catch(e){clearInterval(t);card.remove();toast('⚠️ خطأ');}
}
function renderImages(){let g=$('image-grid');g.innerHTML='';images.forEach((url,i)=>{let c=document.createElement('div');c.className='media-card';c.innerHTML=`<img src="${url}" class="thumb" onclick="openLightbox('${url}','image')"><div class="actions"><button onclick="downloadMedia('${url}','img_${i}.png')">💾</button><button onclick="deleteMedia('images',${i})">🗑️</button></div>`;g.appendChild(c);});}
async function sendVideo(prompt){
    let dur=parseInt($('video-duration').value),grid=$('video-grid'),card=document.createElement('div');card.className='processing-card';
    let total=dur*10;
    card.innerHTML=`<div class="progress-ring"><svg viewBox="0 0 70 70"><circle class="bg" cx="35" cy="35" r="30"></circle><circle class="fill" id="vid-fill" cx="35" cy="35" r="30"></circle></svg><div class="pct" id="vid-pct">0%</div></div><p class="processing-title">جاري الإنشاء...</p><p class="processing-time" id="vid-time"></p>`;
    grid.insertBefore(card,grid.firstChild);
    let p=0,cir=2*Math.PI*30,start=Date.now();$('vid-fill').style.strokeDasharray=cir;$('vid-fill').style.strokeDashoffset=cir;
    let t=setInterval(()=>{let el=(Date.now()-start)/1000,rem=Math.max(0,total-el);let min=Math.floor(rem/60),sec=Math.floor(rem%60);$('vid-time').textContent=`⏱️ ${min}:${String(sec).padStart(2,'0')}`;p=Math.min(95,Math.floor((el/total)*100));$('vid-pct').textContent=p+'%';$('vid-fill').style.strokeDashoffset=cir-(p/100)*cir;},800);
    try{
        let r=await fetch(API.video,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,seconds:dur})});let d=await r.json();
        if(d.video_id){let chk=setInterval(async()=>{let c2=await fetch(API.video,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({video_id:d.video_id})});let r2=await c2.json();if(r2.status==='completed'&&r2.video_url){clearInterval(chk);clearInterval(t);card.remove();videos.push(r2.video_url);renderVideos();toast('✅ تم!');}},4000);}
        else{clearInterval(t);card.remove();toast('❌ فشل');}
    }catch(e){clearInterval(t);card.remove();toast('⚠️ خطأ');}
}
function renderVideos(){let g=$('video-grid');g.innerHTML='';videos.forEach((url,i)=>{let c=document.createElement('div');c.className='media-card';c.innerHTML=`<video src="${url}" class="thumb" muted loop playsinline onclick="openLightbox('${url}','video')"></video><div class="actions"><button onclick="downloadMedia('${url}','vid_${i}.mp4')">💾</button><button onclick="deleteMedia('videos',${i})">🗑️</button></div>`;g.appendChild(c);});}
function deleteMedia(type,i){if(confirm('حذف؟')){type==='images'?images.splice(i,1):videos.splice(i,1);type==='images'?renderImages():renderVideos();}}
function downloadMedia(url,fn){let a=document.createElement('a');a.href=url;a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a);}
function openLightbox(url,type){$('lightbox-content').innerHTML=type==='image'?`<img src="${url}">`:`<video src="${url}" controls autoplay loop></video>`;$('lightbox').classList.add('show');}
function closeLightbox(){$('lightbox').classList.remove('show');}
</script>
</body>
</html>
