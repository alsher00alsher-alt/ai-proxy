<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Chat + Dual</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#050508;--surface:#0d0d14;--primary:#8b5cf6;--primary-light:#a78bfa;--secondary:#06b6d4;--danger:#ef4444;--text:#f1f5f9;--muted:#94a3b8;--border:#1e2040}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
        
        .normal-mode{display:flex;flex-direction:column;height:100vh}
        .header{background:var(--surface);padding:12px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
        .header .logo{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#ec4899);display:flex;align-items:center;justify-content:center;font-size:22px}
        .header .info{flex:1}.header h1{font-size:16px;font-weight:800}.header p{font-size:10px;color:var(--muted)}
        .btn-x{background:var(--danger);color:#fff;border:none;padding:10px 20px;border-radius:10px;font-size:16px;font-weight:900;cursor:pointer;font-family:'Cairo',sans-serif;animation:pulse 2s infinite;letter-spacing:1px}
        @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.4)}50%{box-shadow:0 0 0 20px rgba(239,68,68,0)}}
        
        .chat-box{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;max-width:700px;margin:0 auto;width:100%}
        .msg{display:flex;gap:10px;max-width:85%}
        .msg.user{align-self:flex-end;flex-direction:row-reverse}
        .msg.bot{align-self:flex-start}
        .msg-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
        .msg.bot .msg-avatar{background:linear-gradient(135deg,var(--primary),#ec4899)}
        .msg.user .msg-avatar{background:var(--surface);border:1px solid var(--border)}
        .msg-bubble{padding:12px 16px;border-radius:14px;font-size:13px;line-height:1.6}
        .msg.bot .msg-bubble{background:var(--surface);border:1px solid var(--border)}
        .msg.user .msg-bubble{background:var(--primary);color:#fff}
        
        .input-bar{background:var(--surface);padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:10px;max-width:700px;margin:0 auto;width:100%}
        .input-bar input{flex:1;padding:14px 20px;background:var(--bg);border:2px solid var(--border);border-radius:25px;color:var(--text);outline:none;font-size:14px;font-family:'Cairo',sans-serif}
        .input-bar input:focus{border-color:var(--primary)}
        .input-bar button{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#ec4899);border:none;color:#fff;font-size:18px;cursor:pointer}
        
        .typing{display:flex;gap:3px;padding:5px 0}
        .typing span{width:5px;height:5px;background:var(--muted);border-radius:50%;animation:bounce 1.4s infinite}
        .typing span:nth-child(1){animation-delay:0s}.typing span:nth-child(2){animation-delay:0.2s}.typing span:nth-child(3){animation-delay:0.4s}
        @keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
        
        .split-mode{display:none;flex-direction:column;height:100vh}
        .split-mode.show{display:flex}.normal-mode.hide{display:none}
        
        .split-toolbar{display:flex;gap:8px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;align-items:center}
        .split-toolbar button{padding:8px 12px;border:none;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;color:#fff}
        .split-toolbar .btn-swap{background:#f59e0b}.split-toolbar .btn-close{background:var(--danger)}
        .split-toolbar .btn-toggle{background:var(--secondary)}
        
        .split-container{flex:1;display:flex;flex-direction:column;overflow:hidden}
        .split-panel{position:relative;overflow:hidden;flex:1}
        .split-panel iframe{width:100%;height:100%;border:none}
        .split-panel .panel-close{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.7);color:#fff;border:none;width:24px;height:24px;border-radius:50%;font-size:12px;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center}
        .split-divider{height:3px;background:var(--primary);cursor:row-resize;flex-shrink:0}
        .single-panel{flex:1!important}.hidden-panel{display:none!important}.hidden-divider{display:none!important}
    </style>
</head>
<body>

<div class="normal-mode" id="normalMode">
    <div class="header">
        <div class="logo">🤖</div>
        <div class="info"><h1>AI Chat</h1><p>ذكاء اصطناعي حقيقي</p></div>
        <button class="btn-x" onclick="openSplit()">✕</button>
    </div>
    <div class="chat-box" id="chatBox">
        <div class="msg bot"><div class="msg-avatar">🤖</div><div class="msg-bubble">👋 مرحباً! أنا مساعدك الذكي المدعوم بـ Agnes AI<br><br>🔴 <b>اضغط ✕ الحمرا</b> لفتح المتصفح المزدوج</div></div>
    </div>
    <div class="input-bar">
        <input type="text" id="prompt" placeholder="✍️ اكتب سؤالك..." onkeydown="if(event.key==='Enter')send()">
        <button onclick="send()">➤</button>
    </div>
</div>

<div class="split-mode" id="splitMode">
    <div class="split-toolbar">
        <button onclick="swapPanels()" class="btn-swap">🔃 تبديل</button>
        <button onclick="toggleTop()" class="btn-toggle">🔝 إخفاء العلوي</button>
        <button onclick="toggleBottom()" class="btn-toggle">🔽 إخفاء السفلي</button>
        <button onclick="closeSplit()" class="btn-close">✕ رجوع للشات</button>
    </div>
    <div class="split-container" id="splitContainer">
        <div class="split-panel" id="topPanel">
            <button class="panel-close" onclick="toggleTop()">✕</button>
            <iframe id="frameTop" src="https://moakt.com/ar/inbox"></iframe>
        </div>
        <div class="split-divider" id="divider"></div>
        <div class="split-panel" id="bottomPanel">
            <button class="panel-close" onclick="toggleBottom()">✕</button>
            <iframe id="frameBottom" src="https://ai-proxy-omiz.vercel.app/number.html"></iframe>
        </div>
    </div>
</div>

<script>
const API='/api/agnes';

function addMsg(role,html){
    let d=document.createElement('div');d.className='msg '+role;
    d.innerHTML=`<div class="msg-avatar">${role==='user'?'👤':'🤖'}</div><div class="msg-bubble">${html}</div>`;
    document.getElementById('chatBox').appendChild(d);d.scrollIntoView({behavior:'smooth'});
}
function loader(){
    let d=document.createElement('div');d.className='msg bot';
    d.innerHTML='<div class="msg-avatar">🤖</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    document.getElementById('chatBox').appendChild(d);d.scrollIntoView({behavior:'smooth'});return d;
}

async function send(){
    let t=document.getElementById('prompt').value.trim();if(!t)return;
    document.getElementById('prompt').value='';addMsg('user',t);
    let l=loader();
    try{
        let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'chat',message:t})});
        let d=await r.json();l.remove();
        addMsg('bot',d.success?d.message:'❌ حدث خطأ');
    }catch(e){l.remove();addMsg('bot','❌ خطأ في الاتصال');}
}

function openSplit(){document.getElementById('normalMode').classList.add('hide');document.getElementById('splitMode').classList.add('show');}
function closeSplit(){document.getElementById('splitMode').classList.remove('show');document.getElementById('normalMode').classList.remove('hide');}

function swapPanels(){
    let t=document.getElementById('frameTop').src,b=document.getElementById('frameBottom').src;
    document.getElementById('frameTop').src=b;document.getElementById('frameBottom').src=t;
}
function toggleTop(){
    document.getElementById('topPanel').classList.toggle('hidden-panel');
    document.getElementById('divider').classList.toggle('hidden-divider');
    if(document.getElementById('topPanel').classList.contains('hidden-panel'))document.getElementById('bottomPanel').classList.add('single-panel');
    else document.getElementById('bottomPanel').classList.remove('single-panel');
}
function toggleBottom(){
    document.getElementById('bottomPanel').classList.toggle('hidden-panel');
    document.getElementById('divider').classList.toggle('hidden-divider');
    if(document.getElementById('bottomPanel').classList.contains('hidden-panel'))document.getElementById('topPanel').classList.add('single-panel');
    else document.getElementById('topPanel').classList.remove('single-panel');
}

let isDragging=false;
document.getElementById('divider').addEventListener('mousedown',()=>isDragging=true);
document.getElementById('divider').addEventListener('touchstart',()=>isDragging=true);
document.addEventListener('mousemove',e=>{
    if(!isDragging)return;
    let top=document.getElementById('topPanel'),bottom=document.getElementById('bottomPanel');
    top.style.flex='none';top.style.height=Math.max(50,e.clientY)+'px';bottom.style.flex='1';
});
document.addEventListener('touchmove',e=>{
    if(!isDragging)return;
    let top=document.getElementById('topPanel'),bottom=document.getElementById('bottomPanel');
    top.style.flex='none';top.style.height=Math.max(50,e.touches[0].clientY)+'px';bottom.style.flex='1';
});
document.addEventListener('mouseup',()=>isDragging=false);
document.addEventListener('touchend',()=>isDragging=false);
</script>
</body>
</html>
