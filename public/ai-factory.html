<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Factory - Ahmed AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Cairo',sans-serif;background:#050508;color:#f1f5f9;min-height:100vh;display:flex;flex-direction:column}
        header{background:#0d0d14;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #1e293b}
        header .logo{font-size:28px}header h1{font-size:18px;background:linear-gradient(135deg,#a78bfa,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        main{flex:1;padding:20px;max-width:550px;margin:0 auto;width:100%}
        
        .chat-box{background:#0d0d14;border:1px solid #1e293b;border-radius:16px;padding:16px;margin-bottom:16px;min-height:300px;max-height:50vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
        .msg{display:flex;gap:8px;max-width:90%}
        .msg.user{align-self:flex-end;flex-direction:row-reverse}
        .msg.bot{align-self:flex-start}
        .msg .avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;background:#1e293b;flex-shrink:0}
        .msg.user .avatar{background:#7c3aed}
        .msg .bubble{padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.5}
        .msg.user .bubble{background:#7c3aed;color:#fff}
        .msg.bot .bubble{background:#1e293b;color:#f1f5f9}
        .msg.bot .bubble a{color:#06b6d4;display:inline-block;margin-top:6px;padding:6px 12px;background:#7c3aed;border-radius:6px;text-decoration:none;font-size:11px;font-weight:700}
        
        .input-bar{display:flex;gap:8px;background:#0d0d14;padding:12px;border-radius:16px;border:1px solid #1e293b}
        .input-bar input{flex:1;padding:12px;background:#050508;border:1px solid #1e293b;color:#fff;border-radius:10px;font-family:'Cairo',sans-serif;font-size:14px;outline:none}
        .input-bar input:focus{border-color:#7c3aed}
        .input-bar button{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#06b6d4);border:none;color:#fff;font-size:18px;cursor:pointer}
        
        .progress-card{background:#0d0d14;border:2px dashed #7c3aed;border-radius:12px;padding:15px;text-align:center;margin:10px 0}
        .progress-card .bar{width:100%;height:5px;background:#1e293b;border-radius:3px;margin:10px 0;overflow:hidden}
        .progress-card .fill{height:100%;background:#7c3aed;width:0%;border-radius:3px}
        .progress-card .pct{font-size:12px;color:#a78bfa}
        
        .typing{display:flex;gap:3px;padding:5px 0}
        .typing span{width:5px;height:5px;background:#94a3b8;border-radius:50%;animation:bounce 1.4s infinite}
        .typing span:nth-child(1){animation-delay:0s}.typing span:nth-child(2){animation-delay:0.2s}.typing span:nth-child(3){animation-delay:0.4s}
        @keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
        
        .files-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
        .file-card{background:#0d0d14;border:1px solid #1e293b;border-radius:10px;padding:12px;text-align:center}
        .file-card .icon{font-size:30px}.file-card .name{font-size:11px;font-weight:700;margin:4px 0}
        .file-card a{display:inline-block;margin-top:6px;padding:6px 12px;background:#7c3aed;color:#fff;border-radius:6px;text-decoration:none;font-size:10px;font-weight:700}
        
        .quick-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
        .quick-btn{padding:8px 14px;background:#1e293b;border:1px solid #333;color:#94a3b8;border-radius:20px;font-size:11px;cursor:pointer;font-family:'Cairo',sans-serif;white-space:nowrap}
        .quick-btn:active{background:#7c3aed;color:#fff}
    </style>
</head>
<body>
    <header><span class="logo">🤖</span><h1>AI Factory</h1></header>
    
    <main>
        <div class="chat-box" id="chat">
            <div class="msg bot">
                <div class="avatar">🤖</div>
                <div class="bubble">
                    👋 مرحباً! أنا AI Factory<br>
                    أقدر أصنعلك:<br>
                    🎨 اسكنات | ☠️ هاك | ⚡ FPS | 📁 ملفات<br>
                    <br>اكتب طلبك تحت 👇
                </div>
            </div>
        </div>
        
        <div class="quick-actions">
            <button class="quick-btn" onclick="quickSend('صنع اسكنات')">🎨 صنع اسكنات</button>
            <button class="quick-btn" onclick="quickSend('صنع هاك')">☠️ صنع هاك</button>
            <button class="quick-btn" onclick="quickSend('صنع FPS')">⚡ صنع FPS</button>
            <button class="quick-btn" onclick="quickSend('صنع ايم بوت')">🎯 صنع ايم بوت</button>
            <button class="quick-btn" onclick="quickSend('صنع ESP')">👁️ صنع ESP</button>
        </div>
        
        <div class="input-bar">
            <input type="text" id="prompt" placeholder="اكتب طلبك هنا..." onkeydown="if(event.key==='Enter')send()">
            <button onclick="send()">➤</button>
        </div>
    </main>

    <script>
        const files={
            'اسكنات':{v1:'https://www.mediafire.com/file/zksxavlbh9052n2/SKIN_1_APP.zip',v2:'https://www.mediafire.com/file/wjwqpf5u0qd8rt2/SKIN_2_APP_.zip/file',name:'اسكنات'},
            'هاك':{v1:'https://www.mediafire.com/file/8vc1p8xjzu8h1hn/HACKE_V_1_APP_.zip/file',v2:'https://www.mediafire.com/file/hhk46due9468tzk/HACKE_V_2_APP_.zip/file',name:'هاك'},
            'fps':{v1:'https://www.mediafire.com/file/vpqwmc0p9pbnbrs/FPS_HACKE_165_V_1_APP_.zip/file',name:'FPS 165'},
            'فريم':{v1:'https://www.mediafire.com/file/vpqwmc0p9pbnbrs/FPS_HACKE_165_V_1_APP_.zip/file',name:'FPS 165'},
            'فريمات':{v1:'https://www.mediafire.com/file/vpqwmc0p9pbnbrs/FPS_HACKE_165_V_1_APP_.zip/file',name:'FPS 165'},
        };
        
        const unknown=['ايم بوت','aimbot','esp','wallhack','ماجيك','بوليت','تلي بورت'];
        
        function addMsg(role,html){
            let d=document.createElement('div');d.className='msg '+role;
            d.innerHTML=`<div class="avatar">${role==='user'?'👤':'🤖'}</div><div class="bubble">${html}</div>`;
            document.getElementById('chat').appendChild(d);
            document.getElementById('chat').scrollTop=document.getElementById('chat').scrollHeight;
            return d;
        }
        
        function addLoader(){
            let d=addMsg('bot','<div class="typing"><span></span><span></span><span></span></div>');
            return d;
        }
        
        function quickSend(t){document.getElementById('prompt').value=t;send();}
        
        async function send(){
            let t=document.getElementById('prompt').value.trim().toLowerCase();
            if(!t)return;
            document.getElementById('prompt').value='';
            addMsg('user',t);
            
            let loader=addLoader();
            await new Promise(r=>setTimeout(r,1000+Math.random()*1500));
            loader.remove();
            
            // تحقق من الطلب
            let found=null;
            for(let key in files){
                if(t.includes(key)){found=files[key];break;}
            }
            
            // تحقق من الطلبات غير المعروفة
            let isUnknown=false;
            for(let u of unknown){
                if(t.includes(u)){isUnknown=true;break;}
            }
            
            if(isUnknown){
                addMsg('bot',`😅 معلش، لسا متعلمتش أعمل <b>${t}</b><br><br>جرب تطلب:<br>🎨 صنع اسكنات<br>☠️ صنع هاك<br>⚡ صنع FPS`);
                return;
            }
            
            if(found){
                // إظهار تقدم
                let card=addMsg('bot',`
                    <div class="progress-card">
                        <b>⚡ جاري صنع ${found.name}...</b>
                        <div class="bar"><div class="fill" id="fill-${Date.now()}"></div></div>
                        <div class="pct">0%</div>
                    </div>
                `);
                
                let p=0,fillId=card.querySelector('.fill').id,pctEl=card.querySelector('.pct');
                let interval=setInterval(()=>{
                    p+=Math.random()*15;
                    if(p>100)p=100;
                    document.getElementById(fillId).style.width=p+'%';
                    pctEl.textContent=Math.floor(p)+'%';
                    if(p>=100){
                        clearInterval(interval);
                        card.querySelector('.bubble').innerHTML=`
                            ✅ تم صنع <b>${found.name}</b> بنجاح!
                            ${found.v2?`
                            <div class="files-grid">
                                <div class="file-card"><div class="icon">📦</div><div class="name">${found.name} V1</div><a href="${found.v1}" target="_blank">📥 تحميل</a></div>
                                <div class="file-card"><div class="icon">📦</div><div class="name">${found.name} V2</div><a href="${found.v2}" target="_blank">📥 تحميل</a></div>
                            </div>`:`
                            <a href="${found.v1}" target="_blank">📥 تحميل ${found.name}</a>`}
                        `;
                    }
                },200);
            }else{
                addMsg('bot',`🤔 مش فاهم قصدك. جرب تكتب:<br>🎨 صنع اسكنات<br>☠️ صنع هاك<br>⚡ صنع FPS<br>🎯 صنع ايم بوت`);
            }
        }
    </script>
</body>
</html>
