<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☠️ NUMBER PANEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#000a00;--surface:#001400;--green:#00ff00;--yellow:#ffff00;--red:#ff0000;--muted:#006600;--border:#003300;--cyan:#00ffff}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Share Tech Mono',monospace;background:var(--bg);color:var(--green);min-height:100vh;overflow-x:hidden}
        
        .matrix-bg{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:0.03;
            background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,0,0.05) 2px,rgba(0,255,0,0.05) 4px)}
        .scanline{position:fixed;top:0;left:0;width:100%;height:2px;background:rgba(0,255,0,0.08);z-index:1;pointer-events:none;animation:scan 3s linear infinite}
        @keyframes scan{0%{top:-2px}100%{top:100%}}
        
        .container{max-width:600px;margin:0 auto;padding:10px;position:relative;z-index:2}
        
        .header{background:#000;border:2px solid var(--green);padding:15px;text-align:center;margin-bottom:10px;box-shadow:0 0 25px rgba(0,255,0,0.15)}
        .header .skull{font-size:40px;animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{text-shadow:0 0 10px var(--green)}50%{text-shadow:0 0 35px var(--green),0 0 70px var(--green)}}
        .header h1{font-size:18px;text-shadow:0 0 10px var(--green);letter-spacing:3px;margin:5px 0}
        
        .panel{background:#000;border:1px solid var(--border);padding:10px;margin:8px 0}
        .panel .title{color:var(--yellow);font-size:11px;margin-bottom:8px;letter-spacing:2px}
        
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;max-height:200px;overflow-y:auto}
        .grid-3{grid-template-columns:1fr 1fr 1fr}
        .item{padding:8px;border:1px solid var(--border);cursor:pointer;text-align:center;font-size:9px;transition:0.2s}
        .item:hover,.item.active{border-color:var(--green);background:rgba(0,255,0,0.05)}
        .item .flag{font-size:14px}.item .name{color:var(--green);margin:2px 0}.item .count{color:var(--muted);font-size:8px}
        
        .number-display{background:#000;border:2px solid var(--red);padding:15px;text-align:center;margin:8px 0;box-shadow:0 0 30px rgba(255,0,0,0.3);animation:redPulse 2s infinite;cursor:pointer}
        @keyframes redPulse{0%,100%{box-shadow:0 0 30px rgba(255,0,0,0.3)}50%{box-shadow:0 0 60px rgba(255,0,0,0.6)}}
        .number-display .num{font-size:28px;color:var(--red);text-shadow:0 0 15px var(--red);letter-spacing:3px}
        .number-display .info{color:var(--green);font-size:9px;margin-top:5px}
        
        .btn-row{display:flex;gap:5px;margin:6px 0;flex-wrap:wrap}
        .btn{flex:1;min-width:70px;padding:10px 6px;border:2px solid var(--green);background:#000;color:var(--green);font-family:'Share Tech Mono',monospace;font-size:9px;font-weight:700;cursor:pointer;letter-spacing:1px;transition:0.2s}
        .btn:active{background:var(--green);color:#000}
        .btn-red{border-color:var(--red);color:var(--red)}.btn-red:active{background:var(--red);color:#000}
        .btn-yellow{border-color:var(--yellow);color:var(--yellow)}.btn-yellow:active{background:var(--yellow);color:#000}
        
        .live-feed{background:#000;border:1px solid var(--border);padding:8px;max-height:300px;overflow-y:auto;font-size:9px;margin:8px 0}
        .live-feed .line{padding:3px 0;border-bottom:1px solid rgba(0,255,0,0.05);display:flex;justify-content:space-between}
        .live-feed .svc{color:var(--yellow)}.live-feed .num{color:var(--cyan)}.live-feed .otp{color:var(--green)}
        
        .multi-numbers{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:8px 0}
        .mini-card{background:#000;border:1px solid var(--border);padding:8px;text-align:center;cursor:pointer}
        .mini-card:hover{border-color:var(--green)}
        .mini-card .n{color:var(--red);font-size:11px}.mini-card .s{color:var(--green);font-size:8px}
        .mini-card .o{color:var(--yellow);font-size:14px;margin-top:5px}
        
        .toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:999;background:#000;border:1px solid var(--green);color:var(--green);padding:8px 16px;font-size:10px;letter-spacing:2px}
        .spinner{border:2px solid #000;border-top:2px solid var(--green);border-radius:50%;width:20px;height:20px;animation:spin 0.8s linear infinite;margin:10px auto}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <div class="matrix-bg"></div>
    <div class="scanline"></div>
    
    <div class="container">
        <div class="header">
            <div class="skull">☠️</div>
            <h1>NUMBER_PANEL v4.0</h1>
            <div style="color:var(--muted);font-size:9px;">[ REAL NUMBERS + LIVE OTP ]</div>
        </div>
        
        <!-- لوحة التحكم -->
        <div class="panel" id="controlPanel">
            <div class="title">[ CONTROL_PANEL ]</div>
            
            <!-- الدول -->
            <div id="countriesSection">
                <div style="color:var(--muted);font-size:9px;margin-bottom:5px;">🌍 COUNTRIES</div>
                <div class="grid" id="countriesGrid"></div>
            </div>
            
            <!-- الخدمات -->
            <div id="servicesSection" style="display:none;">
                <div style="color:var(--muted);font-size:9px;margin-bottom:5px;">📱 SERVICES</div>
                <div class="grid" id="servicesGrid"></div>
                <button class="btn" style="margin-top:5px;width:100%" onclick="backToCountries()">← رجوع للدول</button>
            </div>
            
            <!-- الرقم -->
            <div id="numberSection" style="display:none;">
                <div class="number-display" id="numberDisplay" onclick="copyNumber()">
                    <div class="num" id="currentNumber">---</div>
                    <div class="info" id="numberInfo"></div>
                    <div style="color:var(--muted);font-size:7px;margin-top:3px;">[ TAP TO COPY ]</div>
                </div>
                <div class="btn-row">
                    <button class="btn" onclick="changeNumber()">[ CHANGE ]</button>
                    <button class="btn btn-yellow" onclick="fetchOTP()">[ GET_OTP ]</button>
                </div>
                <div id="otpResult" style="text-align:center;min-height:30px;"></div>
            </div>
        </div>
        
        <!-- أزرار إضافية -->
        <div class="btn-row">
            <button class="btn btn-red" id="btnLive" onclick="toggleLive()">[ LIVE_FEED ]</button>
            <button class="btn btn-red" onclick="getMultiNumbers()">[ 5x_NUMBERS ]</button>
        </div>
        
        <!-- بث مباشر -->
        <div class="live-feed" id="liveFeed" style="display:none;">
            <div style="color:var(--yellow);text-align:center;margin-bottom:5px;">📡 LIVE OTP FEED</div>
            <div id="liveContent"></div>
            <button class="btn btn-red" style="width:100%;margin-top:5px;" onclick="toggleLive()">[ STOP ]</button>
        </div>
        
        <!-- 5 أرقام -->
        <div class="multi-numbers" id="multiNumbers"></div>
    </div>

    <script>
        const API='https://ai-proxy-omiz.vercel.app/api/allinone';
        let state={country:null,service:null,number:null},liveInterval=null;

        function toast(m){let t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800);}
        function copyNumber(){if(!state.number)return;navigator.clipboard.writeText(state.number);toast('[+] COPIED');}

        async function apiCall(body){
            let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
            return await r.json();
        }

        // ====== تحميل الدول ======
        async function loadCountries(){
            document.getElementById('countriesGrid').innerHTML='<div class="spinner"></div>';
            let d=await apiCall({type:'numbers',action:'countries',service:'WhatsApp'});
            let countries=d.data||[];
            let html='';
            countries.sort((a,b)=>(b.count||0)-(a.count||0));
            countries.forEach(c=>{
                html+=`<div class="item" onclick="selectCountry('${c.name}')">
                    <div class="flag">${c.flag||'🏳️'}</div>
                    <div class="name">${c.name}</div>
                    <div class="count">(${c.count||0})</div>
                </div>`;
            });
            document.getElementById('countriesGrid').innerHTML=html||'لا توجد دول';
        }

        // ====== اختيار الدولة ======
        async function selectCountry(country){
            state.country=country;
            document.getElementById('countriesSection').style.display='none';
            document.getElementById('servicesSection').style.display='block';
            document.getElementById('servicesGrid').innerHTML='<div class="spinner"></div>';
            
            let d=await apiCall({type:'numbers',action:'services'});
            let services=d.data||[];
            let html='';
            services.forEach(s=>{
                html+=`<div class="item" onclick="requestNum('${s.name}')">
                    <div class="name">${s.name}</div>
                    <div class="count">(${s.count||0})</div>
                </div>`;
            });
            document.getElementById('servicesGrid').innerHTML=html||'لا توجد خدمات';
        }

        function backToCountries(){
            document.getElementById('countriesSection').style.display='block';
            document.getElementById('servicesSection').style.display='none';
            document.getElementById('numberSection').style.display='none';
        }

        // ====== طلب رقم ======
        async function requestNum(service){
            state.service=service;
            document.getElementById('servicesSection').style.display='none';
            document.getElementById('numberSection').style.display='block';
            document.getElementById('currentNumber').textContent='REQUESTING...';
            
            let d=await apiCall({type:'numbers',action:'request',service,country:state.country});
            if(d.success){
                state.number=d.number;
                document.getElementById('currentNumber').textContent=d.number;
                document.getElementById('numberInfo').textContent=`${state.country} | ${service}`;
            }else{
                document.getElementById('currentNumber').textContent='FAILED';
            }
        }

        async function changeNumber(){
            if(!state.service||!state.country)return;
            document.getElementById('currentNumber').textContent='CHANGING...';
            let d=await apiCall({type:'numbers',action:'request',service:state.service,country:state.country});
            if(d.success){
                state.number=d.number;
                document.getElementById('currentNumber').textContent=d.number;
            }
        }

        // ====== جلب OTP ======
        async function fetchOTP(){
            if(!state.number)return;
            document.getElementById('otpResult').innerHTML='<div class="spinner"></div>';
            let d=await apiCall({type:'numbers',action:'otp',number:state.number});
            if(d.ok&&d.otp){
                document.getElementById('otpResult').innerHTML=`<div style="color:var(--yellow);font-size:24px;text-shadow:0 0 15px var(--yellow);">${d.otp}</div>`;
                toast('[!] OTP: '+d.otp);
            }else{
                document.getElementById('otpResult').innerHTML=`<div style="color:var(--red);">لا يوجد كود بعد</div>`;
            }
        }

        // ====== بث مباشر ======
        function toggleLive(){
            let feed=document.getElementById('liveFeed');
            if(feed.style.display==='none'){
                feed.style.display='block';
                document.getElementById('btnLive').textContent='[ STOP_LIVE ]';
                startLiveFeed();
            }else{
                feed.style.display='none';
                document.getElementById('btnLive').textContent='[ LIVE_FEED ]';
                clearInterval(liveInterval);
            }
        }

        async function startLiveFeed(){
            let update=async()=>{
                let d=await apiCall({type:'otp_public',count:20});
                if(Array.isArray(d)){
                    let html='';
                    d.slice(0,15).forEach(item=>{
                        if(Array.isArray(item)&&item.length>=3){
                            let msg=item[2]||'',otpM=msg.match(/\d{3,8}/);
                            html+=`<div class="line"><span class="svc">${item[0]||''}</span><span class="num">${item[1]||''}</span><span class="otp">${otpM?otpM[0]:''}</span></div>`;
                        }
                    });
                    document.getElementById('liveContent').innerHTML=html||'لا توجد بيانات';
                }
            };
            update();
            liveInterval=setInterval(update,5000);
        }

        // ====== 5 أرقام ======
        async function getMultiNumbers(){
            document.getElementById('multiNumbers').innerHTML='<div class="spinner"></div>';
            let services=['WhatsApp','Telegram','TikTok','Facebook','Google'];
            let countries=['Egypt','USA','India','Indonesia','Brazil'];
            let html='';
            
            for(let i=0;i<5;i++){
                let svc=services[i],cty=countries[i];
                let d=await apiCall({type:'numbers',action:'request',service:svc,country:cty});
                if(d.success){
                    html+=`<div class="mini-card" onclick="copyText('${d.number}')">
                        <div class="n">${d.number}</div>
                        <div class="s">${svc} | ${cty}</div>
                        <div class="o" id="otp_${i}">---</div>
                    </div>`;
                    // جلب OTP لكل رقم
                    fetchOTPForCard(d.number,i);
                }
            }
            document.getElementById('multiNumbers').innerHTML=html||'فشل';
        }

        async function fetchOTPForCard(number,index){
            let d=await apiCall({type:'numbers',action:'otp',number});
            if(d.ok&&d.otp){
                let el=document.getElementById('otp_'+index);
                if(el)el.textContent=d.otp;
            }
        }

        function copyText(t){navigator.clipboard.writeText(t);toast('[+] '+t);}

        // بداية
        loadCountries();
        
        // تحديث OTP كل 30 ثانية لو فيه رقم
        setInterval(()=>{if(state.number)fetchOTP();},30000);
    </script>
</body>
</html>
