<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Panel - Live OTP</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #00ff00; font-family: 'Courier New', monospace; min-height: 100vh; }
        .matrix-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: 0.08; background: repeating-linear-gradient(0deg, transparent, transparent 2px, #00ff00 2px, #00ff00 4px); animation: scan 8s linear infinite; }
        @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
        .container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; padding: 30px 0; border-bottom: 2px solid #00ff00; margin-bottom: 30px; animation: glow 2s ease-in-out infinite; }
        @keyframes glow { 0%, 100% { text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00; } 50% { text-shadow: 0 0 30px #00ff00, 0 0 50px #00ff00, 0 0 70px #00ff00; } }
        .header h1 { font-size: 2.5em; letter-spacing: 3px; }
        .subtitle { color: #00cc00; font-size: 1em; margin-top: 10px; }
        .panel { background: rgba(0, 20, 0, 0.9); border: 1px solid #00ff00; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 0 20px rgba(0,255,0,0.2); }
        .panel-title { font-size: 1.3em; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px dashed #00ff00; }
        .service-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .service-btn { background: rgba(0,50,0,0.8); border: 1px solid #00ff00; color: #00ff00; padding: 15px; border-radius: 8px; cursor: pointer; font-family: 'Courier New', monospace; transition: all 0.3s; text-align: center; font-size: 14px; }
        .service-btn:hover { background: #00ff00; color: #000; box-shadow: 0 0 30px rgba(0,255,0,0.6); transform: scale(1.05); }
        .service-btn .count { display: block; font-size: 11px; margin-top: 5px; opacity: 0.7; }
        .country-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
        .country-btn { background: rgba(0,30,0,0.8); border: 1px solid #00aa00; color: #00ff00; padding: 12px; border-radius: 8px; cursor: pointer; font-family: 'Courier New', monospace; transition: all 0.3s; text-align: center; font-size: 13px; }
        .country-btn:hover { background: #00aa00; color: #000; box-shadow: 0 0 20px rgba(0,255,0,0.5); }
        .country-btn small { display: block; font-size: 10px; opacity: 0.7; }
        .number-card { background: rgba(0,40,0,0.9); border: 2px solid #00ff00; border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.3s; position: relative; margin-bottom: 10px; }
        .number-card:hover { box-shadow: 0 0 40px rgba(0,255,0,0.8); transform: translateY(-3px); }
        .number-card .number { font-size: 1.8em; letter-spacing: 2px; }
        .number-card small { display: block; margin-top: 5px; opacity: 0.7; }
        .copied { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: #00ff00; color: #000; padding: 5px 15px; border-radius: 5px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .copied.show { opacity: 1; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
        .action-btn { flex: 1; min-width: 130px; padding: 15px; border: 2px solid #00ff00; background: rgba(0,30,0,0.8); color: #00ff00; font-family: 'Courier New', monospace; font-size: 14px; cursor: pointer; border-radius: 8px; transition: all 0.3s; font-weight: bold; }
        .action-btn:hover { background: #00ff00; color: #000; box-shadow: 0 0 30px rgba(0,255,0,0.6); }
        .action-btn.active { background: #00ff00; color: #000; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { box-shadow: 0 0 20px rgba(0,255,0,0.4); } 50% { box-shadow: 0 0 50px rgba(0,255,0,0.8); } }
        .otp-list { max-height: 500px; overflow-y: auto; }
        .otp-item { background: rgba(0,20,0,0.8); border: 1px solid #005500; padding: 15px; margin-bottom: 10px; border-radius: 8px; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        .otp-service { color: #ff6600; font-weight: bold; font-size: 15px; }
        .otp-number { color: #00ccff; font-size: 16px; margin: 5px 0; }
        .otp-code { color: #ff00ff; font-size: 16px; font-weight: bold; word-break: break-all; }
        .otp-time { color: #888; font-size: 12px; margin-top: 5px; }
        .loading { text-align: center; padding: 30px; animation: blink 1s infinite; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        .back-btn { background: transparent; border: 1px solid #ff6600; color: #ff6600; padding: 8px 20px; cursor: pointer; font-family: 'Courier New', monospace; border-radius: 5px; margin-bottom: 15px; transition: all 0.3s; }
        .back-btn:hover { background: #ff6600; color: #000; }
        .status-dot { display: inline-block; width: 10px; height: 10px; background: #00ff00; border-radius: 50%; animation: blink 1s infinite; margin-left: 10px; }
        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: #000; } ::-webkit-scrollbar-thumb { background: #00ff00; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="matrix-bg"></div>
    <div class="container">
        <div class="header"><h1>NUMBER PANEL</h1><div class="subtitle">Live OTP System <span class="status-dot"></span> ONLINE</div></div>
        <div id="mainSection">
            <div class="panel" id="servicesPanel"><div class="panel-title">Available Services</div><div class="service-grid" id="servicesGrid"><div class="loading">Loading...</div></div></div>
            <div class="panel" id="countriesPanel" style="display:none;"><button class="back-btn" onclick="backToServices()">Back to Services</button><div class="panel-title">Available Countries - <span id="selectedService"></span></div><div class="country-grid" id="countriesGrid"></div></div>
            <div class="panel" id="numbersPanel" style="display:none;"><button class="back-btn" onclick="backToCountries()">Back to Countries</button><div class="panel-title">Available Numbers</div><div id="numbersGrid"></div></div>
            <div class="actions" id="actionsPanel" style="display:none;">
                <button class="action-btn" onclick="getMessages()">Get Messages</button>
                <button class="action-btn" onclick="changeNumber()">Change Number</button>
                <button class="action-btn" id="liveBtn" onclick="toggleLive()">LIVE All Messages</button>
            </div>
        </div>
        <div class="panel" id="messagesPanel" style="display:none;"><button class="back-btn" onclick="backToMain()">Back</button><div class="panel-title">All Messages LIVE <span id="msgCount"></span></div><div class="otp-list" id="otpList"></div></div>
    </div>
    <script>
        const PROXY = window.location.origin + '/api/numberpanel';
        let currentService = '', currentCountry = '', liveInterval = null, isLive = false;
        
        async function fetchAPI(endpoint, params = '') {
            const url = `${PROXY}?endpoint=${endpoint}${params ? '&params=' + params : ''}`;
            const res = await fetch(url);
            return await res.json();
        }
        
        window.onload = () => loadServices();
        
        async function loadServices() {
            try {
                const data = await fetchAPI('/api/services');
                if(data.success) {
                    document.getElementById('servicesGrid').innerHTML = data.services.map(s => 
                        `<div class="service-btn" onclick="selectService('${s.key}','${s.name}')">${s.name}<span class="count">${s.count} available</span></div>`
                    ).join('');
                }
            } catch(e) { document.getElementById('servicesGrid').innerHTML = '<div class="loading">Error loading</div>'; }
        }
        
        async function selectService(key, name) {
            currentService = key;
            document.getElementById('servicesPanel').style.display = 'none';
            document.getElementById('countriesPanel').style.display = 'block';
            document.getElementById('numbersPanel').style.display = 'none';
            document.getElementById('actionsPanel').style.display = 'none';
            document.getElementById('selectedService').textContent = name;
            try {
                const data = await fetchAPI('/api/countries', `service=${key}`);
                if(data.success) {
                    document.getElementById('countriesGrid').innerHTML = data.countries.map(c => 
                        `<div class="country-btn" onclick="selectCountry('${c.name}','${c.flag}')">${c.flag} ${c.name}<small>${c.count} numbers</small></div>`
                    ).join('');
                }
            } catch(e) { document.getElementById('countriesGrid').innerHTML = '<div class="loading">Error loading</div>'; }
        }
        
        function selectCountry(country, flag) {
            currentCountry = country;
            document.getElementById('countriesPanel').style.display = 'none';
            document.getElementById('numbersPanel').style.display = 'block';
            document.getElementById('actionsPanel').style.display = 'flex';
            loadNumbers();
        }
        
        async function loadNumbers() {
            try {
                const data = await fetchAPI('/api/otp', 'count=20');
                const filtered = data.filter(item => 
                    item[0].toLowerCase().includes(currentService.toLowerCase()) || 
                    currentService.toLowerCase().includes(item[0].toLowerCase())
                );
                const numbers = [...new Set(filtered.map(item => item[1]))];
                document.getElementById('numbersGrid').innerHTML = numbers.length > 0 ? 
                    numbers.slice(0, 5).map(num => 
                        `<div class="number-card" onclick="copyNumber('${num}',this)"><div class="number">${num}</div><small>${currentCountry} - Click to copy</small><div class="copied">Copied!</div></div>`
                    ).join('') : '<div class="loading">No numbers available</div>';
            } catch(e) { document.getElementById('numbersGrid').innerHTML = '<div class="loading">Error</div>'; }
        }
        
        function copyNumber(number, el) {
            navigator.clipboard.writeText(number);
            const copiedEl = el.querySelector('.copied');
            copiedEl.classList.add('show');
            setTimeout(() => copiedEl.classList.remove('show'), 1500);
        }
        
        async function getMessages() {
            stopLive();
            document.getElementById('mainSection').style.display = 'none';
            document.getElementById('messagesPanel').style.display = 'block';
            await loadMessages();
        }
        
        async function loadMessages() {
            try {
                const data = await fetchAPI('/api/otp', 'count=50');
                displayMessages(data);
            } catch(e) { document.getElementById('otpList').innerHTML = '<div class="loading">Error</div>'; }
        }
        
        function displayMessages(data) {
            document.getElementById('otpList').innerHTML = data.map(item => 
                `<div class="otp-item"><div class="otp-service">${item[0]}</div><div class="otp-number">${item[1]} | ${item[4]}</div><div class="otp-code">${item[2]}</div><div class="otp-time">${item[3]}</div></div>`
            ).join('');
            document.getElementById('msgCount').textContent = `(${data.length} messages)`;
        }
        
        function toggleLive() {
            isLive ? stopLive() : startLive();
        }
        
        function startLive() {
            isLive = true;
            document.getElementById('liveBtn').classList.add('active');
            document.getElementById('liveBtn').textContent = 'LIVE Active...';
            document.getElementById('mainSection').style.display = 'none';
            document.getElementById('messagesPanel').style.display = 'block';
            loadMessages();
            liveInterval = setInterval(loadMessages, 5000);
        }
        
        function stopLive() {
            isLive = false;
            document.getElementById('liveBtn').classList.remove('active');
            document.getElementById('liveBtn').textContent = 'LIVE All Messages';
            if(liveInterval) { clearInterval(liveInterval); liveInterval = null; }
        }
        
        function changeNumber() { loadNumbers(); }
        
        function backToServices() {
            document.getElementById('countriesPanel').style.display = 'none';
            document.getElementById('numbersPanel').style.display = 'none';
            document.getElementById('actionsPanel').style.display = 'none';
            document.getElementById('servicesPanel').style.display = 'block';
        }
        
        function backToCountries() {
            document.getElementById('numbersPanel').style.display = 'none';
            document.getElementById('actionsPanel').style.display = 'none';
            document.getElementById('countriesPanel').style.display = 'block';
        }
        
        function backToMain() {
            stopLive();
            document.getElementById('messagesPanel').style.display = 'none';
            document.getElementById('mainSection').style.display = 'block';
            document.getElementById('servicesPanel').style.display = 'block';
            document.getElementById('countriesPanel').style.display = 'none';
            document.getElementById('numbersPanel').style.display = 'none';
            document.getElementById('actionsPanel').style.display = 'none';
        }
    </script>
</body>
</html>
