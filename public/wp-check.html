<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📸 كشف واتساب</title>
<style>
:root{--c1:#00ff41;--c4:#ffaa00;--c5:#ff0040;--bg:#020202}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:#fff;min-height:100vh;padding:15px}
.container{max-width:550px;margin:0 auto;text-align:center}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes spin{to{transform:rotate(360deg)}}
.skull{font-size:60px;animation:pulse 0.3s infinite}
h1{font-size:22px;color:var(--c1);text-shadow:0 0 15px var(--c1);margin:10px 0}
.sub{color:#006600;font-size:12px;letter-spacing:6px;margin-bottom:20px}
.card{background:rgba(0,0,0,0.8);border:2px solid var(--c1);border-radius:12px;padding:16px;margin-bottom:12px}
.card h2{color:var(--c1);font-size:15px;margin-bottom:10px}
.input-group input{width:100%;padding:14px;background:#000;border:2px solid #333;border-radius:8px;color:var(--c1);font-size:15px;text-align:center;font-family:'Courier New',monospace;outline:none;letter-spacing:3px}
.input-group input:focus{border-color:var(--c1)}
.btn{width:100%;padding:14px;border-radius:10px;border:none;font-size:16px;font-weight:900;cursor:pointer;letter-spacing:3px;margin-top:6px}
.btn-green{background:#000;color:var(--c1);border:2px solid var(--c1)}
.btn-green:active{background:var(--c1);color:#000}
.result-box{display:none;text-align:right}
.profile-img{width:120px;height:120px;border-radius:50%;border:3px solid var(--c1);object-fit:cover;margin:10px auto;display:block}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1a1a1a;font-size:12px}
.info-label{color:var(--c4)}.info-value{color:#ccc}
.spinner{width:40px;height:40px;border:4px solid #333;border-top:4px solid var(--c1);border-radius:50%;animation:spin 0.8s linear infinite;margin:20px auto;display:none}
.error{color:var(--c5);font-size:13px;display:none;text-align:center}
</style>
</head>
<body>
<div class="container">
<div class="skull">📸</div><h1>كشف بيانات واتساب</h1><p class="sub">━━ ☠ PROFILE FINDER ☠ ━━</p>
<div class="card"><h2>📱 ادخل رقم الهاتف</h2><div class="input-group"><input type="tel" id="phoneInput" placeholder="+201xxxxxxxxx" value="+20"></div><button class="btn btn-green" onclick="searchProfile()">🔍 بحث</button></div>
<div class="spinner" id="spinner"></div><p class="error" id="error"></p>
<div class="result-box" id="resultBox"><div class="card"><h2>📸 صورة الملف الشخصي</h2><img id="profileImg" class="profile-img" src=""></div><div class="card"><h2>📊 المعلومات</h2><div id="infoContainer"></div></div></div>
</div>
<script>
async function searchProfile(){
var p=document.getElementById('phoneInput').value.trim().replace(/\s+/g,'').replace('+','');
if(!p||p.length<8){alert('اكتب رقم صحيح');return;}
if(!p.startsWith('2'))p='2'+p;if(!p.startsWith('20'))p='20'+p;
document.getElementById('spinner').style.display='block';document.getElementById('error').style.display='none';document.getElementById('resultBox').style.display='none';
try{
var r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent('https://whatsapp-db-checkleaked.p.rapidapi.com/check?phone='+p),{headers:{'x-rapidapi-host':'whatsapp-db-checkleaked.p.rapidapi.com','x-rapidapi-key':'1d71db2bfcmsh2a03b1a58f00b6dp1300b9jsn297bac987973'}});
if(r.ok){var d=await r.json();
if(d.profilePic){document.getElementById('profileImg').src=d.profilePic;var bp=d.businessProfile||{},fa=d.faceAnalysis||{},pp=fa.people?fa.people[0]:{};var h='';
if(bp.displayName)h+='<div class="info-row"><span class="info-label">👤 الاسم</span><span class="info-value">'+bp.displayName+'</span></div>';
if(d.phone)h+='<div class="info-row"><span class="info-label">📱 الرقم</span><span class="info-value">'+d.phone+'</span></div>';
if(bp.description)h+='<div class="info-row"><span class="info-label">📝 النبذة</span><span class="info-value">'+bp.description+'</span></div>';
if(bp.address)h+='<div class="info-row"><span class="info-label">📍 العنوان</span><span class="info-value">'+bp.address+'</span></div>';
if(pp.age)h+='<div class="info-row"><span class="info-label">🎂 العمر</span><span class="info-value">'+pp.age+' سنة</span></div>';
if(pp.gender)h+='<div class="info-row"><span class="info-label">👨 النوع</span><span class="info-value">'+(pp.gender==='male'?'ذكر':'أنثى')+'</span></div>';
document.getElementById('infoContainer').innerHTML=h;document.getElementById('resultBox').style.display='block';}
else{showError('❌ الرقم مش بيزنس');}}
else{showError('❌ خطأ: '+r.status);}
}catch(e){showError('❌ فشل الاتصال');}
document.getElementById('spinner').style.display='none';}
function showError(m){document.getElementById('error').textContent=m;document.getElementById('error').style.display='block';}
</script>
</body>
</html>
