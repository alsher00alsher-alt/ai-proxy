<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة التحميل الاحترافية</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background-color: #121212; color: white; }
        input { padding: 15px; width: 80%; border-radius: 10px; border: none; margin-bottom: 20px; }
        button { padding: 15px 30px; border-radius: 10px; border: none; background: #0070f3; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <h1>مُحمل الملفات السريع</h1>
    <input type="text" id="url" placeholder="ضع رابط الفيديو أو الأغنية هنا...">
    <br>
    <button onclick="download()">تحميل الملف</button>
    <script>
        function download() {
            var url = document.getElementById('url').value;
            if(url) {
                window.open('https://loader.to/api/button/?url=' + encodeURIComponent(url), '_blank');
            } else {
                alert('الرجاء وضع الرابط أولاً');
            }
        }
    </script>
</body>
</html>
