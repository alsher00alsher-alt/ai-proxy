<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>📱 AHMED ALSHAER PANEL</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:sans-serif;background:#0a0a0a;color:#fff;padding:15px}
        h1{color:#25D366;text-align:center;margin:20px 0;font-size:26px}
        .stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:15px 0}
        .stat{background:#111;padding:15px 20px;border-radius:10px;text-align:center;border:1px solid #222}
        .stat b{color:#25D366;display:block;font-size:24px;margin-bottom:5px}
        .stat span{font-size:12px;color:#888}
        .tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:15px 0}
        .tab{padding:12px 20px;background:#1a1a1a;border:1px solid #333;border-radius:8px;cursor:pointer;font-size:14px;transition:0.2s}
        .tab:hover{background:#222}.tab.active{background:#25D366;color:#000;font-weight:bold}
        .content{max-width:800px;margin:0 auto}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
        .file{background:#111;border:1px solid #222;border-radius:8px;padding:10px;text-align:center;cursor:pointer;transition:0.2s}
        .file:hover{border-color:#25D366;transform:scale(1.05)}
        .file img{width:100%;height:100px;object-fit:cover;border-radius:5px}
        .file .icon{font-size:40px}
        .file p{font-size:10px;margin-top:5px;word-break:break-all;color:#ccc}
        .apps{list-style:none;padding:0}
        .apps li{padding:12px;background:#111;margin:5px 0;border-radius:8px;border:1px solid #222;font-size:14px}
        .screen-box{text-align:center;margin:20px 0}
        .screen-box img{max-width:100%;border-radius:10px;border:2px solid #25D366}
        button{background:#25D366;color:#000;padding:15px 30px;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;margin:10px}
        button:hover{background:#1ebe57}
        .loading{text-align:center;color:#888;padding:30px}
    </style>
</head>
<body>
    <h1>📱 AHMED ALSHAER PANEL</h1>
    
    <div class="stats">
        <div class="stat"><b>Infinix GT 50 Pro</b><span>📱 الجهاز</span></div>
        <div class="stat"><b id="fileCount">0</b><span>📁 ملف</span></div>
        <div class="stat"><b>4.8GB</b><span>💾 المساحة</span></div>
        <div class="stat"><b id="appCount">0</b><span>📱 تطبيق</span></div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="showTab('photos')">📸 صور</div>
        <div class="tab" onclick="showTab('videos')">🎥 فيديوهات</div>
        <div class="tab" onclick="showTab('apps')">📱 تطبيقات</div>
        <div class="tab" onclick="showTab('screen')">🖥️ الشاشة</div>
    </div>

    <div class="content" id="content">
        <div class="loading">⏳ جاري التحميل...</div>
    </div>

    <script>
        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            const content = document.getElementById('content');
            
            if (tab === 'photos') {
                content.innerHTML = '<div class="loading">⏳ جاري تحميل الصور...</div>';
                fetch('/api/photos')
                    .then(r => r.json())
                    .then(data => {
                        content.innerHTML = '<div class="grid">' + data.files.map(f => `
                            <div class="file" onclick="window.open('${f.url}')">
                                <img src="${f.url}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
                                <div class="icon" style="display:none">📸</div>
                                <p>${f.name}</p>
                                <p style="color:#25D366">${f.size}</p>
                            </div>
                        `).join('') + '</div>';
                        document.getElementById('fileCount').textContent = data.files.length;
                    });
            } else if (tab === 'videos') {
                content.innerHTML = '<div class="loading">⏳ جاري تحميل الفيديوهات...</div>';
                fetch('/api/videos')
                    .then(r => r.json())
                    .then(data => {
                        content.innerHTML = '<div class="grid">' + data.files.map(f => `
                            <div class="file" onclick="window.open('${f.url}')">
                                <div class="icon">🎥</div>
                                <p>${f.name}</p>
                                <p style="color:#25D366">${f.size}</p>
                            </div>
                        `).join('') + '</div>';
                    });
            } else if (tab === 'apps') {
                content.innerHTML = '<div class="loading">⏳ جاري تحميل التطبيقات...</div>';
                fetch('/api/apps')
                    .then(r => r.json())
                    .then(data => {
                        content.innerHTML = '<ul class="apps">' + data.apps.map(a => `<li>📱 ${a}</li>`).join('') + '</ul>';
                        document.getElementById('appCount').textContent = data.apps.length;
                    });
            } else if (tab === 'screen') {
                content.innerHTML = '<div class="screen-box"><img id="screenImg" src="/api/screenshot" onerror="this.src=\'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22400%22%3E%3Crect fill=%22%23111%22 width=%22200%22 height=%22400%22/%3E%3Ctext fill=%22%23fff%22 x=%2250%22 y=%22200%22%3EScreen%3C/text%3E%3C/svg%3E\'"><br><button onclick="refreshScreen()">🔄 تحديث</button></div>';
            }
        }

        function refreshScreen() {
            const img = document.getElementById('screenImg');
            img.src = '/api/screenshot?t=' + Date.now();
        }

        // تحميل الصور افتراضياً
        showTab('photos');
    </script>
</body>
</html>
