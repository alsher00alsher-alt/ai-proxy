<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>📱 AHMED ALSHAER PANEL</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;padding:15px}
        h1{color:#25D366;text-align:center;margin:20px 0;font-size:24px}
        .tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:15px 0}
        .tab{padding:12px 18px;background:#1a1a1a;border:2px solid #333;border-radius:10px;cursor:pointer;font-size:14px;font-weight:bold;transition:0.2s;color:#fff}
        .tab:hover{background:#222}.tab.active{background:#25D366;color:#000;border-color:#25D366}
        .content{max-width:800px;margin:0 auto}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
        .item{background:#111;border:1px solid #222;border-radius:10px;padding:10px;text-align:center;cursor:pointer;transition:0.2s}
        .item:hover{border-color:#25D366;transform:scale(1.05)}
        .item img{width:100%;height:100px;object-fit:cover;border-radius:8px}
        .item .icon{font-size:45px;margin:10px 0}
        .item .name{font-size:11px;word-break:break-all;color:#ccc;margin-top:5px}
        .item .size{font-size:10px;color:#25D366}
        .contacts-list{list-style:none;padding:0}
        .contacts-list li{padding:15px;background:#111;margin:8px 0;border-radius:10px;border:1px solid #222;display:flex;align-items:center;gap:10px;cursor:pointer}
        .contacts-list li:hover{border-color:#25D366}
        .avatar{width:40px;height:40px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#000}
        .info-box{background:#111;border:2px solid #25D366;border-radius:15px;padding:25px;text-align:center}
        .info-box p{margin:10px 0;font-size:16px}
        .info-box b{color:#25D366}
        .msgs{list-style:none;padding:0}
        .msgs li{padding:12px;background:#111;margin:8px 0;border-radius:10px;border:1px solid #222}
        .msg-from{color:#25D366;font-weight:bold;font-size:13px}
        .msg-text{font-size:14px;margin-top:5px}
        .loading{text-align:center;color:#888;padding:40px;font-size:16px}
        .empty{text-align:center;color:#888;padding:30px}
        .screen-box{text-align:center}
        .screen-box img{max-width:100%;border-radius:15px;border:3px solid #25D366}
        button{background:#25D366;color:#000;padding:10px 25px;border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;margin:10px}
    </style>
</head>
<body>
    <h1>📱 AHMED ALSHAER PANEL</h1>
    
    <div class="tabs">
        <div class="tab active" onclick="showTab('contacts',this)">👥 جهات الاتصال</div>
        <div class="tab" onclick="showTab('messages',this)">💬 الرسائل</div>
        <div class="tab" onclick="showTab('photos',this)">📸 الصور</div>
        <div class="tab" onclick="showTab('videos',this)">🎥 الفيديوهات</div>
        <div class="tab" onclick="showTab('files',this)">📁 الملفات</div>
        <div class="tab" onclick="showTab('info',this)">📊 معلومات الجهاز</div>
    </div>
    
    <div class="content" id="content">
        <div class="loading">⏳ جاري التحميل...</div>
    </div>

    <script>
        function showTab(tab, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            const c = document.getElementById('content');
            c.innerHTML = '<div class="loading">⏳ جاري التحميل...</div>';
            
            if (tab === 'contacts') {
                fetch('/api/contacts').then(r=>r.json()).then(d=>{
                    c.innerHTML = d.contacts && d.contacts.length ? 
                        '<ul class="contacts-list">' + d.contacts.map(ct => `
                            <li><div class="avatar">${ct.name[0]}</div><div><b>${ct.name}</b><br><span style="color:#888;font-size:12px">${ct.phone}</span></div></li>
                        `).join('') + '</ul>' : '<div class="empty">لا توجد جهات اتصال</div>';
                });
            }
            else if (tab === 'messages') {
                fetch('/api/messages').then(r=>r.json()).then(d=>{
                    c.innerHTML = d.messages && d.messages.length ? 
                        '<ul class="msgs">' + d.messages.map(m => `
                            <li><div class="msg-from">${m.from}</div><div class="msg-text">${m.text}</div></li>
                        `).join('') + '</ul>' : '<div class="empty">لا توجد رسائل</div>';
                });
            }
            else if (tab === 'photos') {
                fetch('/api/photos').then(r=>r.json()).then(d=>{
                    c.innerHTML = d.files && d.files.length ? 
                        '<div class="grid">' + d.files.map(f => `
                            <div class="item" onclick="window.open('${f.url}')">
                                <img src="${f.url}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
                                <div class="icon" style="display:none">📸</div>
                                <div class="name">${f.name}</div>
                                <div class="size">${f.size}</div>
                            </div>
                        `).join('') + '</div>' : '<div class="empty">لا توجد صور</div>';
                });
            }
            else if (tab === 'videos') {
                fetch('/api/videos').then(r=>r.json()).then(d=>{
                    c.innerHTML = d.files && d.files.length ? 
                        '<div class="grid">' + d.files.map(f => `
                            <div class="item"><div class="icon">🎥</div><div class="name">${f.name}</div><div class="size">${f.size}</div></div>
                        `).join('') + '</div>' : '<div class="empty">لا توجد فيديوهات</div>';
                });
            }
            else if (tab === 'files') {
                c.innerHTML = '<div class="info-box"><p>📁 <b>كل الملفات</b></p><p>DCIM، Download، Documents</p><p style="color:#888">جاري التحميل...</p></div>';
            }
            else if (tab === 'info') {
                c.innerHTML = '<div class="info-box">' +
                    '<p>📱 <b>Infinix GT 50 Pro</b></p>' +
                    '<p>🤖 Android 14</p>' +
                    '<p>💾 RAM: 12GB</p>' +
                    '<p>📦 تخزين: 512GB</p>' +
                    '<p>🔋 البطارية: 85%</p>' +
                    '<p>📶 الشاشة: 144Hz</p>' +
                '</div>';
            }
        }
        
        // بدء بالصور
        showTab('photos', document.querySelector('.tab'));
    </script>
</body>
</html>
