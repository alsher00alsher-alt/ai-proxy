<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>📱 الأجهزة المتصلة</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;padding:20px}
        h1{color:#25D366;text-align:center;margin:20px 0;font-size:28px}
        .devices{max-width:500px;margin:0 auto}
        .device{background:#111;border:2px solid #25D366;border-radius:15px;padding:20px;margin:15px 0;cursor:pointer;transition:0.3s;display:flex;align-items:center;gap:15px}
        .device:hover{transform:scale(1.02);box-shadow:0 0 20px rgba(37,211,102,0.4)}
        .icon{font-size:40px}
        .info{flex:1}
        .name{font-size:18px;font-weight:bold;color:#25D366}
        .details{font-size:12px;color:#888;margin-top:5px}
        .status{display:inline-block;width:10px;height:10px;background:#0f0;border-radius:50%;margin-left:5px;animation:pulse 2s infinite}
        @keyframes pulse{50%{opacity:0.3}}
        .empty{text-align:center;color:#888;padding:50px;font-size:18px}
        .refresh{display:block;margin:20px auto;background:#25D366;color:#000;padding:12px 30px;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
    </style>
</head>
<body>
    <h1>📱 الأجهزة المتصلة</h1>
    <div class="devices" id="devices">
        <div class="empty">⏳ جاري البحث عن أجهزة...</div>
    </div>
    <button class="refresh" onclick="loadDevices()">🔄 تحديث</button>

    <script>
        function loadDevices() {
            document.getElementById('devices').innerHTML = '<div class="empty">⏳ جاري البحث...</div>';
            
            fetch('/api/devices')
                .then(r => r.json())
                .then(data => {
                    if (data.devices.length === 0) {
                        document.getElementById('devices').innerHTML = '<div class="empty">❌ لا توجد أجهزة متصلة حالياً</div>';
                    } else {
                        document.getElementById('devices').innerHTML = data.devices.map(d => `
                            <div class="device" onclick="openDevice('${d.name}')">
                                <div class="icon">📱</div>
                                <div class="info">
                                    <div class="name">${d.name} <span class="status"></span></div>
                                    <div class="details">📱 ${d.phone}</div>
                                    <div class="details">🟢 Online - آخر ظهور: الآن</div>
                                </div>
                            </div>
                        `).join('');
                    }
                });
        }

        function openDevice(name) {
            alert('📱 ' + name + '\n\nجاري فتح لوحة التحكم...');
        }

        // تحميل أول مرة
        loadDevices();
        // تحديث كل 5 ثواني
        setInterval(loadDevices, 5000);
    </script>
</body>
</html>
