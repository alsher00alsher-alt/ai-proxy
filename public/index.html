<style>
body{font-family:'Cairo',sans-serif;background:radial-gradient(circle at 50% 120%,#1a233a 0%,#000 60%);color:#e3e3e3;overflow:hidden}
.gemini-star{fill:url(#gemini-gradient);animation:pulse 4s infinite ease-in-out}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.05);opacity:.8}}
.floating-input{background:rgba(30,31,32,.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);border-radius:9999px}
.sidebar{background:#131314;transition:transform .3s;border-left:1px solid #282a2c}
.dots{display:inline-flex;gap:4px}.dots span{width:6px;height:6px;background:#a8c7fa;border-radius:50%;animation:b 1.4s infinite}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.login-screen{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 120%,#1a233a 0%,#000 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;overflow-y:auto;padding:20px}
.login-card{background:rgba(30,31,32,.9);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:30px;text-align:center;max-width:400px;width:90%}
.code-block{background:#000;color:#34d399;padding:12px;border-radius:8px;font-family:monospace;direction:ltr;text-align:left;margin-top:8px;white-space:pre-wrap;position:relative}
.copy-btn{position:absolute;top:5px;right:5px;background:#333;color:#fff;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:11px}
.account-item{display:flex;align-items:center;gap:10px;padding:12px;background:#282a2c;border-radius:12px;cursor:pointer;margin:8px 0;transition:.2s}
.account-item:hover{background:#333537}
.account-item img{width:40px;height:40px;border-radius:50%}
.account-item .email{font-size:12px;color:#888}
</style>
</head>

<!-- فاصل -->

<!-- زر إضافة حساب جديد -->
<button id="google-btn" class="flex items-center gap-3 bg-white text-black px-6 py-3 rounded-full font-medium mx-auto hover:bg-gray-200 transition" onclick="addNewAccount()">
<svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"></path><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"></path><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"></path><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"></path></svg>
إضافة حساب جديد

<!-- التطبيق -->

<div>

<div id="chat-list" class="space-y-1 max-h-[40vh] overflow-y-auto"></div>
</div>

<header class="flex items-center justify-between px-4 py-3 shrink-0 absolute top-0 w-full z-10">

<div class="flex items-center gap-1 px-3 py-1.5 rounded-full"><select id="model-select" onchange="changeModel()" class="bg-transparent text-white font-semibold text-sm outline-none appearance-none cursor-pointer text-center"></select><span class="material-symbols-outlined">keyboard_arrow_down</span></div>

<main class="flex-1 overflow-y-auto px-4 pt-20 pb-28 flex flex-col items-center">

<div id="msgs" class="space-y-6 w-full hidden pb-8"></div>
</div>
</main>
<footer class="fixed bottom-0 w-full p-4 z-20 pointer-events-none">
<div class="max-w-[850px] mx-auto pointer-events-auto relative">
<input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleFile(event)">
<div id="img-preview-bar" class="hidden absolute -top-20 right-4 p-1 bg-[#1e1f20] rounded-xl border border-gray-700"><img id="img-preview" src="" class="h-16 rounded-lg object-cover"><button onclick="removeImage()" class="absolute -top-2 -left-2 bg-gray-800 text-white rounded-full w-6 h-6 text-xs">✕</button></div>
<div class="floating-input px-2 py-2 flex items-center gap-2"><button onclick="document.getElementById('file-input').click()" class="p-2.5 text-gray-400 rounded-full"><span class="material-symbols-outlined">add</span></button><textarea id="user-input" rows="1" placeholder="اسأل NEXUS" class="flex-1 bg-transparent border-none outline-none resize-none px-2 text-gray-100 max-h-32"></textarea><button onclick="sendMessage()" class="p-2.5 text-blue-300 rounded-full"><span class="material-symbols-outlined">send</span></button></div>
</div>
</footer>
</div>

<script>
// Firebase
firebase.initializeApp({
    apiKey:"AIzaSyA5LuJwdTckc6V2zClBeRiozM_tdMx5fAQ",
    authDomain:"otp-5acda.firebaseapp.com",
    projectId:"otp-5acda"
});
const auth=firebase.auth();

let currentUser=null;
let userChats={};

// عرض الحسابات المحفوظة
function renderSavedAccounts() {
    const saved = JSON.parse(localStorage.getItem('saved_accounts') || '[]');
    const container = document.getElementById('saved-accounts');
    
    if (saved.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-sm text-center">لا توجد حسابات محفوظة</p>';
    } else {
        container.innerHTML = saved.map(acc => `
            <div class="account-item" onclick="switchAccount('${acc.email}')">
                <img src="${acc.photo}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22%3E%3Ccircle fill=%22%234285f4%22 cx=%2220%22 cy=%2220%22 r=%2220%22/%3E%3Ctext fill=%22%23fff%22 x=%2220%22 y=%2226%22 text-anchor=%22middle%22%3E${acc.name[0]}%3C/text%3E%3C/svg%3E'">
                <div>
                    <div style="font-size:14px">${acc.name}</div>
                    <div class="email">${acc.email}</div>
                </div>
            </div>
        `).join('');
    }
}

function addNewAccount() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).then(result => {
        const user = result.user;
        const saved = JSON.parse(localStorage.getItem('saved_accounts') || '[]');
        if (!saved.find(a => a.email === user.email)) {
            saved.push({name: user.displayName, email: user.email, photo: user.photoURL});
            localStorage.setItem('saved_accounts', JSON.stringify(saved));
        }
    });
}

function switchAccount(email) {
    // تسجيل خروج وإعادة دخول بالحساب المحدد
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({login_hint: email});
    auth.signInWithPopup(provider);
}

renderSavedAccounts();

// حالة المستخدم
auth.onAuthStateChanged(function(user){
    if(user){
        currentUser=user;
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        document.getElementById('user-avatar').src=user.photoURL;
        document.getElementById('user-avatar').classList.remove('hidden');
        document.getElementById('user-info').innerHTML='<img src="'+user.photoURL+'" class="w-10 h-10 rounded-full"><div><div class="font-semibold text-sm">'+user.displayName+'</div><div class="text-xs text-gray-400">'+user.email+'</div></div>';
        loadUserChats();
    }else{
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('app').classList.add('hidden');
        renderSavedAccounts();
    }
});

function loadUserChats(){
    userChats=JSON.parse(localStorage.getItem('chats_'+currentUser.uid)||'{}');
    renderChatList();
    if(Object.keys(userChats).length>0){
        currentChatId=Object.keys(userChats)[0];
        history=userChats[currentChatId]||[];
    }
    renderHistory();
}

function saveUserChats(){localStorage.setItem('chats_'+currentUser.uid,JSON.stringify(userChats));}
function logout(){auth.signOut();}

// النماذج
const NEXII_KEY='sk-e0683fb0c7af3fc6-dcdb07-72c65552';
const NEXII_BASE='https://ai.nexii.cloud/v1';
const AGNES='sk-eV8aSN0NWxNYGnTdvws5nIGAcMWvUk0G2i0u5MdGIdyl2H1Q';
const MODELS=[
{id:'cf/@cf/deepseek-ai/deepseek-r1-distill-qwen-32b',label:'DeepSeek R1',p:'nexii'},
{id:'cf/@cf/zai-org/glm-5.2',label:'GLM 5.2',p:'nexii'},
{id:'cf/@cf/deepseek-ai/deepseek-v4-flash-0731',label:'DeepSeek V4',p:'nexii'},
{id:'cf/@cf/qwen/qwq-32b',label:'QwQ 32B',p:'nexii'},
{id:'cf/@cf/meta/llama-4-scout-17b-16e-instruct',label:'Llama 4 Scout',p:'nexii'},
{id:'auto/best-reasoning',label:'Auto Reasoning',p:'nexii'},
{id:'auto/best-coding',label:'Auto Coding',p:'nexii'},
{id:'cf/@cf/meta/llama-3.3-70b-instruct-fp8-fast',label:'Llama 70B',p:'nexii'},
{id:'cf/@cf/mistralai/mistral-small-3.1-24b-instruct',label:'Mistral Small',p:'nexii'},
{id:'cf/@cf/qwen/qwen2.5-coder-32b-instruct',label:'Qwen Coder',p:'nexii'},
{id:'cf/@cf/google/gemma-4-26b-a4b-it',label:'Gemma 4',p:'nexii'},
{id:'auto/best-chat',label:'Auto Chat',p:'nexii'},
{id:'cf/@cf/meta/llama-3.1-8b-instruct-fp8',label:'Llama 8B',p:'nexii'},
{id:'auto/best-fast',label:'Auto Fast',p:'nexii'},
{id:'gemini-3.6-flash',label:'Gemini 3.6',p:'gemini'},
{id:'gemini-flash-latest',label:'Gemini Latest',p:'gemini'}
];
let currentChatId=localStorage.getItem('currentChatId')||'';
let history=[];
let selectedImage=null;
let currentModel=localStorage.getItem('aiModel')||MODELS[0].id;
populateModels();populateModelsSide();
function populateModels(){document.getElementById('model-select').innerHTML=MODELS.map(m=>'<option value="'+m.id+'"'+(m.id===currentModel?' selected':'')+' class="bg-[#1e1f20]">'+m.label+'</option>').join('');}
function populateModelsSide(){document.getElementById('model-select-side').innerHTML=MODELS.map(m=>'<option value="'+m.id+'"'+(m.id===currentModel?' selected':'')+' class="bg-[#1e1f20]">'+m.label+'</option>').join('');}
function changeModelSide(){currentModel=document.getElementById('model-select-side').value;localStorage.setItem('aiModel',currentModel);populateModels();}
function openSidebar(){document.getElementById('sidebar').classList.remove('translate-x-full');document.getElementById('overlay').classList.remove('hidden');}
function closeSidebar(){document.getElementById('sidebar').classList.add('translate-x-full');document.getElementById('overlay').classList.add('hidden');}
function changeModel(){currentModel=document.getElementById('model-select').value;localStorage.setItem('aiModel',currentModel);populateModelsSide();}
function renderChatList(){var list=document.getElementById('chat-list');var ids=Object.keys(userChats);if(ids.length===0){list.innerHTML='<div class="text-gray-500 text-xs text-center">لا محادثات</div>';return;}list.innerHTML=ids.map(id=>{var msgs=userChats[id];var title=msgs.length>0?msgs[0].text.substring(0,20):'محادثة';return '<div class="p-2 rounded-xl cursor-pointer hover:bg-[#282a2c]'+(id===currentChatId?' bg-[#1e3a5f]':'')+'" onclick="loadChat(\''+id+'\')">'+title+'<br><small class="text-gray-500">'+msgs.length+'</small></div>';}).join('');}
function loadChat(id){currentChatId=id;history=userChats[id]||[];localStorage.setItem('currentChatId',id);renderHistory();renderChatList();closeSidebar();}
function newChat(){if(history.length>0&&currentChatId){userChats[currentChatId]=history;}currentChatId='chat_'+Date.now();history=[];userChats[currentChatId]=[];saveUserChats();renderHistory();renderChatList();closeSidebar();}
function saveChat(){if(currentChatId&&currentUser){userChats[currentChatId]=history;saveUserChats();}}
function handleFile(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){var img=new Image();img.onload=function(){var canvas=document.createElement('canvas');var max=800;var ratio=Math.min(max/img.width,max/img.height,1);canvas.width=Math.floor(img.width*ratio);canvas.height=Math.floor(img.height*ratio);var ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);selectedImage=canvas.toDataURL('image/jpeg',0.8);document.getElementById('img-preview').src=selectedImage;document.getElementById('img-preview-bar').classList.remove('hidden');};img.src=ev.target.result;};r.readAsDataURL(f);}
function removeImage(){selectedImage=null;document.getElementById('file-input').value='';document.getElementById('img-preview-bar').classList.add('hidden');}
function renderHistory(){var msgs=document.getElementById('msgs');var welcome=document.getElementById('welcome');if(history.length===0){welcome.classList.remove('hidden');msgs.classList.add('hidden');msgs.innerHTML='';return;}welcome.classList.add('hidden');msgs.classList.remove('hidden');msgs.innerHTML=history.map(m=>{if(m.role==='user'){return '<div class="flex justify-end"><div class="bg-[#282a2c] rounded-2xl px-4 py-3 max-w-[85%]">'+(m.image?'<img src="'+m.image+'" class="max-w-xs rounded-xl mb-2">':'')+m.text+'</div></div>';}return '<div class="flex justify-start"><div class="text-gray-200 max-w-[85%] leading-relaxed">'+m.text+'</div></div>';}).join('');window.scrollTo(0,document.body.scrollHeight);}
function appendMsg(role,text,image,isHtml){history.push({role:role,text:text,image:image||null});saveChat();renderHistory();}
function formatText(t){if(!t)return'';t=t.replace(/```([\s\S]+?)```/g,function(m,code){return '<div class="code-block"><button class="copy-btn" onclick="navigator.clipboard.writeText(this.nextSibling.textContent)">📋 نسخ</button><span>'+code.replace(/</g,'&lt;')+'</span></div>';});t=t.replace(/\*\*(.*?)\*\*/g,'<b>$1</b>');return t.replace(/\n/g,'<br>');}
function callNexii(model,text){var messages=[];history.forEach(h=>messages.push({role:h.role,content:h.text}));messages.push({role:'user',content:text});return fetch(NEXII_BASE+'/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+NEXII_KEY,'Content-Type':'application/json'},body:JSON.stringify({model:model,messages:messages,max_tokens:2048})}).then(r=>r.text()).then(t=>{try{var d=JSON.parse(t);if(d.choices&&d.choices[0]&&d.choices[0].message)return d.choices[0].message.content||'';}catch(e){}var full='';var ls=t.split('\n');for(var i=0;i<ls.length;i++){if(ls[i].indexOf('data: ')>-1){var x=ls[i].substring(ls[i].indexOf('data: ')+6);if(x==='[DONE]')break;try{var j=JSON.parse(x);full+=j.choices[0].delta.content||'';}catch(e2){}}}return full;});}
function callGemini(model,text){return fetch('https://pubgskin.vercel.app/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:model,contents:[{role:'user',parts:[{text:text}]}]})}).then(r=>r.json()).then(d=>d.candidates?.[0]?.content?.parts?.[0]?.text||('❌ '+(d.error?.message||'مفيش رد')));}
async function sendMessage(){var input=document.getElementById('user-input');var text=input.value.trim();if(!text&&!selectedImage)return;
if(selectedImage&&text){appendMsg('user',text,selectedImage);appendMsg('assistant','<span class="dots"><span></span><span></span><span></span></span>');try{var m=MODELS.find(x=>x.id===currentModel);var reply=m.p==='nexii'?await callNexii(currentModel,text+' [مع صورة مرفقة]'):await callGemini(currentModel,text);history.pop();renderHistory();appendMsg('assistant',formatText(reply));}catch(e){history.pop();renderHistory();appendMsg('assistant','❌ '+e.message);}input.value='';removeImage();return;}
if(/(صمم|ارسم|انشئ|اصنع|تخيل).*(صورة|صوره)/i.test(text)){appendMsg('user',text);await genImage(text);input.value='';return;}
if(selectedImage){appendMsg('user',text||'حلل الصورة',selectedImage);}else{appendMsg('user',text);}input.value='';removeImage();
appendMsg('assistant','<span class="dots"><span></span><span></span><span></span></span>');
try{var m=MODELS.find(x=>x.id===currentModel);var reply=m.p==='nexii'?await callNexii(currentModel,text):await callGemini(currentModel,text);if(!reply)reply='❌ مفيش رد';history.pop();renderHistory();appendMsg('assistant',formatText(reply));}catch(e){history.pop();renderHistory();appendMsg('assistant','❌ '+e.message);}}
document.getElementById('user-input').addEventListener('keypress',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});
</script>
</body>
</html>
