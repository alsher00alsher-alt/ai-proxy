<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>📱 OTP LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:'Segoe UI',sans-serif;padding:10px}
.header{text-align:center;padding:15px;background:#111;border-bottom:2px solid #25D366;position:sticky;top:0;z-index:10}
h1{color:#25D366;font-size:22px}
.container{max-width:700px;margin:0 auto}
.card{background:#111;border:1px solid #222;border-radius:10px;padding:12px;margin:8px 0}
.card-new{border-color:#25D366}
.card-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:5px}
.flag{font-size:20px}.country{color:#25D366;font-weight:bold;font-size:14px}
.service{background:#1a1a1a;color:#ff0;padding:2px 8px;border-radius:4px;font-size:10px}
.number{font-size:12px;color:#888;margin:5px 0}
.otp-row{display:flex;justify-content:space-between;align-items:center;background:#1a1a1a;padding:10px;border-radius:8px}
.otp-code{font-size:26px;color:#25D366;font-weight:bold;letter-spacing:2px;font-family:monospace}
.copy-btn{background:#333;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:11px}
.copy-btn:hover{background:#25D366;color:#000}
.time{color:#666;font-size:10px;margin-top:5px}
.controls{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;justify-content:center}
button{padding:10px 15px;border-radius:8px;border:none;font-size:13px;cursor:pointer;font-weight:bold}
.btn-start{background:#25D366;color:#000}.btn-stop{background:#f00;color:#fff}.btn-refresh{background:#333;color:#fff}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#25D366;color:#000;padding:10px 20px;border-radius:20px;font-weight:bold;z-index:100;display:none}
.stats{display:flex;gap:8px;justify-content:center;margin:8px 0;flex-wrap:wrap}
.stat{background:#1a1a1a;padding:6px 12px;border-radius:6px;text-align:center;font-size:12px}
.stat b{color:#25D366}.new-badge{background:#f00;color:#fff;padding:1px 6px;border-radius:8px;font-size:9px;margin-left:4px}
</style>
</head>
<body>
<div class="header">
    <h1>📱 OTP LIVE CODES</h1>
    <div class="stats">
        <div class="stat">📊 <b id="t">0</b></div>
        <div class="stat">🆕 <b id="n">0</b></div>
        <div class="stat">🔄 <b id="u">0</b></div>
    </div>
</div>
<div class="container">
    <div class="controls">
        <button class="btn-start" onclick="startLive()">▶️ بدء البث</button>
        <button class="btn-stop" onclick="stopLive()">⏸️ إيقاف</button>
        <button class="btn-refresh" onclick="fetchNow()">🔄 الآن</button>
    </div>
    <div id="content" style="text-align:center;padding:30px;color:#888">⏳ اضغط "بدء البث"...</div>
</div>
<div class="toast" id="toast">✅ تم النسخ!</div>

<script>
let all=[],seen=new Set(),nc=0,uc=0,iv=null;
const F={'Indonesia':'🇮🇩','India':'🇮🇳','USA':'🇺🇸','Brazil':'🇧🇷','Nigeria':'🇳🇬','Egypt':'🇪🇬','Lebanon':'🇱🇧','Turkey':'🇹🇷','UK':'🇬🇧','France':'🇫🇷','Germany':'🇩🇪','Saudi Arabia':'🇸🇦','Morocco':'🇲🇦','Pakistan':'🇵🇰','Philippines':'🇵🇭','Malaysia':'🇲🇾'};
const G=c=>F[c]||'🌍';

async function fetchOTPs(){
    try{
        const r=await fetch('/api/otp-proxy');
        const d=await r.json();
        if(d.success)process(d.otps||[]);
    }catch(e){console.log(e)}
}

function process(otps){
    otps.sort((a,b)=>new Date(b.created_at||b.time||0)-new Date(a.created_at||a.time||0));
    otps.forEach(o=>{
        const id=(o.number||'')+'_'+(o.otp||o.code||'');
        if(!seen.has(id)){seen.add(id);nc++;o.isNew=true}
    });
    all=otps;uc++;display();updateStats();
}

function display(){
    document.getElementById('content').innerHTML=all.length===0
        ?'<div style="text-align:center;padding:30px;color:#888">لا توجد أكواد</div>'
        :all.slice(0,50).map(o=>{
            const n=o.number||'?',c=o.otp||o.code||'?',co=o.country||'?',s=o.service||'?';
            const t=o.created_at||o.time||'',p=n.length>6?n.substring(0,6):n;
            return`<div class="card${o.isNew?' card-new':''}">
            <div class="card-header"><span class="flag">${G(co)}</span><span class="country">#${co.substring(0,2).toUpperCase()}</span><span class="service">${s}</span>${o.isNew?'<span class="new-badge">NEW</span>':''}</div>
            <div class="number">📱 +${p}-XXXX-${n.length>4?n.slice(-4):'XXXX'} | 🆔 ${p}XXXX</div>
            <div class="otp-row"><div class="otp-code">🔑 ${c}</div><button class="copy-btn" onclick="copyCode('${c}')">📋 نسخ</button></div>
            <div class="time">🕒 ${t?new Date(t).toLocaleTimeString('ar-EG'):''}</div></div>`;
        }).join('');
}

function updateStats(){
    document.getElementById('t').textContent=all.length;
    document.getElementById('n').textContent=nc;
    document.getElementById('u').textContent=uc;
}

function copyCode(c){navigator.clipboard.writeText(c);let t=document.getElementById('toast');t.style.display='block';setTimeout(()=>t.style.display='none',1500)}
function fetchNow(){fetchOTPs()}
function startLive(){fetchOTPs();iv=setInterval(fetchOTPs,5000)}
function stopLive(){if(iv){clearInterval(iv);iv=null}}
</script>
</body>
</html>
