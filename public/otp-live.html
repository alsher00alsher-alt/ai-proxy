<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>📱 OTP LIVE</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0a;color:#fff;font-family:'Segoe UI',sans-serif;padding:10px}
        .header{text-align:center;padding:15px;background:#111;border-bottom:2px solid #25D366;position:sticky;top:0;z-index:10}
        .header h1{color:#25D366;font-size:24px}
        .stats{display:flex;gap:10px;justify-content:center;margin:10px 0;flex-wrap:wrap}
        .stat{background:#1a1a1a;padding:8px 15px;border-radius:8px;text-align:center}
        .stat-num{font-size:20px;color:#25D366;font-weight:bold}
        .stat-label{font-size:10px;color:#888}
        .live-dot{display:inline-block;width:10px;height:10px;background:#f00;border-radius:50%;animation:pulse 1s infinite}
        @keyframes pulse{50%{opacity:0.3}}
        .container{max-width:900px;margin:0 auto}
        .card{background:#111;border:1px solid #222;border-radius:10px;padding:12px;margin:8px 0;animation:fadeIn 0.3s}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .card-new{border-color:#25D366;box-shadow:0 0 15px rgba(37,211,102,0.2)}
        .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:5px}
        .flag{font-size:20px}
        .country{color:#25D366;font-weight:bold;font-size:14px}
        .prefix{color:#888;font-size:11px}
        .service{background:#1a1a1a;color:#ff0;padding:2px 8px;border-radius:4px;font-size:10px}
        .number-row{font-size:12px;color:#888;margin:5px 0}
        .otp-row{display:flex;justify-content:space-between;align-items:center;background:#1a1a1a;padding:10px;border-radius:8px}
        .otp-code{font-size:26px;color:#25D366;font-weight:bold;letter-spacing:2px;font-family:monospace}
        .copy-btn{background:#333;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:11px;transition:0.2s}
        .copy-btn:hover{background:#25D366;color:#000}
        .time{color:#666;font-size:10px;margin-top:5px}
        .controls{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;justify-content:center}
        button{padding:10px 15px;border-radius:8px;border:none;font-size:13px;cursor:pointer;font-weight:bold;transition:0.2s}
        .btn-start{background:#25D366;color:#000}
        .btn-stop{background:#f00;color:#fff}
        .btn-refresh{background:#333;color:#fff}
        .empty{text-align:center;padding:40px;color:#888}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#25D366;color:#000;padding:12px 25px;border-radius:25px;font-weight:bold;z-index:100;display:none;animation:fadeIn 0.3s}
        select{background:#1a1a1a;color:#fff;border:1px solid #333;padding:8px;border-radius:6px;font-size:13px}
        .count-badge{background:#25D366;color:#000;padding:2px 8px;border-radius:10px;font-size:10px;margin-left:5px}
    </style>
</head>
<body>
<div class="header">
    <h1>📱 OTP LIVE CODES <span class="live-dot" id="liveDot"></span></h1>
    <div class="stats">
        <div class="stat"><div class="stat-num" id="totalCodes">0</div><div class="stat-label">Total</div></div>
        <div class="stat"><div class="stat-num" id="newCodes">0</div><div class="stat-label">New</div></div>
        <div class="stat"><div class="stat-num" id="countries">0</div><div class="stat-label">Countries</div></div>
        <div class="stat"><div class="stat-num" id="updateCount">0</div><div class="stat-label">Updates</div></div>
    </div>
</div>

<div class="container">
    <div class="controls">
        <button class="btn-start" onclick="startLive()">▶️ بدء البث المباشر</button>
        <button class="btn-stop" onclick="stopLive()">⏸️ إيقاف</button>
        <button class="btn-refresh" onclick="fetchNow()">🔄 تحديث الآن</button>
        <select id="countryFilter" onchange="applyFilter()">
            <option value="">🌍 الكل</option>
        </select>
        <select id="serviceFilter" onchange="applyFilter()">
            <option value="">📱 الكل</option>
            <option value="WhatsApp">WhatsApp</option>
            <option value="Telegram">Telegram</option>
            <option value="Instagram">Instagram</option>
            <option value="Google">Google</option>
            <option value="Facebook">Facebook</option>
            <option value="TikTok">TikTok</option>
        </select>
    </div>
    <div id="content"><div class="empty">⏳ اضغط "بدء البث المباشر" للبدء...</div></div>
</div>

<div class="toast" id="toast">✅ تم النسخ!</div>

<script>
const API_KEY='np_live_6DknI4df2uZ0_BFv6CGGpX_BCBAq60TG1sKev64WPkw';
const BASE='https://numberpanel.tech/api';
let allOTPs=[];
let seenCodes=new Set();
let newCount=0;
let updateCount=0;
let liveInterval=null;

const FLAGS={
    'Indonesia':'🇮🇩','India':'🇮🇳','United States':'🇺🇸','USA':'🇺🇸',
    'UK':'🇬🇧','Brazil':'🇧🇷','Nigeria':'🇳🇬','Egypt':'🇪🇬',
    'Saudi Arabia':'🇸🇦','Lebanon':'🇱🇧','Turkey':'🇹🇷','Germany':'🇩🇪',
    'France':'🇫🇷','Russia':'🇷🇺','China':'🇨🇳','Japan':'🇯🇵',
    'Canada':'🇨🇦','Australia':'🇦🇺','Spain':'🇪🇸','Italy':'🇮🇹',
    'Malaysia':'🇲🇾','Philippines':'🇵🇭','Pakistan':'🇵🇰','Morocco':'🇲🇦',
    'UAE':'🇦🇪','Qatar':'🇶🇦','Kuwait':'🇰🇼','Iraq':'🇮🇶',
    'Jordan':'🇯🇴','Algeria':'🇩🇿','Tunisia':'🇹🇳','Sudan':'🇸🇩'
};

function getFlag(c){return FLAGS[c]||'🌍'}

async function fetchOTPs(){
    try{
        const res=await fetch(`${BASE}/my_otps?limit=300`,{
            headers:{'Authorization':'Bearer '+API_KEY}
        });
        const data=await res.json();
        
        if(data.success){
            const otps=data.otps||[];
            otps.sort((a,b)=>new Date(b.created_at||b.time||0)-new Date(a.created_at||a.time||0));
            
            // كشف الجديد
            otps.forEach(o=>{
                const id=o.number+'_'+o.otp;
                if(!seenCodes.has(id)){
                    seenCodes.add(id);
                    newCount++;
                    o.isNew=true;
                }
            });
            
            allOTPs=otps;
            updateCount++;
            displayOTPs(applyFilters());
            updateStats();
            updateFilters();
        }
    }catch(e){console.log(e)}
}

function displayOTPs(otps){
    const content=document.getElementById('content');
    
    if(otps.length===0){
        content.innerHTML='<div class="empty">لا توجد أكواد</div>';
        return;
    }
    
    let html='';
    otps.forEach(otp=>{
        const number=otp.number||'Unknown';
        const code=otp.otp||otp.code||'⏳ Waiting...';
        const country=otp.country||'Unknown';
        const service=otp.service||'Unknown';
        const time=otp.created_at||otp.time||'';
        const prefix=number.length>6?number.substring(0,6):number;
        const last4=number.length>4?number.slice(-4):'XXXX';
        const isNew=otp.isNew;
        
        html+=`
        <div class="card ${isNew?'card-new':''}">
            <div class="card-header">
                <div>
                    <span class="flag">${getFlag(country)}</span>
                    <span class="country">#${country.substring(0,2).toUpperCase()}</span>
                    <span class="count-badge" style="background:#ff0;color:#000;margin-left:5px">${service}</span>
                    ${isNew?'<span class="count-badge" style="background:#f00;color:#fff">NEW</span>':''}
                </div>
            </div>
            <div class="number-row">📱 +${prefix}-XXXX-${last4} | 🆔 ${prefix}XXXX</div>
            <div class="otp-row">
                <div class="otp-code">🔑 ${code}</div>
                <button class="copy-btn" onclick="copyCode('${code}')">📋 نسخ</button>
            </div>
            <div class="time">🕒 ${formatTime(time)}</div>
        </div>`;
    });
    
    content.innerHTML=html;
}

function formatTime(t){
    if(!t)return '';
    try{
        const d=new Date(t);
        return d.toLocaleString('ar-EG',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    }catch(e){return t}
}

function applyFilters(){
    const country=document.getElementById('countryFilter').value;
    const service=document.getElementById('serviceFilter').value;
    return allOTPs.filter(o=>{
        if(country&&o.country!==country)return false;
        if(service&&o.service!==service)return false;
        return true;
    });
}

function applyFilter(){displayOTPs(applyFilters())}

function updateStats(){
    document.getElementById('totalCodes').textContent=allOTPs.length;
    document.getElementById('newCodes').textContent=newCount;
    document.getElementById('countries').textContent=new Set(allOTPs.map(o=>o.country)).size;
    document.getElementById('updateCount').textContent=updateCount;
}

function updateFilters(){
    const countries=new Set(allOTPs.map(o=>o.country));
    const sel=document.getElementById('countryFilter');
    sel.innerHTML='<option value="">🌍 الكل</option>';
    countries.forEach(c=>{sel.innerHTML+=`<option value="${c}">${getFlag(c)} ${c}</option>`});
}

function copyCode(code){
    navigator.clipboard.writeText(code);
    const toast=document.getElementById('toast');
    toast.style.display='block';
    setTimeout(()=>toast.style.display='none',1500);
}

function fetchNow(){fetchOTPs()}

function startLive(){
    document.getElementById('liveDot').style.background='#0f0';
    fetchOTPs();
    liveInterval=setInterval(fetchOTPs,5000);
}

function stopLive(){
    document.getElementById('liveDot').style.background='#f00';
    if(liveInterval){clearInterval(liveInterval);liveInterval=null}
}
</script>
</body>
</html>
