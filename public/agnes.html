<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agnes AI - ذكاء اصطناعي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#0f0f1a;--surface:#1a1a2e;--primary:#8b5cf6;--primary-light:#a78bfa;--secondary:#06b6d4;--text:#f1f5f9;--muted:#94a3b8;--border:#2d2d4a}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
        
        header{background:var(--surface);padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
        header .logo{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#ec4899);display:flex;align-items:center;justify-content:center;font-size:20px}
        header .info{flex:1}header .info h1{font-size:16px}header .info p{font-size:10px;color:var(--muted)}
        header button{background:none;border:1px solid var(--border);color:var(--muted);padding:5px 10px;border-radius:8px;font-size:10px;cursor:pointer;font-family:'Cairo',sans-serif}
        
        main{flex:1;overflow-y:auto;padding:15px;padding-bottom:90px;max-width:550px;margin:0 auto;width:100%}
        .chat-box{display:flex;flex-direction:column;gap:12px}
        
        .msg{display:flex;gap:8px;max-width:88%}
        .msg.user{align-self:flex-end;flex-direction:row-reverse}
        .msg.bot{align-self:flex-start}
        .msg-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
        .msg.bot .msg-avatar{background:linear-gradient(135deg,var(--primary),#ec4899)}
        .msg.user .msg-avatar{background:var(--surface);border:1px solid var(--border)}
        .msg-bubble{padding:10px 14px;border-radius:12px;font-size:12px;line-height:1.5}
        .msg.bot .msg-bubble{background:var(--surface);border:1px solid var(--border)}
        .msg.user .msg-bubble{background:var(--primary);color:#fff}
        .msg.bot .msg-bubble a{display:inline-block;margin-top:5px;padding:5px 10px;background:var(--primary);color:#fff;border-radius:6px;text-decoration:none;font-size:10px}
        
        .input-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;z-index:90;max-width:550px;margin:0 auto}
        .input-bar input{flex:1;padding:12px;background:var(--bg);border:2px solid var(--border);border-radius:20px;color:var(--text);outline:none;font-size:13px;font-family:'Cairo',sans-serif}
        .input-bar input:focus{border-color:var(--primary)}
        .input-bar button{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#ec4899);border:none;color:#fff;font-size:16px;cursor:pointer}
        
        .quick-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
        .quick-btn{padding:5px 10px;background:var(--surface);border:1px solid var(--border);color:var(--muted);border-radius:15px;font-size:10px;cursor:pointer;font-family:'Cairo',sans-serif}
        .quick-btn:active{background:var(--primary);color:#fff}
        
        .typing{display:flex;gap:3px;padding:4px 0}
        .typing span{width:4px;height:4px;background:var(--muted);border-radius:50%;animation:bounce 1.4s infinite}
        .typing span:nth-child(1){animation-delay:0s}.typing span:nth-child(2){animation-delay:0.2s}.typing span:nth-child(3){animation-delay:0.4s}
        @keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
        
        .progress-card{background:var(--surface);border:2px dashed var(--primary);border-radius:12px;padding:15px;text-align:center;margin:5px 0}
        .progress-bar{width:100%;height:4px;background:var(--border);border-radius:2px;margin:8px 0;overflow:hidden}
        .progress-fill{height:100%;background:var(--primary);width:0%;border-radius:2px}
        
        .file-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:5px}
        .file-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
        .file-card .icon{font-size:24px}.file-card .name{font-size:10px;font-weight:700;margin:4px 0}
        .file-card a{display:inline-block;margin-top:4px;padding:4px 10px;background:var(--primary);color:#fff;border-radius:5px;text-decoration:none;font-size:9px}
        
        .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;background:var(--surface);border:1px solid var(--primary);color:var(--primary-light);padding:8px 16px;border-radius:20px;font-size:12px}
    </style>
</head>
<body>

<header>
    <div class="logo">🤖</div>
    <div class="info"><h1>Agnes AI</h1><p>ذكاء اصطناعي + صانع ملفات</p></div>
    <button onclick="localStorage.removeItem('agnes_chat');location.reload()">🗑️ مسح</button>
</header>

<main>
    <div class="chat-box" id="chat"></div>
    <div class="quick-actions">
        <button class="quick-btn" onclick="quick('اصنع اسكنات')">🎨 اصنع اسكنات</button>
        <button class="quick-btn" onclick="quick('اصنع هاك')">☠️ اصنع هاك</button>
        <button class="quick-btn" onclick="quick('اصنع FPS')">⚡ اصنع FPS</button>
        <button class="quick-btn" onclick="quick('مرحبا')">👋 مرحبا</button>
    </div>
</main>

<div class="input-bar">
    <input type="text" id="prompt" placeholder="اكتب سؤال أو طلب..." onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()"><i class="fa-solid fa-paper-plane"></i></button>
</div>

<script>
const $=id=>document.getElementById(id);
const API='/api/agnes';
const FILES={
    'اسكنات':[
        {name:'اسكنات V1',url:'https://www.mediafire.com/file/zksxavlbh9052n2/SKIN_1_APP.zip'},
        {name:'اسكنات V2',url:'https://www.mediafire.com/file/wjwqpf5u0qd8rt2/SKIN_2_APP_.zip/file'}
    ],
    'هاك':[
        {name:'هكر V1',url:'https://www.mediafire.com/file/8vc1p8xjzu8h1hn/HACKE_V_1_APP_.zip/file'},
        {name:'هكر V2',url:'https://www.mediafire.com/file/hhk46due9468tzk/HACKE_V_2_APP_.zip/file'}
    ],
    'fps':[
        {name:'FPS 165',url:'https://www.mediafire.com/file/vpqwmc0p9pbnbrs/FPS_HACKE_165_V_1_APP_.zip/file'}
    ],
    'فريم':[
        {name:'FPS 165',url:'https://www.mediafire.com/file/vpqwmc0p9pbnbrs/FPS_HACKE_165_V_1_APP_.zip/file'}
    ]
};
const LEARNED=['اسكنات','هاك','fps','فريم','فريمات'];
const UNKNOWN=['ايم بوت','aimbot','esp','wallhack','ماجيك','speed','jump','antenna','بوليت','تلي بورت'];

let chatHistory=JSON.parse(localStorage.getItem('agnes_chat')||'[]');

function save(){localStorage.setItem('agnes_chat',JSON.stringify(chatHistory.slice(-50)));}
function toast(m){let t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500);}
function quick(t){$('prompt').value=t;send();}

function addMsg(role,html){
    chatHistory.push({role,content:html});save();
    let d=document.createElement('div');d.className='msg '+role;
    d.innerHTML=`<div class="msg-avatar">${role==='user'?'👤':'🤖'}</div><div class="msg-bubble">${html}</div>`;
    $('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;return d;
}
function loader(){
    let d=document.createElement('div');d.className='msg bot';
    d.innerHTML='<div class="msg-avatar">🤖</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    $('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;return d;
}

function renderSaved(){
    chatHistory.forEach(m=>{
        let d=document.createElement('div');d.className='msg '+(m.role==='user'?'user':'bot');
        d.innerHTML=`<div class="msg-avatar">${m.role==='user'?'👤':'🤖'}</div><div class="msg-bubble">${m.content}</div>`;
        $('chat').appendChild(d);
    });
    $('chat').scrollTop=$('chat').scrollHeight;
}

async function send(){
    let t=$('prompt').value.trim();if(!t)return;$('prompt').value='';
    
    addMsg('user',t);
    let lt=t.toLowerCase();
    
    // ========== لو طلب ملف ==========
    let found=null;
    for(let k in FILES){if(lt.includes(k)){found=FILES[k];break;}}
    
    if(found){
        let l=loader();
        let el=$('chat').lastElementChild;
        let p=0,interval=setInterval(()=>{
            p+=Math.random()*15;if(p>100)p=100;
            el.querySelector('.msg-bubble').innerHTML=`
                <div class="progress-card">
                    <b>⚡ جاري التوليد...</b>
                    <div class="progress-bar"><div class="progress-fill" style="width:${p}%"></div></div>
                    <span>${Math.floor(p)}%</span>
                </div>`;
            if(p>=100){
                clearInterval(interval);
                el.querySelector('.msg-bubble').innerHTML=`
                    ✅ <b>تم التوليد بنجاح!</b>
                    <div class="file-grid">
                        ${found.map(f=>`<div class="file-card"><div class="icon">📦</div><div class="name">${f.name}</div><a href="${f.url}" target="_blank">📥 تحميل</a></div>`).join('')}
                    </div>`;
                save();
            }
        },200);
        return;
    }
    
    // ========== لو طلب حاجة مش متعلمها ==========
    for(let u of UNKNOWN){if(lt.includes(u)){
        let allFiles=[];
        for(let k in FILES){FILES[k].forEach(f=>allFiles.push(f));}
        addMsg('bot',`
            😅 <b>لسه متعلمتش "${u}"</b><br><br>
            📚 <b>الملفات اللي بعرف أعملها:</b>
            <div class="file-grid">
                ${allFiles.map(f=>`<div class="file-card"><div class="icon">📦</div><div class="name">${f.name}</div><a href="${f.url}" target="_blank">📥 تحميل</a></div>`).join('')}
            </div>`);
        return;
    }}
    
    // ========== لو طلب حاجة للشات ==========
    let l=loader();
    try{
        let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'chat',message:t})});
        let d=await r.json();l.remove();
        if(d.success){
            addMsg('bot',d.message);
        }else{
            addMsg('bot','❌ حدث خطأ. جرب تاني!');
        }
    }catch(e){l.remove();addMsg('bot','❌ خطأ في الاتصال');}
}

// عرض أول رسالة
if(chatHistory.length===0){
    addMsg('bot',`👋 <b>مرحباً! أنا Agnes AI</b><br><br>🎨 <b>أقدر أصنعلك:</b><br>• اصنع اسكنات<br>• اصنع هاك<br>• اصنع FPS<br><br>💬 <b>وأقدر أجاوب على أسئلتك</b><br><br>جرب تكتب: "اصنع اسكنات"`);
}else{
    renderSaved();
}
</script>
</body>
</html>
