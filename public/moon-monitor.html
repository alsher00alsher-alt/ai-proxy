<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>💀 MOON HACKER PANEL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#0f0;font-family:'Courier New',monospace;min-height:100vh;padding:15px;overflow-x:hidden}
.scanline{position:fixed;top:0;left:0;width:100%;height:2px;background:rgba(0,255,0,.3);animation:scan 3s linear infinite;z-index:100;pointer-events:none}
@keyframes scan{0%{top:0}100%{top:100vh}}
.page{display:none}.page.active{display:block}
.header{text-align:center;margin:20px 0}
.header h1{font-size:26px;color:#f00;text-shadow:0 0 20px #f00;letter-spacing:3px}
.header .sub{color:#0f0;font-size:11px;margin-top:5px}
.total-box{text-align:center;margin:15px auto;padding:20px;background:rgba(0,20,0,.8);border:2px solid #0f0;border-radius:15px;max-width:350px}
.total-box .label{color:#0f0;font-size:14px}
.total-box .total-score{font-size:55px;font-weight:bold;color:#f00;text-shadow:0 0 30px #f00;margin:10px 0}
.total-box .total-followers{font-size:14px;color:#ff0}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;max-width:900px;margin:15px auto}
.card{background:rgba(0,20,0,.8);border:1px solid #0f0;border-radius:10px;padding:12px;text-align:center}
.card .name{color:#0f0;font-size:11px;font-weight:bold;word-break:break-all}
.card .score{font-size:26px;font-weight:bold;color:#0f0;margin:8px 0}
.services{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;max-width:700px;margin:20px auto}
.service-card{background:rgba(0,20,0,.8);border:2px solid #0f0;border-radius:15px;padding:20px;text-align:center;cursor:pointer;transition:.3s}
.service-card:hover{border-color:#f00;box-shadow:0 0 25px rgba(255,0,0,.3);transform:scale(1.05)}
.service-card .icon{font-size:40px}
.service-card .label{color:#0f0;font-size:14px;font-weight:bold;margin-top:10px}
.btn{display:block;margin:20px auto;padding:18px 40px;background:rgba(255,0,0,.1);border:2px solid #f00;border-radius:10px;color:#f00;font-size:18px;font-weight:bold;cursor:pointer;letter-spacing:2px}
.btn:hover{background:#f00;color:#000;box-shadow:0 0 40px #f00}
.input-box{max-width:400px;margin:20px auto;padding:25px;background:rgba(0,20,0,.8);border:2px solid #0f0;border-radius:15px;text-align:center}
.input-box input{width:100%;padding:14px;background:#000;border:1px solid #0f0;border-radius:10px;color:#0f0;font-size:14px;margin:8px 0;outline:none;font-family:monospace}
.result{margin:15px 0;padding:15px;border-radius:10px;display:none}
.success{background:rgba(0,255,0,.1);color:#0f0;border:1px solid #0f0}
.error{background:rgba(255,0,0,.1);color:#f00;border:1px solid #f00}
.back-btn{background:#0a0a0a;color:#0f0;padding:10px 20px;border:1px solid #0f0;border-radius:8px;cursor:pointer;font-size:14px;margin-top:10px}
.orders-box{max-width:500px;margin:20px auto}
.order-card{background:rgba(0,20,0,.8);border:1px solid #0f0;border-radius:10px;padding:15px;margin:10px 0}
.order-card .order-time{color:#333;font-size:11px}
.order-card .order-target{color:#f00;font-size:16px;font-weight:bold}
.order-card .order-amount{color:#0f0;font-size:14px;margin:5px 0}
.order-card .used{font-size:11px;color:#666}
</style>
</head>
<body>
<div class="scanline"></div>

<div class="page active" id="monitorPage">
    <div class="header">
        <h1>💀 MOON HACKER PANEL</h1>
        <div class="sub">12 Accounts | 24/7 | All Services</div>
    </div>
    <div class="total-box">
        <div class="label">⚡ إجمالي النقاط</div>
        <div class="total-score" id="totalScore">0</div>
        <div class="total-followers" id="totalFollowers">= 0 متابع</div>
    </div>
    <div class="stats" id="stats"></div>
    
    <h2 style="text-align:center;color:#0f0;margin:15px">🛠️ الخدمات</h2>
    <div class="services">
        <div class="service-card" onclick="showService('followers','👥','متابعين')"><div class="icon">👥</div><div class="label">متابعين</div></div>
        <div class="service-card" onclick="showService('likes','❤️','لايكات')"><div class="icon">❤️</div><div class="label">لايكات</div></div>
        <div class="service-card" onclick="showService('views','👁️','مشاهدات')"><div class="icon">👁️</div><div class="label">مشاهدات</div></div>
        <div class="service-card" onclick="showService('comments','💬','تعليقات')"><div class="icon">💬</div><div class="label">تعليقات</div></div>
    </div>
</div>

<div class="page" id="servicePage">
    <div class="header"><h1 id="serviceTitle">💀 خدمة</h1></div>
    <div class="input-box">
        <input type="text" id="target" placeholder="🎯 يوزرنيم أو رابط الفيديو">
        <input type="number" id="amount" placeholder="👥 الكمية">
        <button class="btn" onclick="executeOrder()">⚡ تنفيذ</button>
        <div class="result" id="result"></div>
        <button class="back-btn" onclick="goBack()">← رجوع</button>
    </div>
</div>

<script>
const BASE='https://ai-proxy-production-59b3.up.railway.app';
const accounts=['ahmed.alsher0','zoor579','ahmedppl','mmjjk','mmjjjk','mmjjjjk','aappi','aappii','aappmm','o785769','appmmm','pubg.ameeer'];
let currentService='followers';
let totalPoints=0;

function showService(service,icon,label){
    currentService=service;
    document.getElementById('serviceTitle').textContent=`💀 ${icon} ${label}`;
    document.getElementById('monitorPage').classList.remove('active');
    document.getElementById('servicePage').classList.add('active');
}
function goBack(){document.getElementById('servicePage').classList.remove('active');document.getElementById('monitorPage').classList.add('active');}

function renderCards(){document.getElementById('stats').innerHTML=accounts.map((acc,i)=>`<div class="card"><div class="name">👤 ${acc}</div><div class="score" id="s${i}">--</div></div>`).join('');}

async function refresh(){
    try{
        const res=await fetch(`${BASE}/scores`);
        const data=await res.json();
        totalPoints=data.total||0;
        document.getElementById('totalScore').textContent=totalPoints;
        document.getElementById('totalFollowers').textContent=`= ${Math.floor(totalPoints/5)} متابع`;
        accounts.forEach((acc,i)=>{document.getElementById('s'+i).textContent=data.scores?.[acc]||0;});
    }catch(e){}
}

async function executeOrder(){
    const target=document.getElementById('target').value.trim();
    const amount=parseInt(document.getElementById('amount').value);
    const resultEl=document.getElementById('result');
    if(!target||!amount){resultEl.className='result error';resultEl.textContent='❌ اكتب البيانات';resultEl.style.display='block';return;}
    resultEl.className='result';resultEl.textContent='⏳ جاري...';resultEl.style.display='block';
    try{
        const res=await fetch(`${BASE}/create-order`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service:currentService,target,amount})});
        const data=await res.json();
        if(data.success){resultEl.className='result success';resultEl.textContent=`✅ ${data.message}`;}
        else{resultEl.className='result error';resultEl.textContent=`❌ ${data.error}`;}
    }catch(e){resultEl.className='result error';resultEl.textContent='❌ فشل';}
    resultEl.style.display='block';
}

renderCards();
refresh();
setInterval(refresh,1000);
</script>
</body>
</html>
