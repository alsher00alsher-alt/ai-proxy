<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🌙 MOON MONITOR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#0f0;font-family:'Courier New',monospace;padding:15px}
h1{text-align:center;color:#8b5cf6;font-size:22px;margin-bottom:15px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-width:800px;margin:15px auto}
.card{background:#111;border:2px solid #8b5cf6;border-radius:15px;padding:18px;text-align:center}
.name{color:#8b5cf6;font-size:13px;font-weight:bold}
.score{font-size:32px;font-weight:bold;color:#22c55e;margin:8px 0}
button{display:block;margin:15px auto;padding:12px 30px;background:#8b5cf6;color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:15px;font-weight:bold}
</style>
</head>
<body>
<h1>🌙 MOON MONITOR - 6 Accounts</h1>
<div class="stats" id="stats"></div>
<button onclick="refresh()">🔄 تحديث</button>

<script>
const BASE = 'https://ai-proxy-production-59b3.up.railway.app';
const accounts = ['ahmed.alsher0','zoor579','ahmedppl','mmjjk','mmjjjk','mmjjjjk'];

function renderCards() {
    document.getElementById('stats').innerHTML = accounts.map((acc, i) => `
        <div class="card">
            <div class="name">👤 ${acc}</div>
            <div class="score" id="s${i}">--</div>
        </div>
    `).join('');
}

async function refresh() {
    for (let i = 0; i < accounts.length; i++) {
        try {
            const res = await fetch(`${BASE}/score/${accounts[i]}`);
            const data = await res.json();
            document.getElementById('s' + i).textContent = data.score;
        } catch(e) {
            document.getElementById('s' + i).textContent = '❌';
        }
    }
}

renderCards();
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
