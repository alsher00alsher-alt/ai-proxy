<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🌙 MOON CONTROL PANEL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#0f0;font-family:'Courier New',monospace;padding:15px;min-height:100vh}
.page{display:none}
.page.active{display:block}
h1{text-align:center;color:#8b5cf6;font-size:22px;margin-bottom:10px}
h2{text-align:center;color:#8b5cf6;font-size:16px;margin-bottom:15px}
.total-box{text-align:center;margin:15px auto;padding:20px;background:#111;border:2px solid #8b5cf6;border-radius:15px;max-width:300px}
.total-box .label{color:#888;font-size:14px}
.total-box .total-score{font-size:48px;font-weight:bold;color:#22c55e;margin:10px 0}
.total-box .total-followers{font-size:16px;color:#f59e0b}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;max-width:800px;margin:15px auto}
.card{background:#111;border:2px solid #8b5cf6;border-radius:15px;padding:15px;text-align:center}
.card .name{color:#8b5cf6;font-size:12px;font-weight:bold}
.card .score{font-size:28px;font-weight:bold;color:#22c55e;margin:8px 0}
.btn{display:block;margin:15px auto;padding:15px 30px;background:#8b5cf6;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;width:80%;max-width:300px}
.btn:hover{background:#7c3aed}
.buy-box{max-width:400px;margin:20px auto;padding:25px;background:#111;border:2px solid #8b5cf6;border-radius:20px;text-align:center}
.buy-box input{width:100%;padding:14px;background:#1a1a1a;border:1px solid #333;border-radius:10px;color:#fff;font-size:14px;margin:8px 0;outline:none}
.buy-box input:focus{border-color:#8b5cf6}
.result{margin:15px 0;padding:15px;border-radius:10px;display:none}
.success{background:rgba(34,197,94,.15);color:#22c55e}
.error{background:rgba(239,68,68,.15);color:#ef4444}
.back-btn{background:#333;color:#fff;padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:14px;margin-top:10px}
.balance{color:#888;font-size:12px;margin-bottom:10px}
.balance span{color:#22c55e;font-size:16px;font-weight:bold}
</style>
</head>
<body>

<div class="page active" id="monitorPage">
    <h1>🌙 MOON CONTROL PANEL</h1>
    <div class="total-box">
        <div class="label">💰 إجمالي النقاط</div>
        <div class="total-score" id="totalScore">0</div>
        <div class="total-followers" id="totalFollowers">= 0 متابع</div>
    </div>
    <h2>📊 نقاط الحسابات</h2>
    <div class="stats" id="stats"></div>
    <button class="btn" onclick="showBuyPage()">🛒 شراء متابعين</button>
</div>

<div class="page" id="buyPage">
    <h1>🛒 شراء متابعين</h1>
    <div class="buy-box">
        <p class="balance">💰 الرصيد: <span id="buyBalance">0</span> نقطة</p>
        <input type="text" id="targetUser" placeholder="يوزرنيم الهدف (@username)">
        <input type="number" id="amount" placeholder="عدد المتابعين">
        <button class="btn" onclick="buy()">🛒 شراء</button>
        <div class="result" id="result"></div>
        <button class="back-btn" onclick="showMonitorPage()">← رجوع</button>
    </div>
</div>

<script>
const BASE = 'https://ai-proxy-production-59b3.up.railway.app';
const accounts = ['ahmed.alsher0','zoor579','ahmedppl','mmjjk','mmjjjk','mmjjjjk','aappi','aappii','aappmm'];
let totalPoints = 0;

function showBuyPage() {
    document.getElementById('monitorPage').classList.remove('active');
    document.getElementById('buyPage').classList.add('active');
    document.getElementById('buyBalance').textContent = totalPoints;
}

function showMonitorPage() {
    document.getElementById('buyPage').classList.remove('active');
    document.getElementById('monitorPage').classList.add('active');
    refresh();
}

function renderCards() {
    document.getElementById('stats').innerHTML = accounts.map((acc, i) => `
        <div class="card">
            <div class="name">👤 ${acc}</div>
            <div class="score" id="s${i}">--</div>
        </div>
    `).join('');
}

async function refresh() {
    try {
        const res = await fetch(`${BASE}/scores`);
        const data = await res.json();
        totalPoints = data.total || 0;
        document.getElementById('totalScore').textContent = totalPoints;
        const maxFollowers = Math.floor(totalPoints / 5);
        document.getElementById('totalFollowers').textContent = `= ${maxFollowers} متابع`;
        accounts.forEach((acc, i) => {
            document.getElementById('s' + i).textContent = data.scores?.[acc] || 0;
        });
    } catch(e) {}
}

async function buy() {
    const target = document.getElementById('targetUser').value.replace('@', '').trim();
    const amount = parseInt(document.getElementById('amount').value);
    const resultEl = document.getElementById('result');
    
    if (!target || !amount) {
        resultEl.className = 'result error';
        resultEl.textContent = '❌ اكتب اليوزرنيم والعدد';
        resultEl.style.display = 'block';
        return;
    }
    
    resultEl.className = 'result';
    resultEl.textContent = '⏳ جاري الشراء...';
    resultEl.style.display = 'block';
    
    try {
        const res = await fetch(`${BASE}/buy-followers`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({target, amount})
        });
        const data = await res.json();
        
        if (data.success) {
            resultEl.className = 'result success';
            resultEl.textContent = `✅ ${data.message}`;
            refresh();
        } else {
            resultEl.className = 'result error';
            resultEl.textContent = `❌ ${data.error}`;
        }
    } catch(e) {
        resultEl.className = 'result error';
        resultEl.textContent = '❌ فشل الاتصال';
    }
    resultEl.style.display = 'block';
}

renderCards();
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
