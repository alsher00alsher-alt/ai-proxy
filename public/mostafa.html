<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مصطفي AI - مساعدك الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root{--bg:#06060e;--surface:#0e0e1a;--primary:#a855f7;--primary-light:#c084fc;--secondary:#06b6d4;--accent:#f59e0b;--text:#f1f5f9;--muted:#94a3b8;--border:#1e2040}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
        
        .header{background:var(--surface);padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
        .header .logo{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#ec4899);display:flex;align-items:center;justify-content:center;font-size:24px}
        .header .info{flex:1}.header .info h1{font-size:20px;font-weight:900}.header .info p{font-size:11px;color:var(--muted)}
        .header .badge{background:var(--accent);color:#000;padding:4px 12px;border-radius:20px;font-size:10px;font-weight:800}
        
        .suggestions-bar{background:var(--surface);padding:12px 20px;border-bottom:1px solid var(--border);overflow-x:auto;white-space:nowrap}
        .suggestions-bar .title{color:var(--muted);font-size:10px;margin-bottom:8px;display:flex;align-items:center;gap:5px}
        .suggestions{display:flex;gap:8px;flex-wrap:nowrap}
        .suggestion{background:var(--bg);border:1px solid var(--border);padding:10px 16px;border-radius:25px;color:var(--text);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:0.3s;display:flex;align-items:center;gap:6px}
        .suggestion:hover,.suggestion:active{background:var(--primary);border-color:var(--primary);color:#fff}
        .suggestion .emoji{font-size:16px}
        
        .main-content{flex:1;overflow-y:auto;padding:20px}
        .chat-container{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
        
        .msg{display:flex;gap:10px;max-width:85%}
        .msg.user{align-self:flex-end;flex-direction:row-reverse}
        .msg.bot{align-self:flex-start}
        .msg-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
        .msg.bot .msg-avatar{background:linear-gradient(135deg,var(--primary),#ec4899)}
        .msg.user .msg-avatar{background:var(--surface);border:1px solid var(--border)}
        .msg-content{display:flex;flex-direction:column;gap:4px}
        .msg-name{font-size:10px;font-weight:700;color:var(--muted)}
        .msg-bubble{padding:12px 16px;border-radius:16px;font-size:13px;line-height:1.7}
        .msg.bot .msg-bubble{background:var(--surface);border:1px solid var(--border);border-top-right-radius:4px}
        .msg.user .msg-bubble{background:var(--primary);color:#fff;border-top-left-radius:4px}
        .msg.bot .msg-bubble a{display:inline-block;margin-top:8px;padding:8px 14px;background:var(--primary);color:#fff;border-radius:8px;text-decoration:none;font-size:11px;font-weight:700}
        
        .input-area{background:var(--surface);padding:16px 20px;border-top:1px solid var(--border)}
        .input-wrapper{max-width:700px;margin:0 auto;display:flex;gap:10px;align-items:center}
        .input-wrapper input{flex:1;padding:14px 20px;background:var(--bg);border:2px solid var(--border);border-radius:30px;color:var(--text);outline:none;font-size:14px;font-family:'Cairo',sans-serif;transition:0.3s}
        .input-wrapper input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(168,85,247,0.1)}
        .send-btn{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#ec4899);border:none;color:#fff;font-size:18px;cursor:pointer;transition:0.3s}
        .send-btn:active{transform:scale(0.9)}
        
        .typing{display:flex;gap:4px;padding:6px 0}
        .typing span{width:6px;height:6px;background:var(--muted);border-radius:50%;animation:bounce 1.4s infinite}
        .typing span:nth-child(1){animation-delay:0s}.typing span:nth-child(2){animation-delay:0.2s}.typing span:nth-child(3){animation-delay:0.4s}
        @keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
        
        .progress-card{background:var(--surface);border:2px dashed var(--primary);border-radius:16px;padding:20px;text-align:center;margin:5px 0}
        .progress-bar{width:100%;height:6px;background:var(--border);border-radius:3px;margin:10px 0;overflow:hidden}
        .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--secondary));width:0%;border-radius:3px}
        
        .file-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
        .file-card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
        .file-card .icon{font-size:28px;margin-bottom:4px}
        .file-card .name{font-size:11px;font-weight:700;margin:4px 0}
        .file-card a{display:inline-block;margin-top:6px;padding:6px 14px;background:var(--primary);color:#fff;border-radius:6px;text-decoration:none;font-size:10px;font-weight:700}
        
        .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;background:var(--surface);border:1px solid var(--primary);color:var(--primary-light);padding:10px 24px;border-radius:25px;font-size:13px;font-weight:700}
    </style>
</head>
<body>

<div class="header">
    <div class="logo">🤖</div>
    <div class="info"><h1>مصطفي AI</h1><p>مساعدك الذكي · Agnes 2.0 Flash</p></div>
    <span class="badge">🟢 متصل</span>
</div>

<div class="suggestions-bar">
    <div class="title">💡 <span>اقتراحات سريعة</span></div>
    <div class="suggestions" id="suggestions">
        <button class="suggestion" onclick="quick('اصنع اسكنات')"><span class="emoji">🎨</span> اصنع اسكنات</button>
        <button class="suggestion" onclick="quick('اصنع هاك')"><span class="emoji">☠️</span> اصنع هاك</button>
        <button class="suggestion" onclick="quick('اصنع FPS')"><span class="emoji">⚡</span> اصنع FPS</button>
        <button class="suggestion" onclick="quick('كيف حالك؟')"><span class="emoji">💬</span> كيف حالك؟</button>
        <button class="suggestion" onclick="quick('اشرح الذكاء الاصطناعي')"><span class="emoji">🧠</span> اشرح AI</button>
    </div>
</div>

<div class="main-content">
    <div class="chat-container" id="chat"></div>
</div>

<div class="input-area">
    <div class="input-wrapper">
        <input type="text" id="prompt" placeholder="✍️ اكتب سؤالك أو طلبك هنا..." onkeydown="if(event.key==='Enter')send()">
        <button class="send-btn" onclick="send()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
</div>

<script>
const $=id=>document.getElementById(id);
const API='/api/agnes';
const FILES={
    'اسكنات':[{name:'اسكنات V1',url:'https://www.mediafire.com/file/zksxavlbh9052n2/SKIN_1_APP.zip'},{name:'اسكنات V2',url:'https://www.mediafire.com/file/wjwqpf5u0qd8rt2/SKIN_2_APP_.zip/file'}],
    'هاك':[{name:'هكر V1',url:'https://www.mediafire.com/file/8vc1p8xjzu8h1hn/HACKE_V_1_APP_.zip/file'},{name:'هكر V2',url:'https://www.mediafire.com/file/hhk46due9468tzk/HACKE_V_2_APP_.zip/file'}],
    'fps':[{name:'FPS 165',url:'https://www.mediafire.com/file/vpqwmc0p9pbnbrs/FPS_HACKE_165_V_1_APP_.zip/file'}],
    'فريم':[{name:'FPS 165',url:'https://www.mediafire.com/file/vpqwmc0p9pbnbrs/FPS_HACKE_165_V_1_APP_.zip/file'}]
};
const UNKNOWN=['ايم بوت','aimbot','esp','wallhack','ماجيك','speed','jump','antenna','بوليت','تلي بورت'];

let chatHistory=JSON.parse(localStorage.getItem('mostafa_chat')||'[]');

function save(){localStorage.setItem('mostafa_chat',JSON.stringify(chatHistory.slice(-50)));}
function toast(m){let t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500);}
function quick(t){$('prompt').value=t;$('prompt').focus();send();}

function addMsg(role,html){
    chatHistory.push({role,content:html});save();
    let d=document.createElement('div');d.className='msg '+role;
    d.innerHTML=`<div class="msg-avatar">${role==='user'?'👤':'🤖'}</div><div class="msg-bubble">${html}</div>`;
    $('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;return d;
}
function loader(){
    let d=document.createElement('div');d.className='msg bot';
    d.innerHTML='<div class="msg-avatar">🤖</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    $('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;return d;
}

function renderSaved(){
    chatHistory.forEach(m=>{
        let d=document.createElement('div');d.className='msg '+(m.role==='user'?'user':'bot');
        d.innerHTML=`<div class="msg-avatar">${m.role==='user'?'👤':'🤖'}</div><div class="msg-bubble">${m.content}</div>`;
        $('chat').appendChild(d);
    });
    $('chat').scrollTop=$('chat').scrollHeight;
}

async function send(){
    let t=$('prompt').value.trim();if(!t)return;$('prompt').value='';
    
    addMsg('user',t);
    let lt=t.toLowerCase();
    
    // ========== طلب ملف ==========
    let found=null;
    for(let k in FILES){if(lt.includes(k)){found=FILES[k];break;}}
    
    if(found){
        let l=loader();
        let el=$('chat').lastElementChild;
        let p=0,interval=setInterval(()=>{
            p+=Math.random()*12;if(p>100)p=100;
            el.querySelector('.msg-bubble').innerHTML=`
                <div class="progress-card">
                    <b>⚡ جاري التوليد...</b>
                    <div class="progress-bar"><div class="progress-fill" style="width:${p}%"></div></div>
                    <span style="color:var(--primary-light);font-size:12px;">${Math.floor(p)}%</span>
                </div>`;
            if(p>=100){
                clearInterval(interval);
                el.querySelector('.msg-bubble').innerHTML=`
                    <b>✅ تم التوليد بنجاح!</b>
                    <div class="file-grid">
                        ${found.map(f=>`<div class="file-card"><div class="icon">📦</div><div class="name">${f.name}</div><a href="${f.url}" target="_blank">📥 تحميل</a></div>`).join('')}
                    </div>`;
                save();
            }
        },150);
        return;
    }
    
    // ========== طلب مش متعلمه ==========
    for(let u of UNKNOWN){if(lt.includes(u)){
        let allFiles=[];
        for(let k in FILES){FILES[k].forEach(f=>allFiles.push(f));}
        addMsg('bot',`
            😅 <b>لسه متعلمتش "${u}"</b><br><br>
            📚 <b>الملفات اللي بعرف أعملها:</b>
            <div class="file-grid">
                ${allFiles.map(f=>`<div class="file-card"><div class="icon">📦</div><div class="name">${f.name}</div><a href="${f.url}" target="_blank">📥 تحميل</a></div>`).join('')}
            </div>`);
        return;
    }}
    
    // ========== شات Agnes ==========
    let l=loader();
    try{
        let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'chat',message:t})});
        let d=await r.json();l.remove();
        addMsg('bot',d.success?d.message:'❌ حدث خطأ. جرب تاني!');
    }catch(e){l.remove();addMsg('bot','❌ خطأ في الاتصال');}
}

// بداية
if(chatHistory.length===0){
    addMsg('bot',`👋 <b>أهلاً بيك! أنا مصطفي AI</b><br><br>🎨 <b>أقدر أصنعلك:</b><br>• اسكنات<br>• هاك<br>• FPS<br><br>💬 <b>وأقدر أجاوب على أي سؤال</b><br><br>جرب تكتب فوق أو استخدم الاقتراحات 👆`);
}else{
    renderSaved();
}
</script>
</body>
</html>
