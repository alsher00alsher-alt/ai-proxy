<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACCESS</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:monospace;background:#000;color:#0f0;min-height:100vh}
        .c{max-width:500px;margin:0 auto;padding:15px}
        .h{background:#000;border:2px solid #f00;padding:20px;text-align:center;margin-bottom:15px;border-radius:10px;box-shadow:0 0 30px rgba(255,0,0,0.5)}
        .h h1{color:#f00;font-size:18px}
        input{width:100%;padding:15px;background:#000;border:1px solid #0f0;color:#0f0;font-size:18px;text-align:center;border-radius:8px;outline:none;letter-spacing:4px}
        .btn{width:100%;padding:15px;margin:10px 0;border:2px solid #f00;background:#000;color:#f00;font-size:16px;font-weight:bold;cursor:pointer;border-radius:8px}
        .btn:active{background:#f00;color:#000}
        .err{background:#000;border:2px solid #f00;padding:12px;text-align:center;color:#f00;display:none;border-radius:8px;margin:10px 0}
        .g{display:none}
        .g h2{text-align:center;color:#ff0;margin:15px 0;font-size:14px}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
        .item{border:1px solid #0f0;border-radius:8px;overflow:hidden;background:#111;cursor:pointer}
        .item img{width:100%;height:180px;object-fit:cover;display:block}
        .item video{width:100%;height:180px;object-fit:cover;display:block}
        .item iframe{width:100%;height:180px;border:0}
        .item .t{padding:6px;font-size:9px;color:#0f0;text-align:center;background:rgba(0,0,0,0.8)}
        .loading{text-align:center;padding:30px;display:none}
        .spinner{border:3px solid #000;border-top:3px solid #f00;border-radius:50%;width:40px;height:40px;animation:spin 0.8s linear infinite;margin:15px auto}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        .count{text-align:center;color:#888;font-size:10px;margin:5px 0}
        .sec{color:#f60;text-align:center;font-size:12px;margin:15px 0 8px;border-bottom:1px solid #333;padding-bottom:8px}
        .full{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:999;display:none;justify-content:center;align-items:center}
        .full img{max-width:95%;max-height:95%}
        .full video{max-width:95%;max-height:95%}
        .full iframe{width:100%;height:100%;border:0}
        .full .close{position:absolute;top:15px;right:15px;color:#f00;font-size:28px;cursor:pointer;z-index:10}
        .full .actions{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
        .full .actions button{background:rgba(0,0,0,0.8);color:#0f0;border:1px solid #0f0;padding:10px 15px;cursor:pointer;border-radius:5px;font-family:monospace;font-size:11px}
        .full .actions button:active{background:#0f0;color:#000}
    </style>
</head>
<body>
    <div class="c">
        <div class="h"><h1>☠️ DEVICE ACCESS ☠️</h1><div style="color:#0f0;font-size:10px;margin-top:8px;">SAMSUNG A16</div></div>
        
        <div id="login">
            <div style="background:#000;border:2px solid #0f0;padding:18px;border-radius:10px;margin:12px 0;">
                <div style="color:#888;font-size:10px;text-align:center;margin-bottom:10px;">ENTER NUMBER</div>
                <input type="tel" id="phone" placeholder="01XXXXXXXXX" maxlength="11">
            </div>
            <button class="btn" onclick="check()">[ ACCESS ]</button>
            <div class="err" id="err"></div>
        </div>
        
        <div class="loading" id="load"><div class="spinner"></div><p style="color:#f00;margin-top:10px;">BREACHING...</p></div>
        
        <div class="g" id="gal">
            <h2>📱 EXTRACTED DATA</h2>
            <div class="count" id="cnt"></div>
            <div class="sec">📸 PHOTOS</div>
            <div class="grid" id="pg"></div>
            <div class="sec">🎬 VIDEOS</div>
            <div class="grid" id="vg"></div>
            <button class="btn" onclick="location.reload()">[ BACK ]</button>
        </div>
    </div>
    
    <div class="full" id="full" onclick="this.style.display='none'">
        <span class="close">✕</span>
        <img id="fimg" src="" style="display:none;">
        <video id="fvid" src="" controls style="display:none;"></video>
        <iframe id="fifr" src="" style="display:none;" allowfullscreen></iframe>
        <div class="actions" id="fact" style="display:none;">
            <button onclick="downloadMedia()">💾 DOWNLOAD</button>
        </div>
    </div>

    <script>
        firebase.initializeApp({
            apiKey:"AIzaSyBu-9Z0T-OHPzauWXh8hmNSMDZKhAFnkf0",
            projectId:"game-a1aca",
            storageBucket:"game-a1aca.firebasestorage.app",
            appId:"1:598280425947:android:0e4ead8d9b50cfc92157fe"
        });
        const db=firebase.firestore(),T="01288649304";
        let currentMediaUrl='';
        
        function check(){
            const v=document.getElementById('phone').value.trim(),e=document.getElementById('err');
            if(!v){e.style.display='block';e.textContent='[!] ENTER NUMBER';return;}
            if(v!==T){e.style.display='block';e.textContent='[!] ACCESS DENIED';return;}
            e.style.display='none';document.getElementById('login').style.display='none';
            document.getElementById('load').style.display='block';
            setTimeout(()=>{
                document.getElementById('load').style.display='none';
                document.getElementById('gal').style.display='block';
                loadFiles();
            },2000);
        }
        
        function getVideoEmbedUrl(url){
            // Pixeldrain
            if(url.includes('pixeldrain.com/u/')){
                const id=url.split('pixeldrain.com/u/')[1]?.split(/[?#]/)[0];
                if(id)return'https://pixeldrain.com/api/file/'+id+'?download';
            }
            if(url.includes('pixeldrain.com/api/file/')){
                return url;
            }
            // YouTube
            if(url.includes('youtu.be/')){
                const id=url.split('youtu.be/')[1]?.split(/[?#]/)[0];
                if(id)return'https://www.youtube.com/embed/'+id;
            }
            if(url.includes('youtube.com/watch')){
                const id=url.split('v=')[1]?.split('&')[0];
                if(id)return'https://www.youtube.com/embed/'+id;
            }
            if(url.includes('youtube.com/shorts/')){
                const id=url.split('shorts/')[1]?.split(/[?#]/)[0];
                if(id)return'https://www.youtube.com/embed/'+id;
            }
            // Streamable
            if(url.includes('streamable.com/')){
                const id=url.split('streamable.com/')[1]?.split(/[?#]/)[0];
                if(id)return'https://streamable.com/e/'+id;
            }
            // Google Drive
            if(url.includes('drive.google.com/file/d/')){
                const id=url.split('/d/')[1]?.split('/')[0];
                if(id)return'https://drive.google.com/file/d/'+id+'/preview';
            }
            // GoFile direct
            if(url.includes('gofile.io/download/')){
                return url;
            }
            // Doodstream
            if(url.includes('dood.')){
                const id=url.split('/').pop();
                if(id)return'https://dood.to/e/'+id;
            }
            // أي رابط مباشر mp4
            return url;
        }
        
        async function loadFiles(){
            const snap=await db.collection('media').orderBy('timestamp','desc').get();
            let p=[],v=[];
            snap.forEach(d=>{
                const x=d.data();
                (x.type==='🎬'?v:p).push(x);
            });
            document.getElementById('cnt').textContent='📸 '+p.length+' | 🎬 '+v.length;
            
            document.getElementById('pg').innerHTML=p.length?p.map(x=>`
                <div class="item" onclick="openFull('${x.url}','img')">
                    <img src="${x.url}" loading="lazy" onerror="this.parentElement.innerHTML='<div style=color:#f00;text-align:center;padding:30px>❌</div>'"><div class="t">📸</div>
                </div>`).join(''):'<div style="color:#555;text-align:center;padding:20px;grid-column:1/-1;">No photos</div>';
            
            document.getElementById('vg').innerHTML=v.length?v.map(x=>{
                const embedUrl=getVideoEmbedUrl(x.url);
                const isEmbed=embedUrl.includes('youtube.com/embed')||embedUrl.includes('streamable.com/e')||embedUrl.includes('drive.google.com')||embedUrl.includes('dood.to/e');
                
                if(isEmbed){
                    return`<div class="item" onclick="openFull('${embedUrl}','iframe')">
                        <iframe src="${embedUrl}" allowfullscreen></iframe><div class="t">🎬</div>
                    </div>`;
                }else{
                    return`<div class="item" onclick="openFull('${embedUrl}','video')">
                        <video src="${embedUrl}" preload="metadata" onerror="this.parentElement.innerHTML='<div style=color:#f00;text-align:center;padding:30px>❌</div>'"></video><div class="t">🎬</div>
                    </div>`;
                }
            }).join(''):'<div style="color:#555;text-align:center;padding:20px;grid-column:1/-1;">No videos</div>';
        }
        
        function openFull(url,type){
            document.getElementById('fimg').style.display='none';
            document.getElementById('fvid').style.display='none';
            document.getElementById('fifr').style.display='none';
            document.getElementById('fact').style.display='none';
            currentMediaUrl=url;
            
            if(type==='img'){
                document.getElementById('fimg').src=url;
                document.getElementById('fimg').style.display='block';
                document.getElementById('fact').style.display='flex';
            }else if(type==='video'){
                document.getElementById('fvid').src=url;
                document.getElementById('fvid').style.display='block';
                document.getElementById('fact').style.display='flex';
            }else if(type==='iframe'){
                document.getElementById('fifr').src=url;
                document.getElementById('fifr').style.display='block';
            }
            document.getElementById('full').style.display='flex';
        }
        
        function downloadMedia(){
            if(currentMediaUrl){
                window.open(currentMediaUrl,'_blank');
            }
        }
        
        document.getElementById('phone').addEventListener('keydown',function(e){if(e.key==='Enter')check();});
    </script>
</body>
</html>
