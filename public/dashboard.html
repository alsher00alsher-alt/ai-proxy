<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📱 WhatsApp Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#0a0a0a;color:#fff;display:flex;height:100vh}
.sidebar{width:300px;background:#111;padding:15px;overflow-y:auto;border-left:1px solid #222}
.sidebar h3{color:#25D366;margin-bottom:10px}
.contact{cursor:pointer;padding:12px;background:#1a1a1a;margin:5px 0;border-radius:8px;transition:0.2s}
.contact:hover{background:#222}
.contact.active{background:#25D366;color:#000}
.main{flex:1;display:flex;flex-direction:column}
.header{padding:15px;background:#111;border-bottom:1px solid #222}
.chat-area{flex:1;overflow-y:auto;padding:15px}
.msg{padding:12px;margin:5px 0;border-radius:12px;max-width:80%}
.msg.in{background:#1a1a1a;margin-right:auto}
.msg.out{background:#005c4b;margin-left:auto}
.controls{padding:15px;background:#111;border-top:1px solid #222}
.controls input,.controls button{padding:12px;margin:5px;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:#fff;font-size:14px}
.controls button{background:#25D366;color:#000;font-weight:bold;cursor:pointer;border:none}
.controls button:hover{background:#1ebe57}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1;min-width:100px}
#loginBox{text-align:center;padding:50px;background:#111;margin:20px;border-radius:15px}
#loginBox input{width:100%;padding:15px;font-size:18px;margin:10px 0;background:#1a1a1a;color:#fff;border:1px solid #333;border-radius:8px;text-align:center}
#loginBox button{padding:15px 40px;font-size:18px;background:#25D366;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
#codeBox{display:none;text-align:center;padding:30px;background:#111;margin:20px;border-radius:15px}
#codeBox input{width:200px;padding:15px;font-size:24px;text-align:center;background:#1a1a1a;color:#25D366;border:2px solid #25D366;border-radius:8px;letter-spacing:5px;font-weight:bold}
.status{color:#25D366;font-size:14px;margin-top:10px}
</style>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div id="loginBox">
    <h1>📱 WhatsApp Dashboard</h1>
    <p style="color:#888;margin:20px">اربط واتسابك للتحكم فيه</p>
    <input type="text" id="phoneInput" placeholder="رقم الهاتف (201234567890)">
    <button onclick="requestCode()">🔑 طلب كود الربط</button>
    <p class="status" id="status"></p>
</div>

<!-- شاشة الكود -->
<div id="codeBox">
    <h2>🔑 أدخل الكود</h2>
    <p style="color:#888">وصل إشعار على واتسابك</p>
    <input type="text" id="codeInput" placeholder="XXXX-XXXX" maxlength="9">
    <button onclick="verifyCode()" style="margin-top:15px;padding:15px 30px;background:#25D366;color:#000;border:none;border-radius:8px;font-size:18px;font-weight:bold">✅ تأكيد</button>
</div>

<!-- الشريط الجانبي -->
<div class="sidebar" id="sidebar" style="display:none">
    <h3>📱 جهات الاتصال</h3>
    <div id="contacts"></div>
    <button onclick="refreshContacts()" style="width:100%;padding:10px;margin-top:10px;background:#333;color:#fff;border:none;border-radius:8px">🔄 تحديث</button>
</div>

<!-- المحتوى الرئيسي -->
<div class="main" id="main" style="display:none">
    <div class="header">
        <h2 id="chatTitle">💬 اختر جهة اتصال</h2>
        <p style="color:#888;font-size:14px" id="phoneDisplay"></p>
    </div>
    <div class="chat-area" id="messages">
        <p style="color:#888;text-align:center;margin-top:100px">👈 اختر جهة اتصال</p>
    </div>
    <div class="controls">
        <div class="row">
            <input type="text" id="targetInput" placeholder="📱 رقم الهدف">
            <input type="text" id="msgInput" placeholder="💬 الرسالة">
            <input type="number" id="countInput" placeholder="🔢 العدد" value="10" style="max-width:80px">
        </div>
        <div class="row">
            <button onclick="sendSpam()">🚀 إرسال سبام</button>
            <button onclick="addMembers()">👥 إضافة أعضاء</button>
            <button onclick="getGroups()">📋 الجروبات</button>
        </div>
        <p id="actionStatus" style="margin-top:10px;color:#25D366;font-size:14px"></p>
    </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
const socket=io('https://ai-proxy-production-59b3.up.railway.app');
let myPhone='';
let activeChat='';

// طلب كود الربط
function requestCode(){
    let phone=document.getElementById('phoneInput').value.replace(/\D/g,'');
    if(!phone)return alert('أدخل رقم الهاتف');
    document.getElementById('status').textContent='⏳ جاري طلب الكود...';
    socket.emit('request-pairing',phone);
}

// استقبال الكود
socket.on('pairing-code',(code)=>{
    document.getElementById('loginBox').style.display='none';
    document.getElementById('codeBox').style.display='block';
    document.getElementById('status').textContent='🔑 الكود: '+code;
});

// تأكيد الكود
function verifyCode(){
    let code=document.getElementById('codeInput').value;
    socket.emit('verify-code',code);
}

// متصل
socket.on('connected',(phone)=>{
    myPhone=phone;
    document.getElementById('codeBox').style.display='none';
    document.getElementById('loginBox').style.display='none';
    document.getElementById('sidebar').style.display='block';
    document.getElementById('main').style.display='flex';
    document.getElementById('phoneDisplay').textContent='📱 '+phone;
    refreshContacts();
});

// استقبال جهات الاتصال
socket.on('contacts-list',(contacts)=>{
    let html='';
    contacts.forEach(c=>{
        html+=`<div class="contact" onclick="openChat('${c.jid}','${c.name}')">
            👤 ${c.name}<br><small style="color:#888">${c.phone}</small>
        </div>`;
    });
    document.getElementById('contacts').innerHTML=html||'<p style="color:#888">لا توجد جهات اتصال</p>';
});

// استقبال رسالة
socket.on('chat-message',(msg)=>{
    if(msg.from===activeChat||msg.to===activeChat)addMessage(msg);
});

function addMessage(msg){
    let div=document.createElement('div');
    div.className='msg '+(msg.type||'in');
    div.innerHTML=`<b>${msg.from===myPhone?'📤 أنت':'📥 '+msg.from}</b><br>${msg.text}<br><small style="color:#888">${new Date(msg.time).toLocaleTimeString('ar-EG')}</small>`;
    document.getElementById('messages').appendChild(div);
    document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight;
}

function openChat(jid,name){
    activeChat=jid;
    document.getElementById('chatTitle').textContent='💬 '+name;
    document.getElementById('messages').innerHTML='';
    socket.emit('get-chat',jid);
    document.querySelectorAll('.contact').forEach(c=>c.classList.remove('active'));
    event.target.closest('.contact').classList.add('active');
}

function refreshContacts(){
    socket.emit('get-contacts');
}

function sendSpam(){
    if(!myPhone)return alert('اربط واتساب الأول!');
    let target=document.getElementById('targetInput').value;
    let msg=document.getElementById('msgInput').value;
    let count=parseInt(document.getElementById('countInput').value);
    if(!target||!msg||!count)return alert('املأ جميع الحقول');
    document.getElementById('actionStatus').textContent='⏳ جاري الإرسال...';
    socket.emit('send-spam',{target,message:msg,count});
}

function addMembers(){
    if(!myPhone)return;
    let group=prompt('أدخل معرف الجروب (@ أو ID):');
    let numbers=prompt('أدخل الأرقام (مفصولة بفواصل):');
    if(!group||!numbers)return;
    socket.emit('add-members',{group,numbers:numbers.split(',')});
    document.getElementById('actionStatus').textContent='✅ جاري الإضافة...';
}

function getGroups(){
    socket.emit('get-groups');
}

socket.on('action-done',(msg)=>{
    document.getElementById('actionStatus').textContent='✅ '+msg;
});
</script>
</body>
</html>
