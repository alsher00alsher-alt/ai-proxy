<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📱 WhatsApp Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0a3320;color:#fff;display:flex;height:100vh}
.sidebar{width:300px;background:#0d4728;padding:15px;overflow-y:auto;border-left:2px solid #25D366}
.sidebar h3{color:#25D366;margin-bottom:10px;font-size:20px}
.contact{cursor:pointer;padding:12px;background:#0a3320;margin:5px 0;border-radius:10px;border:1px solid #1a5c3a;transition:0.2s}
.contact:hover{background:#1a5c3a;border-color:#25D366}
.contact.active{background:#25D366;color:#000;font-weight:bold}
.main{flex:1;display:flex;flex-direction:column;background:#0d4728}
.header{padding:15px 20px;background:#0a3320;border-bottom:2px solid #25D366}
.header h2{color:#25D366;font-size:22px}
.chat-area{flex:1;overflow-y:auto;padding:20px;background:#0d4728}
.msg{padding:12px 16px;margin:8px 0;border-radius:15px;max-width:80%;box-shadow:0 2px 5px rgba(0,0,0,0.3)}
.msg.in{background:#0a3320;margin-right:auto;border-bottom-right-radius:5px}
.msg.out{background:#075e54;margin-left:auto;border-bottom-left-radius:5px}
.controls{padding:15px;background:#0a3320;border-top:2px solid #25D366}
.controls input,.controls button{padding:12px 15px;margin:5px;border-radius:10px;border:1px solid #1a5c3a;background:#0d4728;color:#fff;font-size:14px}
.controls input:focus{border-color:#25D366;outline:none}
.controls button{background:#25D366;color:#000;font-weight:bold;cursor:pointer;border:none;transition:0.2s}
.controls button:hover{background:#1ebe57;transform:scale(1.02)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1;min-width:100px}
#loginBox{text-align:center;padding:50px;background:#0a3320;margin:20px auto;border-radius:20px;max-width:450px;border:2px solid #25D366;box-shadow:0 0 30px rgba(37,211,102,0.2)}
#loginBox h1{color:#25D366;font-size:32px;margin-bottom:20px}
#loginBox input{width:100%;padding:15px;font-size:18px;margin:10px 0;background:#0d4728;color:#fff;border:2px solid #1a5c3a;border-radius:10px;text-align:center}
#loginBox input:focus{border-color:#25D366;outline:none}
#loginBox button{padding:15px 40px;font-size:18px;background:#25D366;color:#000;border:none;border-radius:10px;font-weight:bold;cursor:pointer;transition:0.2s}
#loginBox button:hover{background:#1ebe57}
.status{color:#25D366;font-size:16px;margin-top:15px}
.status b{font-size:28px;letter-spacing:4px;background:#0d4728;padding:10px 20px;border-radius:8px;display:inline-block;margin:10px 0}
</style>
</head>
<body>
<div id="loginBox">
    <h1>📱 واتساب داشبورد</h1>
    <input type="text" id="phoneInput" placeholder="رقم الهاتف (201234567890)">
    <button onclick="requestCode()">🔑 طلب كود الربط</button>
    <p class="status" id="status"></p>
</div>

<div class="sidebar" id="sidebar" style="display:none">
    <h3>📱 جهات الاتصال</h3>
    <div id="contacts"></div>
    <button onclick="refreshContacts()" style="width:100%;padding:12px;margin-top:10px;background:#1a5c3a;color:#fff;border:none;border-radius:10px;cursor:pointer">🔄 تحديث</button>
</div>

<div class="main" id="main" style="display:none">
    <div class="header"><h2>💬 واتساب</h2><p style="color:#888" id="phoneDisplay"></p></div>
    <div class="chat-area" id="messages"><p style="color:#25D366;text-align:center;margin-top:100px;font-size:18px">👈 اختر جهة اتصال</p></div>
    <div class="controls">
        <div class="row">
            <input type="text" id="targetInput" placeholder="📱 رقم الهدف">
            <input type="text" id="msgInput" placeholder="💬 الرسالة">
            <input type="number" id="countInput" placeholder="🔢 العدد" value="10" style="max-width:80px">
        </div>
        <div class="row">
            <button onclick="sendSpam()">🚀 سبام</button>
            <button onclick="addMembers()">👥 إضافة أعضاء</button>
            <button onclick="getGroups()">📋 الجروبات</button>
        </div>
        <p id="actionStatus" style="margin-top:10px;color:#25D366;font-size:14px"></p>
    </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
const socket=io('https://ai-proxy-production-59b3.up.railway.app');
let myPhone='',activeChat='';

function requestCode(){
    let phone=document.getElementById('phoneInput').value.replace(/\D/g,'');
    if(!phone)return alert('أدخل رقم الهاتف');
    document.getElementById('status').textContent='⏳ جاري طلب الكود...';
    socket.emit('request-pairing',phone);
}

socket.on('pairing-code',(code)=>{
    document.getElementById('status').innerHTML='🔑 الكود: <b>'+code+'</b><br><small style="color:#888">افتح واتساب → الأجهزة المرتبطة → ربط برقم الهاتف</small>';
});

socket.on('whatsapp-connected',(phone)=>{
    myPhone=phone;
    document.getElementById('loginBox').style.display='none';
    document.getElementById('sidebar').style.display='block';
    document.getElementById('main').style.display='flex';
    document.getElementById('phoneDisplay').textContent='📱 '+phone;
    refreshContacts();
});

socket.on('contacts-list',(contacts)=>{
    document.getElementById('contacts').innerHTML=contacts.map(c=>
        `<div class="contact" onclick="openChat('${c.jid}','${c.name}')">👤 ${c.name}<br><small style="color:#888">${c.phone}</small></div>`
    ).join('');
});

socket.on('chat-message',(msg)=>{
    if(msg.jid===activeChat||msg.from===activeChat)addMsg(msg);
});

function addMsg(msg){
    let div=document.createElement('div');
    div.className='msg '+(msg.type||'in');
    div.innerHTML=`<b style="color:#25D366">${msg.type==='out'?'📤 أنت':'📥 '+msg.from}</b><br>${msg.text}`;
    document.getElementById('messages').appendChild(div);
    document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight;
}

function openChat(jid,name){
    activeChat=jid;
    document.getElementById('chatTitle').textContent='💬 '+name;
    document.getElementById('messages').innerHTML='';
}

function refreshContacts(){socket.emit('get-contacts')}
function sendSpam(){
    let target=document.getElementById('targetInput').value;
    let msg=document.getElementById('msgInput').value;
    let count=parseInt(document.getElementById('countInput').value);
    if(!target||!msg||!count)return;
    socket.emit('send-spam',{target,message:msg,count});
}
function addMembers(){
    let group=prompt('معرف الجروب:');
    let nums=prompt('أرقام (بفواصل):');
    if(group&&nums)socket.emit('add-members',{group,numbers:nums.split(',')});
}
function getGroups(){socket.emit('get-groups')}
socket.on('action-done',(m)=>document.getElementById('actionStatus').textContent=m);
</script>
</body>
</html>
