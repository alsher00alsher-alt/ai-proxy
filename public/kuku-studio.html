<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuvu AI Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0a0a0f, #1a1a2e, #0a0a0f);
            min-height: 100vh;
            color: #fff;
            padding: 15px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            padding: 25px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .header h1 {
            font-size: 24px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding: 5px;
        }
        .tab-btn {
            flex: 1;
            min-width: 80px;
            padding: 12px 8px;
            font-family: 'Cairo', sans-serif;
            font-weight: 800;
            font-size: 11px;
            background: rgba(255,255,255,0.05);
            color: #ccc;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            white-space: nowrap;
        }
        .tab-btn.active {
            background: rgba(102,126,234,0.2);
            color: #667eea;
            border-color: #667eea;
        }
        .tab-btn .icon {
            font-size: 25px;
            display: block;
            margin-bottom: 5px;
        }
        
        /* Workspace */
        .workspace {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px;
        }
        .workspace h2 {
            text-align: center;
            color: #667eea;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-weight: 700;
            color: #ddd;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .input-group textarea, .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            font-family: 'Cairo', sans-serif;
            background: rgba(255,255,255,0.05);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            font-size: 14px;
            resize: none;
        }
        .input-group textarea {
            min-height: 80px;
        }
        .input-group input:focus, .input-group textarea:focus, .input-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102,126,234,0.3);
        }
        .btn {
            width: 100%;
            padding: 15px;
            font-family: 'Cairo', sans-serif;
            font-weight: 900;
            font-size: 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Steps */
        .steps {
            display: none;
            margin: 15px 0;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
        }
        .steps.active {
            display: block;
        }
        .step {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #888;
            transition: all 0.3s;
        }
        .step.active {
            color: #fff;
            background: rgba(102,126,234,0.1);
        }
        .step.done {
            color: #00ff00;
        }
        .step-icon {
            font-size: 20px;
        }
        
        .result {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: rgba(0,255,0,0.1);
            border-radius: 10px;
            text-align: center;
        }
        .result.active {
            display: block;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result img, .result video {
            max-width: 100%;
            border-radius: 10px;
            margin: 10px 0;
        }
        .result a {
            display: inline-block;
            padding: 10px 20px;
            background: #667eea;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 10px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 Kuvu AI Studio</h1>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="selectService('video', this)">
                <span class="icon">🎬</span>
                فيديو
            </button>
            <button class="tab-btn" onclick="selectService('image', this)">
                <span class="icon">🖼️</span>
                صورة
            </button>
            <button class="tab-btn" onclick="selectService('audio', this)">
                <span class="icon">🔊</span>
                صوت
            </button>
            <button class="tab-btn" onclick="selectService('image-to-video', this)">
                <span class="icon">🎥</span>
                صورة➜فيديو
            </button>
            <button class="tab-btn" onclick="selectService('video-edit', this)">
                <span class="icon">✂️</span>
                تعديل فيديو
            </button>
            <button class="tab-btn" onclick="selectService('image-edit', this)">
                <span class="icon">🔄</span>
                تعديل صورة
            </button>
        </div>

        <div class="workspace">
            <h2 id="workspaceTitle">🎬 توليد فيديو</h2>
            
            <div class="input-group">
                <label id="promptLabel">الوصف:</label>
                <textarea id="prompt" placeholder="اكتب الوصف هنا..."></textarea>
            </div>
            
            <div class="input-group" id="resolutionGroup" style="display:none;">
                <label>الجودة:</label>
                <select id="resolution">
                    <option value="720p">720p</option>
                    <option value="1080p" selected>1080p</option>
                    <option value="4k">4K</option>
                </select>
            </div>
            
            <div class="input-group" id="durationGroup" style="display:none;">
                <label>المدة (ثواني):</label>
                <input type="number" id="duration" value="10" min="4" max="15">
            </div>
            
            <div class="input-group" id="urlGroup" style="display:none;">
                <label id="urlLabel">رابط:</label>
                <input type="text" id="mediaUrl" placeholder="https://...">
            </div>
            
            <button class="btn" id="generateBtn" onclick="generate()">🚀 توليد</button>
            
            <div class="steps" id="steps">
                <div class="step" id="step1">
                    <span class="step-icon">📧</span>
                    جاري إنشاء بريد مؤقت...
                </div>
                <div class="step" id="step2">
                    <span class="step-icon">🔗</span>
                    جاري إرسال رابط التحقق...
                </div>
                <div class="step" id="step3">
                    <span class="step-icon">✅</span>
                    جاري التحقق من البريد...
                </div>
                <div class="step" id="step4">
                    <span class="step-icon">🔑</span>
                    جاري تسجيل الدخول...
                </div>
                <div class="step" id="step5">
                    <span class="step-icon">🚀</span>
                    جاري إرسال الطلب...
                </div>
                <div class="step" id="step6">
                    <span class="step-icon">⏳</span>
                    جاري المعالجة...
                </div>
            </div>
            
            <div class="result" id="result"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://unique-courtesy-production.up.railway.app';
        let currentService = 'video';

        function selectService(service, btn) {
            currentService = service;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const title = document.getElementById('workspaceTitle');
            const promptLabel = document.getElementById('promptLabel');
            const resolutionGroup = document.getElementById('resolutionGroup');
            const durationGroup = document.getElementById('durationGroup');
            const urlGroup = document.getElementById('urlGroup');
            const urlLabel = document.getElementById('urlLabel');
            
            resolutionGroup.style.display = 'none';
            durationGroup.style.display = 'none';
            urlGroup.style.display = 'none';
            promptLabel.textContent = 'الوصف:';
            
            if (service === 'video') {
                title.textContent = '🎬 توليد فيديو';
                resolutionGroup.style.display = 'block';
                durationGroup.style.display = 'block';
            } else if (service === 'image') {
                title.textContent = '🖼️ توليد صورة';
            } else if (service === 'audio') {
                title.textContent = '🔊 توليد صوت';
                promptLabel.textContent = 'النص:';
            } else if (service === 'image-to-video') {
                title.textContent = '🎥 صورة لفيديو';
                durationGroup.style.display = 'block';
                urlGroup.style.display = 'block';
                urlLabel.textContent = 'رابط الصورة:';
            } else if (service === 'video-edit') {
                title.textContent = '✂️ تعديل فيديو';
                durationGroup.style.display = 'block';
                urlGroup.style.display = 'block';
                urlLabel.textContent = 'رابط الفيديو:';
            } else if (service === 'image-edit') {
                title.textContent = '🔄 تعديل صورة';
                urlGroup.style.display = 'block';
                urlLabel.textContent = 'رابط الصورة:';
            }
        }

        function setStep(stepNum, status) {
            const step = document.getElementById('step' + stepNum);
            step.classList.remove('active', 'done');
            if (status === 'active') step.classList.add('active');
            if (status === 'done') step.classList.add('done');
        }

        async function generate() {
            const prompt = document.getElementById('prompt').value;
            const resolution = document.getElementById('resolution').value;
            const duration = document.getElementById('duration').value;
            const mediaUrl = document.getElementById('mediaUrl').value;
            const btn = document.getElementById('generateBtn');
            const steps = document.getElementById('steps');
            const result = document.getElementById('result');
            
            if (!prompt) {
                alert('اكتب الوصف أولاً');
                return;
            }
            
            btn.disabled = true;
            steps.classList.add('active');
            result.classList.remove('active');
            
            // Reset steps
            for (let i = 1; i <= 6; i++) setStep(i, '');
            
            // بداية الخطوات
            setStep(1, 'active');
            await sleep(2000);
            setStep(1, 'done');
            
            setStep(2, 'active');
            await sleep(2000);
            setStep(2, 'done');
            
            setStep(3, 'active');
            await sleep(2000);
            setStep(3, 'done');
            
            setStep(4, 'active');
            await sleep(2000);
            setStep(4, 'done');
            
            setStep(5, 'active');
            
            const payload = { prompt: prompt };
            
            if (currentService === 'video') {
                payload.resolution = resolution;
                payload.duration = duration;
            } else if (currentService === 'audio') {
                payload.text = prompt;
            } else if (currentService === 'image-to-video') {
                payload.duration = duration;
                payload.image_url = mediaUrl;
            } else if (currentService === 'video-edit') {
                payload.duration = duration;
                payload.video_url = mediaUrl;
            } else if (currentService === 'image-edit') {
                payload.image_url = mediaUrl;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/${currentService}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                setStep(5, 'done');
                setStep(6, 'active');
                
                const data = await response.json();
                
                setStep(6, 'done');
                
                if (data.status === 'SUCCESS') {
                    result.classList.add('active');
                    if (currentService === 'image') {
                        result.innerHTML = `<h3>✅ تم التوليد!</h3><img src="${data.url}" alt="نتيجة"><br><a href="${data.url}" download>⬇️ تحميل</a>`;
                    } else if (currentService === 'audio') {
                        result.innerHTML = `<h3>✅ تم التوليد!</h3><audio controls src="${data.url}"></audio><br><a href="${data.url}" download>⬇️ تحميل</a>`;
                    } else {
                        result.innerHTML = `<h3>✅ تم التوليد!</h3><video controls src="${data.url}"></video><br><a href="${data.url}" download>⬇️ تحميل</a>`;
                    }
                } else {
                    result.classList.add('active');
                    result.innerHTML = `<h3 style="color:#ff0000;">❌ فشل</h3><p>${data.errorMessage || 'خطأ غير معروف'}</p>`;
                }
            } catch (error) {
                result.classList.add('active');
                result.innerHTML = `<h3 style="color:#ff0000;">❌ خطأ</h3><p>${error.message}</p>`;
            }
            
            btn.disabled = false;
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
    </script>
</body>
</html>
