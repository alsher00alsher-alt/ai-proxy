<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuvu AI Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0a0a0f, #1a1a2e, #0a0a0f);
            min-height: 100vh;
            color: #fff;
        }
        .main-page {
            display: block;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }
        .main-page.hidden { display: none; }
        .header {
            text-align: center;
            padding: 30px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .header h1 {
            font-size: 26px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .services-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .service-card {
            padding: 25px 15px;
            font-family: 'Cairo', sans-serif;
            font-weight: 800;
            font-size: 13px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .service-card:hover {
            background: rgba(102,126,234,0.15);
            border-color: #667eea;
            transform: translateY(-5px);
        }
        .service-card .icon {
            font-size: 45px;
            display: block;
            margin-bottom: 12px;
        }
        .service-page {
            display: none;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
        }
        .service-page.active { display: block; }
        .service-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .back-btn {
            width: 45px;
            height: 45px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }
        .service-title {
            flex: 1;
            text-align: center;
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .service-icon-large {
            text-align: center;
            font-size: 80px;
            margin: 20px 0;
            animation: float 2s infinite;
        }
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-weight: 700;
            color: #ddd;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .input-group textarea, .input-group input, .input-group select {
            width: 100%;
            padding: 14px;
            font-family: 'Cairo', sans-serif;
            background: rgba(255,255,255,0.05);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            font-size: 14px;
            resize: none;
        }
        .input-group textarea { min-height: 100px; }
        .btn {
            width: 100%;
            padding: 16px;
            font-family: 'Cairo', sans-serif;
            font-weight: 900;
            font-size: 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .loading {
            display: none;
            text-align: center;
            margin: 15px 0;
            font-weight: 700;
            color: #f39c12;
        }
        .loading.active { display: block; animation: blink 1s infinite; }
        @keyframes blink {
            0%,100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .result {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: rgba(0,255,0,0.1);
            border-radius: 10px;
            text-align: center;
        }
        .result.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result img, .result video { max-width: 100%; border-radius: 10px; margin: 10px 0; }
        .result a {
            display: inline-block;
            padding: 10px 20px;
            background: #667eea;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 10px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="main-page" id="mainPage">
        <div class="header">
            <h1>🎨 Kuvu AI Studio</h1>
        </div>
        <div class="services-grid">
            <button class="service-card" onclick="openService('video')">
                <span class="icon">🎬</span>توليد فيديو
            </button>
            <button class="service-card" onclick="openService('image')">
                <span class="icon">🖼️</span>توليد صورة
            </button>
            <button class="service-card" onclick="openService('audio')">
                <span class="icon">🔊</span>توليد صوت
            </button>
            <button class="service-card" onclick="openService('image-to-video')">
                <span class="icon">🎥</span>صورة لفيديو
            </button>
            <button class="service-card" onclick="openService('video-edit')">
                <span class="icon">✂️</span>تعديل فيديو
            </button>
            <button class="service-card" onclick="openService('image-edit')">
                <span class="icon">🔄</span>تعديل صورة
            </button>
        </div>
    </div>

    <div class="service-page" id="servicePage">
        <div class="service-header">
            <button class="back-btn" onclick="goBack()">→</button>
            <div class="service-title" id="serviceTitle">🎬 توليد فيديو</div>
        </div>
        <div class="service-icon-large" id="serviceIcon">🎬</div>
        
        <div class="input-group">
            <label id="promptLabel">✍️ الوصف:</label>
            <textarea id="prompt" placeholder="اكتب الوصف هنا..."></textarea>
        </div>
        
        <div class="input-group" id="resolutionGroup" style="display:none;">
            <label>📊 الجودة:</label>
            <select id="resolution">
                <option value="720p">720p</option>
                <option value="1080p" selected>1080p</option>
                <option value="4k">4K</option>
            </select>
        </div>
        
        <div class="input-group" id="durationGroup" style="display:none;">
            <label>⏱️ المدة (ثواني):</label>
            <input type="number" id="duration" value="10" min="4" max="15">
        </div>
        
        <div class="input-group" id="urlGroup" style="display:none;">
            <label id="urlLabel">🔗 الرابط:</label>
            <input type="text" id="mediaUrl" placeholder="https://...">
        </div>
        
        <button class="btn" id="generateBtn" onclick="generate()">🚀 توليد</button>
        
        <div class="loading" id="loading">⏳ جاري المعالجة... قد يستغرق دقيقة</div>
        <div class="result" id="result"></div>
    </div>

    <script>
        const API_BASE = 'https://unique-courtesy-production.up.railway.app';
        let currentService = '';

        function openService(service) {
            currentService = service;
            document.getElementById('mainPage').classList.add('hidden');
            document.getElementById('servicePage').classList.add('active');
            
            const title = document.getElementById('serviceTitle');
            const icon = document.getElementById('serviceIcon');
            const promptLabel = document.getElementById('promptLabel');
            const resolutionGroup = document.getElementById('resolutionGroup');
            const durationGroup = document.getElementById('durationGroup');
            const urlGroup = document.getElementById('urlGroup');
            const urlLabel = document.getElementById('urlLabel');
            
            resolutionGroup.style.display = 'none';
            durationGroup.style.display = 'none';
            urlGroup.style.display = 'none';
            promptLabel.textContent = '✍️ الوصف:';
            
            if (service === 'video') {
                title.textContent = '🎬 توليد فيديو';
                icon.textContent = '🎬';
                resolutionGroup.style.display = 'block';
                durationGroup.style.display = 'block';
            } else if (service === 'image') {
                title.textContent = '🖼️ توليد صورة';
                icon.textContent = '🖼️';
            } else if (service === 'audio') {
                title.textContent = '🔊 توليد صوت';
                icon.textContent = '🔊';
                promptLabel.textContent = '✍️ النص:';
            } else if (service === 'image-to-video') {
                title.textContent = '🎥 صورة لفيديو';
                icon.textContent = '🎥';
                durationGroup.style.display = 'block';
                urlGroup.style.display = 'block';
                urlLabel.textContent = '🔗 رابط الصورة:';
            } else if (service === 'video-edit') {
                title.textContent = '✂️ تعديل فيديو';
                icon.textContent = '✂️';
                durationGroup.style.display = 'block';
                urlGroup.style.display = 'block';
                urlLabel.textContent = '🔗 رابط الفيديو:';
            } else if (service === 'image-edit') {
                title.textContent = '🔄 تعديل صورة';
                icon.textContent = '🔄';
                urlGroup.style.display = 'block';
                urlLabel.textContent = '🔗 رابط الصورة:';
            }
            
            document.getElementById('prompt').value = '';
            document.getElementById('mediaUrl').value = '';
            document.getElementById('loading').classList.remove('active');
            document.getElementById('result').classList.remove('active');
        }

        function goBack() {
            document.getElementById('servicePage').classList.remove('active');
            document.getElementById('mainPage').classList.remove('hidden');
        }

        async function generate() {
            const prompt = document.getElementById('prompt').value;
            const resolution = document.getElementById('resolution').value;
            const duration = document.getElementById('duration').value;
            const mediaUrl = document.getElementById('mediaUrl').value;
            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            
            if (!prompt) {
                alert('اكتب الوصف أولاً');
                return;
            }
            
            btn.disabled = true;
            loading.classList.add('active');
            result.classList.remove('active');
            
            const payload = { prompt: prompt };
            
            if (currentService === 'video') {
                payload.resolution = resolution;
                payload.duration = duration;
            } else if (currentService === 'audio') {
                payload.text = prompt;
            } else if (currentService === 'image-to-video') {
                payload.duration = duration;
                payload.image_url = mediaUrl;
            } else if (currentService === 'video-edit') {
                payload.duration = duration;
                payload.video_url = mediaUrl;
            } else if (currentService === 'image-edit') {
                payload.image_url = mediaUrl;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/${currentService}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                if (data.status === 'SUCCESS') {
                    result.classList.add('active');
                    if (currentService === 'image') {
                        result.innerHTML = `<h3>✅ تم التوليد!</h3><img src="${data.url}" alt="نتيجة"><br><a href="${data.url}" download>⬇️ تحميل</a>`;
                    } else if (currentService === 'audio') {
                        result.innerHTML = `<h3>✅ تم التوليد!</h3><audio controls src="${data.url}"></audio><br><a href="${data.url}" download>⬇️ تحميل</a>`;
                    } else {
                        result.innerHTML = `<h3>✅ تم التوليد!</h3><video controls src="${data.url}"></video><br><a href="${data.url}" download>⬇️ تحميل</a>`;
                    }
                } else {
                    result.classList.add('active');
                    result.innerHTML = `<h3 style="color:#ff0000;">❌ فشل</h3><p>${data.errorMessage || 'خطأ'}</p>`;
                }
            } catch (error) {
                result.classList.add('active');
                result.innerHTML = `<h3 style="color:#ff0000;">❌ خطأ</h3><p>${error.message}</p>`;
            }
            
            btn.disabled = false;
            loading.classList.remove('active');
        }
    </script>
</body>
</html>
