<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>⬇️ Media Downloader</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:linear-gradient(135deg,#0f0f0f,#1a1a2e,#0f0f0f);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{max-width:500px;width:100%;background:rgba(255,255,255,.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:25px;padding:35px;box-shadow:0 25px 60px rgba(0,0,0,.5)}
.logo{width:80px;height:80px;margin:0 auto 20px;background:linear-gradient(135deg,#8b5cf6,#3b82f6);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:40px;animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.title{text-align:center;font-size:26px;font-weight:800;background:linear-gradient(135deg,#8b5cf6,#3b82f6,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:5px}
.subtitle{text-align:center;color:#888;font-size:13px;margin-bottom:25px}
input{width:100%;padding:16px 20px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);border-radius:15px;color:#fff;font-size:14px;outline:none;transition:all .3s;margin-bottom:20px}
input:focus{border-color:#8b5cf6;box-shadow:0 0 20px rgba(139,92,246,.3)}
input::placeholder{color:#666}
.mode-group{display:flex;gap:12px;margin-bottom:25px}
.mode-btn{flex:1;padding:16px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.15);border-radius:15px;cursor:pointer;text-align:center;transition:all .3s;font-size:14px;font-weight:600}
.mode-btn.active{background:rgba(139,92,246,.15);border-color:#8b5cf6}
.mode-btn .icon{font-size:30px;display:block;margin-bottom:8px}
.download-btn{width:100%;padding:18px;background:linear-gradient(135deg,#8b5cf6,#3b82f6);border:none;border-radius:15px;color:#fff;font-size:18px;font-weight:800;cursor:pointer}
.download-btn:disabled{opacity:.5}
.spinner{display:none;width:30px;height:30px;border:3px solid rgba(255,255,255,.1);border-top-color:#8b5cf6;border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.result{display:none;margin-top:20px;text-align:center}
.result img{width:100%;border-radius:15px;margin-bottom:15px}
.download-link{display:inline-block;padding:15px 30px;background:#22c55e;color:#fff;border-radius:15px;text-decoration:none;font-weight:800}
.error{display:none;margin-top:20px;padding:15px;background:rgba(239,68,68,.15);border-radius:15px;text-align:center;color:#ef4444}
</style>
</head>
<body>
<div class="card">
    <div class="logo">📥</div>
    <h1 class="title">Media Downloader</h1>
    <p class="subtitle">حمّل من يوتيوب، تيك توك، انستجرام وأكتر</p>
    <input type="text" id="url" placeholder="🔗 الصق الرابط هنا...">
    <div class="mode-group">
        <div class="mode-btn active" onclick="selectMode(this,'mp3')"><span class="icon">🎵</span>MP3</div>
        <div class="mode-btn" onclick="selectMode(this,'mp4')"><span class="icon">🎬</span>MP4</div>
    </div>
    <button class="download-btn" id="btn" onclick="download()">⬇️ تحميل</button>
    <div class="spinner" id="spinner"></div>
    <div class="result" id="result">
        <img id="thumb" src="">
        <div class="video-title" id="title"></div>
        <a class="download-link" id="link" href="#" download>📥 تحميل الآن</a>
    </div>
    <div class="error" id="error"></div>
</div>

<script>
let mode='mp3';
function selectMode(el,m){mode=m;document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');}
async function download(){
    const url=document.getElementById('url').value.trim();
    if(!url)return showError('الصق الرابط');
    document.getElementById('result').style.display='none';
    document.getElementById('error').style.display='none';
    document.getElementById('spinner').style.display='block';
    document.getElementById('btn').disabled=true;
    try{
        const res=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,mode})});
        const data=await res.json();
        if(data.success){
            document.getElementById('spinner').style.display='none';
            document.getElementById('result').style.display='block';
            document.getElementById('thumb').src=data.thumbnail||'';
            document.getElementById('title').textContent=data.title||'تم';
            document.getElementById('link').href=data.downloadUrl;
        }else{showError(data.error||'فشل');}
    }catch(e){showError('خدمة غير متاحة');}
    document.getElementById('btn').disabled=false;
}
function showError(msg){const e=document.getElementById('error');e.textContent='❌ '+msg;e.style.display='block';document.getElementById('spinner').style.display='none';setTimeout(()=>e.style.display='none',5000);}
document.getElementById('url').addEventListener('keypress',e=>{if(e.key==='Enter')download();});
</script>
</body>
</html>
