<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>⬇️ Downloader</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:linear-gradient(135deg,#0f0f0f,#1a1a2e);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{max-width:450px;width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:25px;padding:35px}
h1{text-align:center;margin-bottom:20px;background:linear-gradient(135deg,#8b5cf6,#ec4899);-webkit-background-clip:text;color:transparent}
input{width:100%;padding:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:15px;color:#fff;font-size:14px;outline:none;margin-bottom:15px}
.mode{display:flex;gap:10px;margin-bottom:20px}
.mode button{flex:1;padding:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.mode button.active{background:rgba(139,92,246,.2);border-color:#8b5cf6}
.dl{width:100%;padding:18px;background:linear-gradient(135deg,#8b5cf6,#ec4899);border:none;border-radius:15px;color:#fff;font-size:18px;font-weight:800;cursor:pointer}
.msg{display:none;margin-top:15px;padding:15px;border-radius:12px;text-align:center}
.success{background:rgba(34,197,94,.15);color:#22c55e}
.error{background:rgba(239,68,68,.15);color:#ef4444}
.loading{display:none;text-align:center;margin-top:15px;color:#8b5cf6}
</style>
</head>
<body>
<div class="card">
    <h1>📥 Media Downloader</h1>
    <input type="text" id="url" placeholder="🔗 الصق الرابط هنا...">
    <div class="mode">
        <button id="mp3Btn" class="active" onclick="setMode('mp3')">🎵 MP3</button>
        <button id="mp4Btn" onclick="setMode('mp4')">🎬 MP4</button>
    </div>
    <button class="dl" onclick="download()">⬇️ تحميل</button>
    <div class="loading" id="loading">⏳ جاري المعالجة...</div>
    <div class="msg" id="msg"></div>
</div>

<script>
let mode='mp3';
function setMode(m){
    mode=m;
    document.getElementById('mp3Btn').classList.toggle('active',m==='mp3');
    document.getElementById('mp4Btn').classList.toggle('active',m==='mp4');
}
async function download(){
    const url=document.getElementById('url').value.trim();
    if(!url)return showMsg('الصق الرابط','error');
    document.getElementById('loading').style.display='block';
    document.getElementById('msg').style.display='none';
    
    try{
        const res=await fetch('/api/download',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({url,mode})
        });
        const data=await res.json();
        document.getElementById('loading').style.display='none';
        
        if(data.success){
            showMsg('✅ تم! جاري التحميل...','success');
            window.open(data.downloadUrl,'_blank');
        }else{
            showMsg('❌ '+data.error,'error');
        }
    }catch(e){
        document.getElementById('loading').style.display='none';
        showMsg('❌ خدمة غير متاحة','error');
    }
}
function showMsg(text,type){
    const m=document.getElementById('msg');
    m.textContent=text;
    m.className='msg '+type;
    m.style.display='block';
}
document.getElementById('url').addEventListener('keypress',e=>{if(e.key==='Enter')download();});
</script>
</body>
</html>
