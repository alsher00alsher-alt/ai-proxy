<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم وبناء التطبيقات</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            font-size: 18px;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #4CAF50;
            font-size: 26px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 18px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background: #4CAF50;
            color: white;
            padding: 16px;
            font-size: 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #45a049;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
        }
        .success { background: #2e7d32; }
        .error { background: #c62828; }
    </style>
</head>
<body>
    <div class="container">
        <h2>منشئ وتحديث التطبيقات</h2>
        <div class="form-group">
            <label>اسم التطبيق:</label>
            <input type="text" id="appName" value="تطبيقي المالي">
        </div>
        <div class="form-group">
            <label>اسم الحزمة (Package):</label>
            <input type="text" id="packageName" value="com.app.finance">
        </div>
        <div class="form-group">
            <label>محتوى الواجهة (تسجيل الدخول، المبالغ، المعاملات):</label>
            <textarea id="htmlContent" rows="8"><div style="padding:20px; font-size:18px; background:#121212; color:#fff; height:100vh;">
    <h2>تسجيل الدخول</h2>
    <input type="text" placeholder="اسم المستخدم" style="padding:12px; width:100%; margin-bottom:10px; background:#222; color:#fff; border:1px solid #444; border-radius:6px;">
    <input type="password" placeholder="كلمة المرور" style="padding:12px; width:100%; margin-bottom:15px; background:#222; color:#fff; border:1px solid #444; border-radius:6px;">
    <button style="width:100%; padding:12px; background:#4CAF50; color:#fff; border:none; border-radius:6px; font-size:18px;">دخول</button>
    <hr style="margin:20px 0; border-color:#444;">
    <h3>حسابي والمعاملات</h3>
    <p><strong>المبلغ المتاح:</strong> 12,500 جنيه</p>
    <ul>
      <li>إيداع مبلغ: +5,000 ج</li>
      <li>تحويل لمعاملة #102: -1,200 ج</li>
    </ul>
  </div></textarea>
        </div>
        <button onclick="buildApp()">بناء وتحميل APK</button>
        <div id="result"></div>
    </div>

    <script>
        async function buildApp() {
            const appName = document.getElementById('appName').value;
            const packageName = document.getElementById('packageName').value;
            const htmlContent = document.getElementById('htmlContent').value;
            const resultDiv = document.getElementById('result');

            resultDiv.innerHTML = "جاري بناء التطبيق على السيرفر... برجاء الانتظار";
            resultDiv.className = "";

            try {
                const response = await fetch('/build', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ app_name: appName, package_name: packageName, html_content: htmlContent })
                });

                const text = await response.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    throw new Error("استجابة غير صالحة من السيرفر: " + text.slice(0, 100));
                }

                if (data.status === 'success') {
                    resultDiv.className = "success";
                    resultDiv.innerHTML = `تم بناء التطبيق بنجاح! <br><br><a href="${data.download}" target="_blank" style="color: #fff; text-decoration: underline; font-weight: bold; font-size: 20px;">اضغط هنا لتحميل ملف APK</a>`;
                } else {
                    resultDiv.className = "error";
                    resultDiv.innerHTML = "خطأ من السيرفر: " + (data.message || 'حدث خطأ غير معروف');
                }
            } catch (err) {
                resultDiv.className = "error";
                resultDiv.innerHTML = "خطأ في الاتصال: " + err.message;
            }
        }
    </script>
</body>
</html>
