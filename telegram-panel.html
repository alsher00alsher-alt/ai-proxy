<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram & NumberPanel Bot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0e1621;
            color: #fff;
            margin: 0;
            padding: 0;
            font-size: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #17212b;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #242f3d;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 22px;
            border-bottom: 1px solid #111;
        }
        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 10px;
            line-height: 1.5;
            word-break: break-word;
        }
        .message.user {
            background: #2b5278;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .message.bot {
            background: #182533;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #242f3d;
        }
        .input-panel {
            background: #17212b;
            padding: 15px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #242f3d;
        }
        input, button {
            padding: 14px;
            border-radius: 8px;
            border: none;
            font-size: 18px;
        }
        input {
            flex: 1;
            background: #242f3d;
            color: #fff;
        }
        button {
            background: #5288c1;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #4072a7;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>Telegram Bot & NumberPanel</header>
        
        <div class="chat-box" id="chatBox">
            <div class="message bot">أهلاً بك! اضغط على Start أو أرسل رسالة لبدء التفاعل مع الأرقام والخدمات.</div>
        </div>

        <div class="input-panel">
            <input type="text" id="userInput" placeholder="اكتب رسالتك هنا...">
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            if (!input.value.trim()) return;

            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = input.value;
            chatBox.appendChild(userMsg);

            const text = input.value;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(() => {
                const botMsg = document.createElement('div');
                botMsg.className = 'message bot';
                botMsg.textContent = "رد البوت على: " + text;
                chatBox.appendChild(botMsg);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 500);
        }
    </script>
</body>
</html>
