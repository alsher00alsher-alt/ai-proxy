<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Interface - NumberPanel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0e1621;
            color: #fff;
            margin: 0;
            padding: 0;
            font-size: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #17212b;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #242f3d;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 22px;
            border-bottom: 1px solid #111;
        }
        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 12px;
            line-height: 1.6;
            word-break: break-word;
            font-size: 19px;
        }
        .message.user {
            background: #2b5278;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .message.bot {
            background: #182533;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #242f3d;
        }
        .input-panel {
            background: #17212b;
            padding: 15px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #242f3d;
        }
        input, button {
            padding: 14px;
            border-radius: 8px;
            border: none;
            font-size: 18px;
        }
        input {
            flex: 1;
            background: #242f3d;
            color: #fff;
        }
        button {
            background: #5288c1;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #4072a7;
        }
    </style>
</head>
<body>

    <div class="container">
        <header id="panelTitle">NUMBER BOT 🤖</header>
        
        <div class="chat-box" id="chatBox">
            <div class="message bot">👋 أهلاً بك في NUMBER BOT!<br>أنا بوت الأرقام الافتراضية.<br>اكتب <b>START</b> للبدء واستعراض الخدمات المتاحة.</div>
        </div>

        <div class="input-panel">
            <input type="text" id="userInput" placeholder="اكتب رسالتك هنا...">
            <button onclick="handleUserMessage()">إرسال</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerHTML = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleUserMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';

            if (text.toUpperCase() === 'START' || text.includes('بدء')) {
                appendMessage('⏳ جاري الاتصال بالخادم وجلب الخدمات...', 'bot');
                setTimeout(() => {
                    appendMessage('✅ تم الاتصال بنجاح!<br>الخدمات المتاحة حالياً:<br>1️⃣ WhatsApp<br>2️⃣ Telegram<br>3️⃣ Google<br><br>أرسل رقم الخدمة أو اسمها لطلب رقم.', 'bot');
                }, 1000);
            } else {
                appendMessage('⚠️ تم استلام طلبك: ' + text + '<br>جارٍ معالجة الرقم من الخادم...', 'bot');
            }
        }

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                handleUserMessage();
            }
        });
    </script>
</body>
</html>
